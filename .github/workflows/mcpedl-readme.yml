name: Update MCPEDL README

on:
  push:
    branches: [main]
    paths:
      - "MCPEDL/**"
      - "!MCPEDL/README.md"
      - "builds/**"
      - "scripts/build_mcpedl_readme.py"
  workflow_run:
    workflows: ["Build Changed Packs & Sync Catalogs"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mcpedl-readme
  cancel-in-progress: false

jobs:
  readme:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Build MCPEDL/README.md
        run: python3 scripts/build_mcpedl_readme.py
      - name: Commit when changed
        run: |
          if [ -z "$(git status --porcelain -- MCPEDL/README.md)" ]; then
            echo "MCPEDL/README.md unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add MCPEDL/README.md
          git commit -m "chore: refresh MCPEDL README [skip ci]"
          git pull --rebase
          git push
