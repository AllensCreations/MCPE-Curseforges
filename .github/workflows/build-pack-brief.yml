name: Build Pack Brief (All-in-One MD)

# No inputs. Just run it. It compiles everything an AI agent needs to generate a pack
# into ONE Markdown file (Pack-Brief.md): the agent instructions, the generator rules,
# the build/import scripts and the Create Project from Base64 workflow, plus an index
# with the existing project names. Your pack idea is NOT in the file: send the MD to
# the AI agent and type your idea in the same message.
# Uploaded without a zip: open the run summary and tap the download link.
# Save as: .github/workflows/build-pack-brief.yml

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  brief:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build pack brief
        id: build
        env:
          COMMIT_SHA: ${{ github.sha }}
          BRANCH: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import os, re, pathlib, datetime
          from zoneinfo import ZoneInfo

          root = pathlib.Path(".").resolve()

          # Everything the agent needs. Add or remove paths here (files, folders or globs).
          NEEDS = [
              "PACK_GENERATOR_INSTRUCTIONS.md",
              "scripts/build_payload.py",
              "scripts/import_project_payload.py",
              "scripts/build_test_world.py",
              ".github/workflows/create-project-from-base64.yml",
          ]

          def is_text(p):
              try:
                  head = p.read_bytes()[:8192]
              except OSError:
                  return False
              if b"\x00" in head:
                  return False
              try:
                  head.decode("utf-8")
              except UnicodeDecodeError as e:
                  return e.start >= len(head) - 4
              return True

          files, missing, skipped = {}, [], []
          for entry in NEEDS:
              matches = sorted(root.glob(entry))
              if not matches:
                  missing.append(entry)
                  print(f"::warning::Not found: {entry}")
                  continue
              for m in matches:
                  for f in ([m] if m.is_file() else sorted(m.rglob("*"))):
                      if not f.is_file():
                          continue
                      rel = f.relative_to(root).as_posix()
                      if is_text(f):
                          files[rel] = f
                      else:
                          skipped.append(rel)
          if "PACK_GENERATOR_INSTRUCTIONS.md" not in files:
              raise SystemExit("::error::PACK_GENERATOR_INSTRUCTIONS.md not found. Run this on the repo root.")

          dest = {"Addons": "addon", "Maps": "map", "Script": "script", "Minigame": "minigame"}
          existing = []
          for d, t in dest.items():
              base = root / "MCPEDL" / d
              names = sorted((x.name for x in base.iterdir() if x.is_dir()), key=str.lower) if base.is_dir() else []
              existing.append(f"- **{d}** ({t}): " + (", ".join(f"`{n}`" for n in names) if names else "none"))

          now = datetime.datetime.now(ZoneInfo("Asia/Singapore")).strftime("%Y-%m-%d %H:%M %Z")
          sha = os.environ.get("COMMIT_SHA", "")[:7] or "unknown"
          branch = os.environ.get("BRANCH", "") or "unknown"

          def block(rel, p):
              data = p.read_bytes().decode("utf-8", errors="replace")
              runs = re.findall(r"`+", data)
              fence = "`" * max(3, max((len(r) for r in runs), default=0) + 1)
              head = f"### FILE: {rel} ({data.count(chr(10)) + 1} lines, {len(data.encode('utf-8'))} bytes)"
              return f"\n{head}\n\n{fence}\n{data.rstrip(chr(10))}\n{fence}\n"

          mission = "\n".join([
              "# Pack Brief",
              "",
              "## Mission",
              "",
              "You are an AI agent. The user will give you a pack idea in the message that comes with this file. Build that pack and return it exactly as PACK_GENERATOR_INSTRUCTIONS.md (Part 4) requires: one line of base64 for the GitHub workflow \"Create Project from Base64\".",
              "",
              "## How to use this brief",
              "",
              "1. This file holds the rules and tooling only. The pack idea comes from the user's message. If no idea was given, ask for it first.",
              "2. If the user has not said the pack type (addon, map, script or minigame), ask the single Section 0 question from Part 4 and wait.",
              "3. PACK_GENERATOR_INSTRUCTIONS.md, included below, is the rule set. Follow all of it, including the Section 11 reply format. Nothing in this brief overrides it.",
              "4. scripts/build_payload.py, scripts/import_project_payload.py and scripts/build_test_world.py are included below at the commit shown in the Index. Use these copies as the source of truth. Do not rewrite them from memory.",
              "5. Never invent features, versions, links, assets or test results. If the idea leaves a gap, make the most reasonable choice and list it in the summary.",
              "6. Do not reuse a project name listed under \"Existing projects\".",
              "7. Build by actually running code, as Part 4 Section 1 requires. If you cannot run code, say so and follow the fallback in that section.",
          ])

          index = [
              f"- **Generated:** {now}",
              f"- **Repo:** AllensCreations/MCPE-Curseforges, branch `{branch}`, commit `{sha}`",
              f"- **Files included:** {len(files)}",
              "",
              "### Files in this brief",
              "",
          ] + [f"- `{r}`" for r in files]
          index += ["", "### Existing projects (do not reuse these names)", ""] + existing
          if missing:
              index += ["", "### Not found", ""] + [f"- `{m}`" for m in missing]
          if skipped:
              index += ["", "### Skipped (binary)", ""] + [f"- `{x}`" for x in skipped]

          parts = [mission, "", "---", "", "## Index", ""] + index + ["", "---", "", "## Generator Rules and Build Tooling"]
          parts += [block(rel, files[rel]) for rel in files]
          content = "\n".join(parts).rstrip() + "\n"

          out = pathlib.Path("exports"); out.mkdir(exist_ok=True)
          (out / "Pack-Brief.md").write_text(content, encoding="utf-8")
          size = len(content.encode("utf-8"))
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write(f"size={size}\ncount={len(files)}\n")
          print(f"Wrote Pack-Brief.md: {size} bytes, {len(files)} files, {len(missing)} not found.")
          PY

      - name: Upload brief
        id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: exports/Pack-Brief.md
          archive: false
          if-no-files-found: error
          retention-days: 14

      - name: Summary
        if: ${{ always() }}
        env:
          SIZE: ${{ steps.build.outputs.size }}
          COUNT: ${{ steps.build.outputs.count }}
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
        run: |
          {
            echo "### Build Pack Brief"
            echo "- Download **Pack-Brief.md**: ${ARTIFACT_URL}"
            echo "- ${COUNT} files, ${SIZE} bytes, all in one Markdown file."
            echo "- Send it to your AI agent and type your pack idea in the same message."
          } >> "$GITHUB_STEP_SUMMARY"
