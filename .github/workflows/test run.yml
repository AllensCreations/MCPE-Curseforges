name: Test Local Server

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  run-server:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Start server in background
        run: |
          npm start &
          # Or swap with: npm run dev &

      - name: Wait for server and test endpoint
        run: |
          # Wait up to 30 seconds for localhost:3000 to respond
          timeout 30 bash -c 'until curl --silent --fail http://localhost:3000; do sleep 2; done'
          
          # Optional: Run your test suite against localhost here
          echo "Server is running and healthy!"
