jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install

      - name: Start Local Server in Background
        run: |
          npm start &
          npx wait-on http://localhost:3000

      - name: Run Tests Against Localhost
        run: npm run test:e2e
