name: Refresh Add-ons and Rebuild Packs

on:
  # Refresh packages automatically every day, even when no source files changed.
  schedule:
    - cron: "17 2 * * *"
  # Allow an immediate refresh of every project or one selected project.
  workflow_dispatch:
    inputs:
      target:
        description: 'Project folder name, or "all" to refresh every project'
        required: true
        default: all
        type: string

permissions:
  contents: write

concurrency:
  group: refresh-and-build-packs
  cancel-in-progress: false

jobs:
  refresh-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.x"

      - name: Convert icon files to pack_icon.png
        run: |
          set -euo pipefail
          pip install pillow
          python3 scripts/make_pack_icon.py

      - name: Refresh projects and rebuild distributable packs
        env:
          TARGET: ${{ github.event.inputs.target || 'all' }}
        run: |
          set -euo pipefail
          if [ "$TARGET" = "all" ]; then
            python3 scripts/auto_bump_and_build.py --all --no-bump
          else
            python3 scripts/auto_bump_and_build.py --project "$TARGET" --no-bump
          fi

      - name: Commit and push refreshed packs and catalogs
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          for dir in MCPEDL packs minigames maps builds; do
            if [ -d "$dir" ]; then git add "$dir"; fi
          done
          if [ -f README.md ]; then git add README.md; fi

          if git diff --cached --quiet; then
            echo "All packages and catalogs are already up to date."
          else
            git commit -m "chore(build): refresh project packages and catalogs [skip ci]"
            git push origin main
          fi
