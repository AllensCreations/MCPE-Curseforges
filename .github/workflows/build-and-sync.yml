name: Build Changed Packs & Sync Catalogs

# PASSIVE BUILD. It runs by itself on every push to main (and daily), and always rebuilds ALL
# projects, so there is nothing to pick and nothing to configure.
#
#   - It NEVER bumps a version. Versions only change in "Publish to CurseForge".
#   - Each pack's BP and RP manifests are aligned to the highest version already in the pack.
#   - builds/<pack>/versions/V<X.Y.Z>/ (packages, source.zip, source.sha256, build_info.json) is
#     created or REFRESHED IN PLACE whenever the source or the packages differ from the snapshot.
#   - Catalogs, READMEs, download links, changelog views, CurseForge description views and image prompts are re-synced.
#     Description views and image prompts are rebuilt only for packs whose inputs changed.
#   - Pixel textures are re-rendered from each pack's texture_sources, and crafting recipe images are regenerated
#     (only when recipes, items, textures or generators changed) BEFORE the Listing Kits are rebuilt, so one run and one
#     commit keep recipes, images and descriptions in step. Generator problems are warnings and never block the build.
#
# Publishing to CurseForge lives in its own workflow (publish-curseforge.yml). When a publish
# succeeds it starts this workflow once so the catalogs pick up the new version.
# "Run workflow" is still available for a manual full rebuild; its only option is a OneBlock map name
# (blank = every map). OneBlock world archives are built here too (there is no separate OneBlock workflow).
# The Mojang bedrock-samples reference (reference/bedrock-samples, TypeScript definitions, reference bundle and
# MCPEDL/AI Review/bedrock-samples.txt) is refreshed here too: every Monday run, every manual run, and whenever
# bedrock-samples.txt is missing. Problems there are warnings and never block the build.

on:
  push:
    branches:
      - main
    paths-ignore:
      - "docs/**"
      - "context7.json"
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:
    inputs:
      map_name:
        description: "OneBlock map folder under MCPEDL/Maps/ to build the worlds for (blank = every map)"
        required: false
        default: ""
        type: string
      ref:
        description: "bedrock-samples branch, tag or commit to read for the reference refresh (blank = default branch)"
        required: false
        default: ""
        type: string

# Least privilege by default; the job asks for what it needs.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    concurrency:
      group: release-build-refresh
      cancel-in-progress: false
    # Pushes only: skip bot commits.
    if: ${{ github.event_name != 'push' || !contains(github.event.head_commit.message, '[skip ci]') }}
    env:
      ONEBLOCK_INPUT_MAP: ${{ inputs.map_name }}

    steps:
      - name: Check out the triggering branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
          cache: pip

      - name: Install Python dependencies
        run: pip install --disable-pip-version-check -r requirements.txt

      - name: Migrate legacy X.Y.Z.A versions and changelogs to X.Y.Z
        run: python3 scripts/migrate_three_part_versions.py

      - name: Normalize all manifests to X.Y.Z
        run: python3 scripts/manifest_tools.py --all --align

      - name: Ensure custom crafting recipes are always unlocked
        run: python3 scripts/ensure_recipe_unlocks.py

      - name: Render pixel textures from texture_sources
        run: |
          set -uo pipefail
          for dir in MCPEDL/*/*; do
            [ -d "$dir/texture_sources" ] || continue
            python3 scripts/pixel_json_to_png.py "$dir" || echo "::warning::Pixel textures of $dir could not be rendered (see log)."
          done

      - name: Convert icon files to pack_icon.png
        run: python3 scripts/make_pack_icon.py

      - name: Rebuild packages & register new projects
        id: process
        env:
          PACK_FILENAME_TEMPLATE: ${{ vars.PACK_FILENAME_TEMPLATE }}
          # This workflow NEVER changes versions. Publishing owns every version bump.
          AUTO_BUMP_MANIFEST: "false"
        run: |
          set -euo pipefail
          # Passive build: every run rebuilds ALL projects and re-syncs the catalogs. Manifest
          # versions are only aligned to the highest one already in the pack; when the source
          # changed, builds/<pack>/versions/V<X.Y.Z>/ is refreshed in place.
          echo "Running: python3 scripts/auto_bump_and_build.py --all"
          python3 scripts/auto_bump_and_build.py --all

      # OneBlock worlds (formerly the separate "Build OneBlock Creative, Survival, and Hardcore Worlds"
      # workflow, merged here so one runner, one concurrency group and one commit own every generated file).
      #   push / manual run with a map name: build what was asked, test-gated maps included.
      #   daily / manual run without a name: every map except the test-gated ones.
      - name: Validate OneBlock map name
        if: ${{ inputs.map_name != '' }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$ONEBLOCK_INPUT_MAP" =~ ^[A-Za-z0-9._-]+$ ]] \
            || { echo "::error::Map name may only use letters, numbers, . _ -"; exit 1; }
          [ -f "MCPEDL/Maps/$ONEBLOCK_INPUT_MAP/oneblock.json" ] \
            || { echo "::error::MCPEDL/Maps/$ONEBLOCK_INPUT_MAP/oneblock.json not found"; exit 1; }

      - name: Align saved OneBlock map releases to their changelogs
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          import sys
          from pathlib import Path

          sys.path.insert(0, "scripts")
          import prepare_curseforge_upload as release

          selected = os.environ.get("ONEBLOCK_INPUT_MAP", "").strip()
          for config in sorted(Path("MCPEDL/Maps").glob("*/oneblock.json")):
              project = config.parent
              if selected and project.name != selected:
                  continue
              try:
                  release.read_info(f"MCPEDL/Maps/{project.name}")
              except ValueError:
                  continue  # not registered in builds/Curseforge_IDs.json
              version, _ = release.latest_changelog_entry(project / "CHANGELOG.md")
              release.align_manifests(project, version)
          PY

      - name: Build OneBlock Creative, Survival and Hardcore worlds
        env:
          ONEBLOCK_TEST_GATED_MAPS: OneBlock-Dirtbound-Kingdom-Beta
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "push" ] || [ -n "$ONEBLOCK_INPUT_MAP" ]; then
            ONEBLOCK_MAP="$ONEBLOCK_INPUT_MAP" python3 scripts/build_oneblock_variants_from_template.py
            exit 0
          fi
          while IFS= read -r config; do
            project="${config%/oneblock.json}"
            map="${project##*/}"
            case " ${ONEBLOCK_TEST_GATED_MAPS//,/ } " in
              *" $map "*) echo "Skipping test-gated OneBlock world build: $map"; continue ;;
            esac
            echo "Building current OneBlock world archives: $map"
            ONEBLOCK_MAP="$map" python3 scripts/build_oneblock_variants_from_template.py
          done < <(find MCPEDL/Maps -type f -name oneblock.json -print | sort)

      - name: Synchronize OneBlock map READMEs
        env:
          ONEBLOCK_SKIP_MAPS: ${{ (github.event_name != 'push' && inputs.map_name == '') && 'OneBlock-Dirtbound-Kingdom-Beta' || '' }}
        run: python3 scripts/sync_oneblock_map_readmes.py

      - name: Verify generated OneBlock worlds are database-free
        shell: bash
        run: |
          python3 - <<'PY'
          import glob, os, sys, zipfile
          only = os.environ.get("ONEBLOCK_INPUT_MAP", "").strip()
          bad = []
          for cfg in glob.glob("MCPEDL/Maps/*/oneblock.json"):
              folder = os.path.dirname(cfg)
              if only and os.path.basename(folder) != only:
                  continue
              for w in glob.glob(folder + "/*.mcworld"):
                  names = zipfile.ZipFile(w).namelist()
                  if not any(n.endswith("level.dat") for n in names):
                      bad.append(f"{w}: missing level.dat")
                  if any(n.startswith("db/") or "/db/" in n for n in names):
                      bad.append(f"{w}: contains db/ data")
          if bad:
              print("\n".join("::error::" + b for b in bad)); sys.exit(1)
          print("Structural checks passed (not an in-game test).")
          PY

      - name: Upload generated OneBlock worlds as artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: oneblock-worlds
          path: ${{ inputs.map_name != '' && format('MCPEDL/Maps/{0}/*.mcworld', inputs.map_name) || 'MCPEDL/Maps/*/*.mcworld' }}
          if-no-files-found: ignore

      - name: Sync every README link to the current builds
        run: python3 scripts/step_summary.py "README link sync (follows the manifest version)" -- python3 scripts/sync_readme_links.py

      - name: Refresh GitHub and CurseForge changelog views
        run: python3 scripts/build_changelog_views.py --all

      - name: Standardize DESCRIPTION files
        run: python3 scripts/step_summary.py "DESCRIPTION standardization" -- python3 scripts/remake_docs.py --remake standardize --all --docs description

      - name: Decide whether recipe images need a refresh
        id: recipes
        run: |
          set -uo pipefail
          need=false
          if [ "${{ github.event_name }}" != "push" ]; then
            need=true
          elif changed="$(git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" 2>/dev/null)"; then
            if echo "$changed" | grep -Eq '(behavior_pack/(recipes|items)/|resource_pack/textures/|texture_sources/|scripts/(crafting_template|generate_[a-z_]*recipe[a-z_]*|convert_crafting_recipe_svgs_to_png|pixel_json_to_png)\.py|CRAFTING_)'; then
              need=true
            fi
          else
            need=true
          fi
          if [ "$need" != "true" ]; then
            for rdir in MCPEDL/*/*/behavior_pack/recipes; do
              [ -d "$rdir" ] || continue
              pack="${rdir%/behavior_pack/recipes}"
              if grep -rlE '"minecraft:recipe_(shaped|shapeless)"' "$rdir" > /dev/null 2>&1 && ! compgen -G "$pack/assets/recipes/*_recipe.png" > /dev/null; then
                echo "Recipes without images: $pack"
                need=true
              fi
            done
          fi
          echo "needed=$need" >> "$GITHUB_OUTPUT"
          echo "Recipe images need a refresh: $need"

      - name: Export crafting recipe SVGs as PNGs
        if: steps.recipes.outputs.needed == 'true'
        run: python3 scripts/convert_crafting_recipe_svgs_to_png.py || echo "::warning::Recipe SVG export failed (see log)."


      - name: Generate crafting recipe images (every pack)
        if: steps.recipes.outputs.needed == 'true'
        run: |
          set -uo pipefail
          status=0
          python3 scripts/generate_recipe_images.py --all --all-items || status=1
          if [ "$status" != "0" ]; then
            echo "::warning::Some recipe images could not be generated (see log). The rest of the build continues."
          fi

      - name: Recipe image report (why a pack has no recipe images)
        if: steps.recipes.outputs.needed == 'true'
        run: python3 scripts/recipe_image_report.py --out recipe-image-report.md || echo "::warning::The recipe image report itself failed (see this step's log)."

      - name: Upload recipe image report
        if: steps.recipes.outputs.needed == 'true'
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: recipe-image-report
          path: recipe-image-report.md
          if-no-files-found: ignore

      - name: Refresh Listing Kits (name, summary, description HTML, image prompts)
        run: python3 scripts/build_listing_kits.py --all || echo "::warning::Some listing kits could not be built (see log)."

      - name: Sync MCicons (Minecraft item and block icons, one .tgz file in reference/mcicons)
        continue-on-error: true
        run: python3 scripts/sync_mcicons.py

      # Bedrock reference refresh (formerly the separate "Sync Bedrock Samples Reference" workflow).
      - name: Decide whether to refresh the Bedrock reference
        id: samples
        shell: bash
        run: |
          set -uo pipefail
          run=false
          [ "${{ github.event_name }}" = "workflow_dispatch" ] && run=true
          [ "${{ github.event_name }}" = "schedule" ] && [ "$(date -u +%u)" = "1" ] && run=true
          [ -s "MCPEDL/AI Review/bedrock-samples.txt" ] || run=true
          echo "run=$run" >> "$GITHUB_OUTPUT"
          echo "Refresh Bedrock reference: $run"

      - name: Fetch bedrock-samples (text files and schemas)
        if: ${{ steps.samples.outputs.run == 'true' }}
        continue-on-error: true
        env:
          REF: ${{ inputs.ref }}
        shell: bash
        run: |
          set -euo pipefail
          SRC="$RUNNER_TEMP/bedrock-samples"
          rm -rf "$SRC"
          git clone --depth 1 --filter=blob:none --sparse ${REF:+--branch "$REF"} \
            https://github.com/Mojang/bedrock-samples.git "$SRC"
          git -C "$SRC" sparse-checkout set --no-cone \
            '/behavior_pack/' '/resource_pack/' '/metadata/json_schemas/'
          if [ -d "$SRC/metadata/json_schemas" ]; then
            mkdir -p reference/bedrock-samples/json_schemas
            cp -r "$SRC/metadata/json_schemas"/* reference/bedrock-samples/json_schemas/
          fi
          find "$SRC/behavior_pack" "$SRC/resource_pack" -type f \
            ! \( -name '*.json' -o -name '*.lang' \) -delete
          echo "Upstream commit: $(git -C "$SRC" rev-parse HEAD)"
          python3 scripts/build_bedrock_reference.py --src "$SRC" --out reference/bedrock-samples

      - name: Fetch Minecraft Script API TypeScript definitions (.d.ts)
        if: ${{ steps.samples.outputs.run == 'true' }}
        continue-on-error: true
        run: python3 scripts/sync_minecraft_types.py reference/typescript-definitions

      - name: Bundle reference package and write bedrock-samples.txt
        if: ${{ steps.samples.outputs.run == 'true' }}
        continue-on-error: true
        run: python3 scripts/bundle_bedrock_reference_pack.py .

      - name: Refresh per-package AI review files
        run: python3 scripts/auto_ai_review.py

      - name: Keep AI review files of unchanged packs as they are
        run: |
          set -uo pipefail
          base=HEAD
          if [ "${{ github.event_name }}" = "push" ] && git cat-file -e "${{ github.event.before }}^{commit}" 2>/dev/null; then
            base="${{ github.event.before }}"
          fi
          changed="$( { git diff --name-only "$base"; git ls-files --others --exclude-standard; } 2>/dev/null )"
          for dir in MCPEDL/*/*; do
            [ -d "$dir" ] || continue
            [ "$(dirname "$dir")" = "MCPEDL/AI Review" ] && continue
            name="$(basename "$dir")"
            if printf '%s\n' "$changed" | grep -vF -- "MCPEDL/AI Review/" | grep -qF -- "$dir/"; then
              echo "Package changed, AI review updated: $dir"
              continue
            fi
            git ls-files -z -- "MCPEDL/AI Review/$name.txt" "MCPEDL/AI Review/$name.zip" "MCPEDL/AI Review/.$name.source-hash" | xargs -0 -r git checkout HEAD --
          done

      - name: Upload AI Review Bundle Artifact
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: ai-review-bundle
          path: |
            MCPEDL/AI Review/Maintenance.zip
            MCPEDL/AI Review/New-Pack.zip
            MCPEDL/AI Review/*.zip
            MCPEDL/AI Review/*.txt
          if-no-files-found: ignore

      - name: Build MCPEDL catalog index
        run: python3 scripts/build_mcpedl_readme.py

      - name: Verify builds/ snapshots match source and manifest versions (report only)
        continue-on-error: true
        run: python3 scripts/step_summary.py "Snapshot verification" -- python3 scripts/auto_bump_and_build.py --verify || true

      - name: Validate manifest titles and creator attribution
        run: python3 scripts/validate_manifest_titles.py

      - name: Check every manifest in the repository (report only)
        continue-on-error: true
        run: python3 scripts/step_summary.py "Whole-repository manifest check" -- python3 scripts/check_manifest_versions.py || true

      - name: Audit README and DESCRIPTION status (report only)
        continue-on-error: true
        run: python3 scripts/step_summary.py "README audit" -- python3 scripts/check_readme_status.py || true

      - name: Commit and push changes
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for dir in MCPEDL builds changelog_views Package; do
            if [ -d "$dir" ]; then git add "$dir"; fi
          done
          git add -A -- ai-review 2>/dev/null || true
          for dir in reference/bedrock-samples reference/typescript-definitions reference/mcicons; do
            if [ -d "$dir" ]; then git add "$dir"; fi
          done
          if [ -f README.md ]; then git add README.md; fi
          if [ -f MCPEDL/README.md ]; then git add MCPEDL/README.md; fi
          if [ -f scripts/CRAFTING_TABLE.png ]; then git add scripts/CRAFTING_TABLE.png; fi
          if compgen -G "assets/CRAFTING_RECIPE*.png" > /dev/null; then git add assets/CRAFTING_RECIPE*.png; fi
          if [ -f Mcpeworlds/README.md ]; then git add Mcpeworlds/README.md; fi

          if git diff --cached --quiet; then
            echo "Nothing to commit: packages, catalogs and READMEs are up to date."
          else
            git commit -m "chore(build): rebuild packages and sync catalogs [skip ci]"
            python3 scripts/git_push_retry.py --branch "${GITHUB_REF#refs/heads/}"
          fi
