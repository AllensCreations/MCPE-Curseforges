name: Keep OneBlock Map READMEs Synchronized

on:
  push:
    branches:
      - main
    paths:
      - 'MCPEDL/maps/**'
      - 'Mcpeworlds/**'
      - 'scripts/sync_oneblock_map_readmes.py'
      - '.github/workflows/sync-oneblock-map-readmes.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-oneblock-map-readmes-main
  cancel-in-progress: false

jobs:
  sync-readmes:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Regenerate opted-in map README files from actual sources and world archives
        run: python scripts/sync_oneblock_map_readmes.py

      - name: Commit synchronized map READMEs
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A -- MCPEDL/maps
          if git diff --cached --quiet; then
            echo "All opted-in map READMEs are already synchronized."
            exit 0
          fi
          git commit -m "docs(maps): synchronize OneBlock map READMEs [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
