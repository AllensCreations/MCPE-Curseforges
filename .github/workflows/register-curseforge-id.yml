name: Register CurseForge ID

# Run once per pack. Saves builds/<pack>/Curseforge_Info.json, then rewrites the
# BEGIN/END registered block in publish-curseforge.yml from every registered pack.
# Needs the WORKFLOW_PAT secret to push the edited workflow file; without it the ID is
# still saved but the dropdown is not updated.

on:
  workflow_dispatch:
    inputs:
      project:
        description: "Exact path, e.g. MCPEDL/Addons/Mining-Helmet"
        required: true
        type: string
      curseforge_project_id:
        description: CurseForge project ID (digits only)
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: register-curseforge-id
  cancel-in-progress: false

jobs:
  register:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref }}
          token: ${{ secrets.WORKFLOW_PAT || secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.x'

      - name: Save ID
        env:
          PROJECT_PATH: ${{ inputs.project }}
          CURSEFORGE_PROJECT_ID: ${{ inputs.curseforge_project_id }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == refs/heads/* ]] || { echo "::error::Run this workflow on a branch."; exit 1; }
          python3 scripts/register_curseforge_id.py --project "$PROJECT_PATH" --id "$CURSEFORGE_PROJECT_ID"

      - name: Rebuild the publish dropdown from registered packs
        run: |
          set -euo pipefail
          WF=".github/workflows/publish-curseforge.yml"
          grep -q '# BEGIN registered' "$WF" && grep -q '# END registered' "$WF" \
            || { echo "::error::BEGIN/END registered markers missing in $WF"; exit 1; }

          # Collect every registered pack folder (builds/<Name>/Curseforge_Info.json -> MCPEDL/<Type>/<Name>)
          PATHS=()
          for f in builds/*/Curseforge_Info.json; do
            [ -f "$f" ] || continue
            NAME=$(basename "$(dirname "$f")")
            DIR=$(find MCPEDL -mindepth 2 -maxdepth 2 -type d -name "$NAME" | head -n1)
            if [ -z "$DIR" ]; then
              echo "::warning::builds/$NAME has an ID but no MCPEDL/*/$NAME folder; skipped."
              continue
            fi
            PATHS+=("$DIR")
          done

          OPTS=$(mktemp)
          printf '          - "-"\n' > "$OPTS"
          if [ "${#PATHS[@]}" -gt 0 ]; then
            printf '%s\n' "${PATHS[@]}" | sort -u | while read -r p; do
              printf '          - "%s"\n' "$p"
            done >> "$OPTS"
          fi

          awk -v optfile="$OPTS" '
            /# BEGIN registered/ { print; while ((getline l < optfile) > 0) print l; skip=1; next }
            /# END registered/   { skip=0 }
            !skip { print }
          ' "$WF" > "$WF.new"
          mv "$WF.new" "$WF"
          echo "Dropdown now contains:"; cat "$OPTS"

      - name: Commit
        env:
          HAS_PAT: ${{ secrets.WORKFLOW_PAT != '' }}
        run: |
          set -euo pipefail
          git add -A -- builds
          if [ "$HAS_PAT" = "true" ]; then
            git add -- .github/workflows/publish-curseforge.yml
          elif ! git diff --quiet -- .github/workflows/publish-curseforge.yml; then
            echo "::warning::No WORKFLOW_PAT secret: the dropdown was not updated. Add the secret and re-run."
            git checkout -- .github/workflows/publish-curseforge.yml
          fi
          if git diff --cached --quiet; then
            echo "Already registered."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(curseforge): register project ID [skip ci]"
          git pull --rebase origin "${GITHUB_REF#refs/heads/}"
          git push origin "HEAD:${GITHUB_REF}"
