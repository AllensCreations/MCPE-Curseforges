name: Register CurseForge ID

# Run once per pack. Adds/updates the pack in builds/Curseforge_IDs.json (one registry for all
# packs; old builds/<pack>/Curseforge_Info.json files are folded in automatically), then
# refreshes the "Registered pack" dropdown of Publish to CurseForge from that registry.
# Re-running for an already registered pack overwrites its stored ID.
# After the ID step the workflow starts "Build Changed Packs & Sync Catalogs" (auto-version-bump.yml)
# once, because the [skip ci] commit below never triggers it. The build never bumps a version.
#
# Secrets:
#   CF_CONSOLE_KEY - Core API key from console.curseforge.com (used here to fetch the logo)
#   CF_AUTHOR_KEY  - author upload token (used by Publish to CurseForge, not here)
#   WORKFLOW_PAT   - needed to push the edited workflow file; without it the ID is
#                    still saved but the dropdown is not updated.

on:
  workflow_dispatch:
    inputs:
      project:
        description: "Exact path, e.g. MCPEDL/Addons/Mining-Helmet"
        required: true
        type: string
      curseforge_project_id:
        description: CurseForge project ID (digits only). Existing pack = overwrite its ID.
        required: true
        type: string

permissions:
  contents: write
  actions: write

concurrency:
  group: register-curseforge-id
  cancel-in-progress: false

jobs:
  register:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref }}
          token: ${{ secrets.WORKFLOW_PAT || secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'

      - name: Save ID and refresh the publish dropdown
        env:
          PROJECT_PATH: ${{ inputs.project }}
          CURSEFORGE_PROJECT_ID: ${{ inputs.curseforge_project_id }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == refs/heads/* ]] || { echo "::error::Run this workflow on a branch."; exit 1; }
          [[ "$CURSEFORGE_PROJECT_ID" =~ ^[0-9]+$ ]] || { echo "::error::Project ID must be digits only."; exit 1; }
          python3 scripts/register_curseforge_id.py --project "$PROJECT_PATH" --id "$CURSEFORGE_PROJECT_ID"
          python3 scripts/sync_dispatch_choices.py
          cat builds/Curseforge_IDs.json

      - name: Use the CurseForge logo as pack_icon when a pack has none
        env:
          PROJECT_PATH: ${{ inputs.project }}
          CURSEFORGE_PROJECT_ID: ${{ inputs.curseforge_project_id }}
          # The script reads CURSEFORGE_API_KEY; it is fed from the console key secret.
          CURSEFORGE_API_KEY: ${{ secrets.CF_CONSOLE_KEY }}
        run: |
          pip install -r requirements.txt
          python3 scripts/fetch_curseforge_logo.py --project "$PROJECT_PATH" --id "$CURSEFORGE_PROJECT_ID"

      - name: Commit
        env:
          HAS_PAT: ${{ secrets.WORKFLOW_PAT != '' }}
          PROJECT_PATH: ${{ inputs.project }}
          CURSEFORGE_PROJECT_ID: ${{ inputs.curseforge_project_id }}
        run: |
          set -euo pipefail
          git add -A -- builds/Curseforge_IDs.json ':(glob)builds/Curseforge_IDs.json'
          git add -- ":(glob)${PROJECT_PATH}/*/pack_icon.png" || true
          if [ "$HAS_PAT" = "true" ]; then
            git add -- .github/workflows/publish-curseforge.yml
          elif ! git diff --quiet -- .github/workflows/publish-curseforge.yml; then
            echo "::warning::No WORKFLOW_PAT secret: the dropdown was not updated. Add the secret and re-run."
            git checkout -- .github/workflows/publish-curseforge.yml
          fi
          if git diff --cached --quiet; then
            echo "Already registered with this exact ID. Nothing to change."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(curseforge): register/update ${PROJECT_PATH} -> ${CURSEFORGE_PROJECT_ID} [skip ci]"
          git pull --rebase origin "${GITHUB_REF#refs/heads/}" --autostash
          git push origin "HEAD:${GITHUB_REF}"

      - name: Start Build Changed Packs & Sync Catalogs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run auto-version-bump.yml --ref "${GITHUB_REF#refs/heads/}" \
            && echo "Build Changed Packs & Sync Catalogs started." \
            || echo "::warning::Could not start the build; run Build Changed Packs & Sync Catalogs manually."
