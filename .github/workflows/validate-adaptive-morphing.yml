name: Validate Adaptive Morphing Multi-Tool

on:
  push:
    branches:
      - main
    paths:
      - "MCPEDL/new_addons/Adaptive-Morphing-Multi-Tool/**"
      - ".github/workflows/validate-adaptive-morphing.yml"
  pull_request:
    paths:
      - "MCPEDL/new_addons/Adaptive-Morphing-Multi-Tool/**"
      - ".github/workflows/validate-adaptive-morphing.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate pack JSON and script syntax
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate all JSON files in the add-on
        shell: bash
        run: |
          set -euo pipefail
          ROOT="MCPEDL/new_addons/Adaptive-Morphing-Multi-Tool"
          count=0
          while IFS= read -r -d '' file; do
            node -e 'JSON.parse(require("fs").readFileSync(process.argv[1], "utf8"))' "$file"
            echo "Valid JSON: $file"
            count=$((count + 1))
          done < <(find "$ROOT/behavior_pack" "$ROOT/resource_pack" -type f -name '*.json' -print0)
          test "$count" -gt 0
          echo "Validated $count JSON files."

      - name: Check JavaScript syntax
        run: node --check "MCPEDL/new_addons/Adaptive-Morphing-Multi-Tool/behavior_pack/scripts/main.js"
