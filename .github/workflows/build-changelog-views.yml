name: Build Changelog Views
on:
  push:
    paths:
      - "MCPEDL/**/CHANGELOG.md"
      - "scripts/build_changelog_views.py"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 scripts/build_changelog_views.py --all
      - run: |
          if [ -n "$(git status --porcelain changelog_views)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add changelog_views
            git commit -m "Update changelog views"
            git pull --rebase
            git push
          fi
