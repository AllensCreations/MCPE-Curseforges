name: Publish Add-on to CurseForge

on:
  workflow_dispatch:
    inputs:
      category:
        description: Add-on source category
        required: true
        type: choice
        options:
          - Addons
          - Minigame
      project:
        description: Exact project folder name
        required: true
        type: string
      curseforge_project_id:
        description: Existing CurseForge project ID
        required: true
        type: string
      release_type:
        description: CurseForge release type
        required: true
        default: beta
        type: choice
        options:
          - release
          - beta
          - alpha

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.x'

      - name: Install build dependency
        run: python3 -m pip install pillow

      - name: Validate publish inputs and token
        env:
          CURSEFORGE_API_TOKEN: ${{ secrets.CURSEFORGE_API_TOKEN }}
          CURSEFORGE_PROJECT_ID: ${{ inputs.curseforge_project_id }}
        run: |
          set -euo pipefail
          if [ -z "$CURSEFORGE_API_TOKEN" ]; then
            echo "::error::Add the CURSEFORGE_API_TOKEN repository secret before publishing."
            exit 1
          fi
          if [[ ! "$CURSEFORGE_PROJECT_ID" =~ ^[0-9]+$ ]]; then
            echo "::error::CurseForge project ID must contain only digits."
            exit 1
          fi

      - name: Build package and prepare release metadata
        id: release
        env:
          CATEGORY: ${{ inputs.category }}
          PROJECT: ${{ inputs.project }}
          RELEASE_TYPE: ${{ inputs.release_type }}
        run: |
          set -euo pipefail
          python3 scripts/prepare_curseforge_upload.py \
            --category "$CATEGORY" \
            --project "$PROJECT" \
            --release-type "$RELEASE_TYPE"

      - name: Upload to CurseForge
        env:
          CURSEFORGE_API_TOKEN: ${{ secrets.CURSEFORGE_API_TOKEN }}
          CURSEFORGE_PROJECT_ID: ${{ inputs.curseforge_project_id }}
          PACKAGE_PATH: ${{ steps.release.outputs.package }}
          METADATA_PATH: ${{ steps.release.outputs.metadata }}
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            --header "X-Api-Token: $CURSEFORGE_API_TOKEN" \
            --form "metadata=<$METADATA_PATH;type=application/json" \
            --form "file=@$PACKAGE_PATH" \
            "https://www.curseforge.com/api/projects/$CURSEFORGE_PROJECT_ID/upload-file"
