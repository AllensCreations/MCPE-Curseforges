name: Publish Pack to CurseForge

# The ONLY place that uploads to CurseForge. Run it by hand.
# Dropdown = packs registered with "Register CurseForge ID" (kept in sync by scripts/sync_dispatch_choices.py).
# Version becomes major.(minor+1).0 and all changelog entries newer than the last published
# version are merged into one entry.

on:
  workflow_dispatch:
    inputs:
      project:
        description: Registered pack
        required: true
        default: "-"
        type: choice
        options:
          # BEGIN registered
          - "-"
          - "MCPEDL/Addons/Vanilla-Quality-of-Life"
          - "MCPEDL/Maps/OneBlock-Void-Survival"
          # END registered
      map_variant:
        description: Maps only (default = auto, all = Creative + Survival + Hardcore)
        required: true
        default: default
        type: choice
        options:
          - default
          - Creative
          - Survival
          - Hardcore
          - all
      release_type:
        description: CurseForge release type
        required: true
        default: beta
        type: choice
        options:
          - release
          - beta
          - alpha

permissions:
  contents: write

concurrency:
  group: publish-curseforge-${{ inputs.project }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref }}

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.x'

      - name: Install build dependency
        run: python3 -m pip install pillow

      - name: Validate inputs
        env:
          CURSEFORGE_API_TOKEN: ${{ secrets.CURSEFORGE_API_TOKEN }}
          PROJECT_PATH: ${{ inputs.project }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == refs/heads/* ]] || { echo "::error::Run this workflow on a branch."; exit 1; }
          [ "$PROJECT_PATH" != "-" ] || { echo "::error::Pick a registered pack (run 'Register CurseForge ID' first if it is missing)."; exit 1; }
          [ -n "$CURSEFORGE_API_TOKEN" ] || { echo "::error::Add the CURSEFORGE_API_TOKEN repository secret."; exit 1; }

      - name: Bump version, merge changelog, build and upload (once)
        env:
          CURSEFORGE_API_TOKEN: ${{ secrets.CURSEFORGE_API_TOKEN }}
          PROJECT_PATH: ${{ inputs.project }}
          MAP_VARIANT: ${{ inputs.map_variant }}
          RELEASE_TYPE: ${{ inputs.release_type }}
        run: |
          set -euo pipefail
          python3 scripts/auto_publish_curseforge.py \
            --project "$PROJECT_PATH" \
            --map-variant "$MAP_VARIANT" \
            --release-type "$RELEASE_TYPE"

      # Runs only after a successful upload, so a failed upload leaves the repo untouched.
      - name: Commit new version, merged changelog and saved release info
        env:
          PROJECT_PATH: ${{ inputs.project }}
        run: |
          set -euo pipefail
          NAME="${PROJECT_PATH##*/}"
          git add -A -- "$PROJECT_PATH" "builds/$NAME"
          if git diff --cached --quiet; then
            echo "Nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(curseforge): publish $NAME [skip ci]"
          git pull --rebase origin "${GITHUB_REF#refs/heads/}"
          git push origin "HEAD:${GITHUB_REF}"
