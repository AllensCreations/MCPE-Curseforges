name: Publish Pack to CurseForge

# The ONLY place that uploads to CurseForge. Run it by hand.
# Dropdown + project IDs + last published versions all come from builds/Curseforge_IDs.json
# (written by "Register CurseForge ID", which also refreshes the dropdown).
# Version rules:
#   beta:    X.Y.Z becomes X.Y.(Z+1); every unpublished changelog entry is merged into one grouped entry.
#   alpha:   X.Y.Z becomes X.(Y+1).0; the changelog shows every series (1.3.x and lower) as a group (CurseForge spoiler; the newest stays open).
#   release: X.Y.Z becomes (X+1).0.0; the changelog shows every major (v1.x.x, series inside) as a group (CurseForge spoiler; the newest stays open).
# Set the repo variable CURSEFORGE_CHANGELOG_STYLE=plain to send markdown headings instead of spoiler folds.

on:
  workflow_dispatch:
    inputs:
      project:
        description: Registered pack
        required: true
        default: "-"
        type: choice
        options:
          # BEGIN registered
          - "-"
          - "MCPEDL/Addons/Monster-Companions"
          - "MCPEDL/Addons/Vanilla-Quality-of-Life"
          - "MCPEDL/Maps/OneBlock-Void-Survival"
          - "MCPEDL/Minigame/Shared-Hivemind-Inventory"
          # END registered
      map_variant:
        description: Maps only (default = auto, all = Creative + Survival + Hardcore)
        required: true
        default: default
        type: choice
        options:
          - default
          - Creative
          - Survival
          - Hardcore
          - all
      release_type:
        description: "beta = X.Y.Z+1, alpha = X.Y+1.0, release = X+1.0.0 (alpha/release fold the history into spoilers)"
        required: true
        default: beta
        type: choice
        options:
          - release
          - beta
          - alpha

permissions:
  contents: write

concurrency:
  group: publish-curseforge-${{ inputs.project }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref }}

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.x'

      - name: Install build dependency
        run: python3 -m pip install pillow

      - name: Validate inputs and load ID from registry
        env:
          CURSEFORGE_API_TOKEN: ${{ secrets.CURSEFORGE_API_TOKEN }}
          PROJECT_PATH: ${{ inputs.project }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == refs/heads/* ]] || { echo "::error::Run this workflow on a branch."; exit 1; }
          [ "$PROJECT_PATH" != "-" ] || { echo "::error::Pick a registered pack (run 'Register CurseForge ID' first if it is missing)."; exit 1; }
          [ -n "$CURSEFORGE_API_TOKEN" ] || { echo "::error::Add the CURSEFORGE_API_TOKEN repository secret."; exit 1; }
          python3 - <<'PY'
          import os, sys
          sys.path.insert(0, "scripts")
          import prepare_curseforge_upload as release
          try:
              info = release.read_info(os.environ["PROJECT_PATH"])
          except ValueError as exc:
              print(f"::error::{exc}")
              sys.exit(1)
          print(f"CurseForge project {info['project_id']}, last published: {info.get('last_published_version', 'never')}")
          PY

      - name: Bump version, merge changelog, build and upload (once)
        env:
          CURSEFORGE_API_TOKEN: ${{ secrets.CURSEFORGE_API_TOKEN }}
          PROJECT_PATH: ${{ inputs.project }}
          MAP_VARIANT: ${{ inputs.map_variant }}
          RELEASE_TYPE: ${{ inputs.release_type }}
          CURSEFORGE_CHANGELOG_STYLE: ${{ vars.CURSEFORGE_CHANGELOG_STYLE || 'spoiler' }}
        run: |
          set -euo pipefail
          python3 scripts/auto_publish_curseforge.py \
            --project "$PROJECT_PATH" \
            --map-variant "$MAP_VARIANT" \
            --release-type "$RELEASE_TYPE"

      # Runs only after a successful upload, so a failed upload leaves the repo untouched.
      - name: Commit new version, merged changelog and saved release info
        env:
          PROJECT_PATH: ${{ inputs.project }}
        run: |
          set -euo pipefail
          NAME="${PROJECT_PATH##*/}"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(curseforge): publish $NAME [skip ci]"
          git pull --rebase origin "${GITHUB_REF#refs/heads/}"
          git push origin "HEAD:${GITHUB_REF}"
