name: "Manage Add-on Lifecycle (Testing / Finished)"

on:
  workflow_dispatch:
    inputs:
      addon:
        description: "Select add-on from MCPEDL/new_addons/"
        required: true
        type: choice
        options:
          - "none"
      status:
        description: "Lifecycle status label"
        required: true
        type: choice
        options:
          - testing
          - finished
        default: "testing"

permissions:
  contents: write

concurrency:
  group: addon-lifecycle-${{ github.ref }}
  cancel-in-progress: false

jobs:
  manage-lifecycle:
    runs-on: ubuntu-latest
    env:
      ADDON: ${{ github.event.inputs.addon }}
      STATUS: ${{ github.event.inputs.status }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.x"

      - name: Process Add-on Lifecycle Status
        id: process
        run: |
          python3 scripts/manage_addon_status.py \
            --addon "${ADDON}" \
            --status "${STATUS}"

      - name: Commit and push changes
        if: "${{ github.event.inputs.status == 'finished' && github.event.inputs.addon != 'none' }}"
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          branch="${GITHUB_REF_NAME:-main}"

          for dir in MCPEDL/new_addons MCPEDL/addons builds; do
            [ -d "$dir" ] && git add "$dir"
          done
          [ -f "README.md" ] && git add README.md

          if git diff --staged --quiet; then
            echo "No changes staged to commit."
          else
            git commit -m "feat(addons): promote ${ADDON} to addons folder (finished) [skip ci]"

            for attempt in 1 2 3; do
              echo "Push attempt $attempt of 3..."
              git fetch origin "$branch"
              if git rebase "origin/$branch"; then
                if git push origin "HEAD:refs/heads/$branch"; then
                  echo "Pushed successfully."
                  exit 0
                fi
              fi
              echo "Rebase/push failed, retrying in 3 seconds..."
              sleep 3
            done

            echo "::error::Failed to push changes after 3 attempts."
            exit 1
          fi

      - name: Job Summary
        if: always()
        run: |
          {
            echo "## Add-on Lifecycle Action Summary"
            echo ""
            echo "| Parameter | Value |"
            echo "| :--- | :--- |"
            echo "| Target Add-on | \`${ADDON}\` |"
            echo "| Selected Label | \`${STATUS}\` |"
            if [ "${STATUS}" = "finished" ]; then
              echo "| Outcome | Promoted from \`MCPEDL/new_addons/\` to \`MCPEDL/addons/\` & catalogs synchronized |"
            else
              echo "| Outcome | Retained unchanged in \`MCPEDL/new_addons/\` for active testing |"
            fi
            echo ""
            echo "Run \`python3 scripts/check_readme_status.py\` to verify catalog status."
          } >> "$GITHUB_STEP_SUMMARY"
