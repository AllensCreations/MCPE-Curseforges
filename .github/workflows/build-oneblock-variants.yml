name: Build OneBlock Creative, Survival, and Hardcore Worlds

on:
  # Automatically rebuild all variants when map source or world foundations change.
  push:
    branches:
      - main
    paths:
      - 'MCPEDL/maps/**/oneblock.json'
      - 'MCPEDL/maps/**/behavior_pack/**'
      - 'MCPEDL/maps/**/resource_pack/**'
      - 'Mcpeworlds/**'
      - 'scripts/build_oneblock_variants_from_template.py'
      - 'scripts/sync_oneblock_map_readmes.py'
      - '.github/workflows/build-oneblock-variants.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-oneblock-variants-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and publish all three world modes
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build each mode from its complete matching Mcpeworlds foundation and the map's actual packs
        run: python scripts/build_oneblock_variants_from_template.py

      - name: Synchronize map README with generated world archives
        run: python scripts/sync_oneblock_map_readmes.py

      - name: Commit generated .mcworld files and synchronized README
        shell: bash
        run: |
          set -euo pipefail
          git add -A -- MCPEDL/maps
          if git diff --cached --quiet; then
            echo "No generated world changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "build(oneblock): regenerate worlds after source changes [skip ci]"
          git pull --rebase -X theirs origin main
          git push
