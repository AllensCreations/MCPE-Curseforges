name: Build OneBlock Creative, Survival, and Hardcore Worlds

on:
  # World generation is deliberately manual and gated until the Creative
  # mechanics have been tested in Minecraft and the user approves rebuilding.
  workflow_dispatch:
    inputs:
      creative_test_passed:
        description: "Confirm the current Creative world mechanics were tested in Minecraft"
        required: true
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: build-oneblock-variants-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and publish all three world modes
    if: ${{ inputs.creative_test_passed == true }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build each mode from its complete matching Mcpeworlds foundation and the map's actual packs
        run: python scripts/build_oneblock_variants_from_template.py

      - name: Commit generated .mcworld files
        shell: bash
        run: |
          set -euo pipefail
          git add -A -- MCPEDL/maps
          if git diff --cached --quiet; then
            echo "No generated world changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "build(oneblock): generate Creative, Survival, and Hardcore worlds [skip ci]"
          # Other commits and concurrent world builds may land while this build runs.
          # Generated .mcworld archives are reproducible outputs; on binary conflicts,
          # keep this run's newly generated archive while replaying onto current main.
          git pull --rebase -X theirs origin main
          git push
