name: Build OneBlock Creative, Survival, and Hardcore Worlds

on:
  push:
    branches:
      - main
    paths:
      - 'MCPEDL/maps/**/oneblock.json'
      - 'MCPEDL/maps/**/behavior_pack/**'
      - 'MCPEDL/maps/**/resource_pack/**'
      - 'CreateWorld/McpeWorld.html'
      - 'scripts/build_oneblock_variants.py'
      - 'scripts/build_oneblock_variants_from_template.py'
      - 'MCPEDL/maps/OneBlock-Void-Survival/*.mcworld'
      - '.github/workflows/build-oneblock-variants.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-oneblock-variants-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and publish all three world modes
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install LevelDB build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libleveldb-dev libsnappy-dev

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: python -m pip install --upgrade pip plyvel

      - name: Build variants from a valid Bedrock world template and the map's actual packs
        run: python scripts/build_oneblock_variants_from_template.py

      - name: Commit generated .mcworld files
        shell: bash
        run: |
          set -euo pipefail
          git add -A -- MCPEDL/maps
          if git diff --cached --quiet; then
            echo "No generated world changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "build(oneblock): generate Creative, Survival, and Hardcore worlds [skip ci]"
          # Other commits and concurrent world builds may land while this build runs.
          # Generated .mcworld archives are reproducible outputs; on binary conflicts,
          # keep this run's newly generated archive while replaying onto current main.
          git pull --rebase -X theirs origin main
          git push
