name: Update Minimum Bedrock Version

on:
  workflow_dispatch:
    inputs:
      min_version:
        description: 'Looked-up minimum Bedrock engine version the projects actually need (e.g. 1.21.0)'
        required: true
        type: string
      projects:
        description: 'Project folders under MCPEDL/, comma-separated'
        required: true
        default: 'MCPEDL/new_addons/Swarm-Mob-Booster,MCPEDL/new_addons/Selective-Mob-Controller'
        type: string

permissions:
  contents: write

jobs:
  update-version:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Update manifests
        env:
          MIN_VERSION: ${{ inputs.min_version }}
          PROJECTS: ${{ inputs.projects }}
        run: |
          set -euo pipefail
          ARGS=()
          IFS=',' read -ra LIST <<< "$PROJECTS"
          for p in "${LIST[@]}"; do
            p="$(echo "$p" | xargs)"
            [ -n "$p" ] && ARGS+=(--project "$p")
          done
          python3 scripts/update_min_version.py --version "$MIN_VERSION" "${ARGS[@]}"

      - name: Commit and push changes
        env:
          MIN_VERSION: ${{ inputs.min_version }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add MCPEDL/
          if git diff --staged --quiet; then
            echo "No changes detected to commit."
          else
            git commit -m "chore(engine): set min_engine_version to ${MIN_VERSION} [skip ci]"
            git push
          fi
