name: Test crafting template

# Manual only. Runs tests/test_crafting_template.py and uploads the sample
# images as a downloadable artifact. Does not commit anything.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pillow cairosvg

      - name: Run crafting template test
        run: python tests/test_crafting_template.py

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: crafting-template-test
          path: tests/output/*.png
