name: Test crafting template

# Manual only. Runs tests/test_crafting_template.py and uploads the sample
# images as a downloadable artifact. Does not commit anything.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pillow cairosvg

      - name: Run crafting template test
        run: python tests/test_crafting_template.py

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: crafting-template-test
          path: tests/output/*.png
