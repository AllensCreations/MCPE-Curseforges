name: Test crafting template

# Manual only. Runs tests/test_crafting_template.py and uploads the sample
# images as a downloadable artifact. Does not commit anything.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pillow cairosvg

      - name: Run crafting template test
        run: python tests/test_crafting_template.py

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: crafting-template-test
          path: tests/output/*.png
