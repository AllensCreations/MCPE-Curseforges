name: Test crafting template

# Manual only. Runs tests/test_crafting_template.py and uploads the sample
# images as a downloadable artifact. Does not commit anything.
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pillow cairosvg

      - name: Run crafting template test
        run: python tests/test_crafting_template.py

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: crafting-template-test
          path: tests/output/*.png
