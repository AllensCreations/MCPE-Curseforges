name: Validate Editable Mcpeworld Templates

on:
  push:
    paths:
      - 'Mcpeworlds/**'
      - 'scripts/sync_mcpeworld_templates.py'
      - '.github/workflows/sync-mcpeworlds.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate the canonical editable world folders
        run: python scripts/sync_mcpeworld_templates.py
