name: Delete Package

# Deletes ONE package and everything that depends on it:
#   MCPEDL/<Category>/<Name>/, builds/<Name>/, changelog_views/<Name>.*, its entry in
#   builds/Curseforge_IDs.json, its catalog rows and overview section (category README,
#   builds/README.md, README.md, Mcpeworlds/README.md), the Collection Size badge and its
#   option in the "Registered pack" list of Publish to CurseForge.
# Anything else that still mentions the package is listed in the run summary for you to review.
#
# "package" accepts the bare name, <Category>/<Name> or MCPEDL/<Category>/<Name> (any letter case).
# The CurseForge project itself is NOT touched; only this repository is cleaned.
# Needs the WORKFLOW_PAT secret to also push the refreshed dropdown (a workflow file); without it
# the deletion is still pushed and the dropdown is refreshed the next time you run Register
# CurseForge ID or sync_dispatch_choices.py.

on:
  workflow_dispatch:
    inputs:
      package:
        description: "1. Package to delete, e.g. Immortal-Pets, Addons/Immortal-Pets or MCPEDL/Maps/Oneblock-SM"
        required: true
        type: string
      confirm:
        description: "2. Confirm deletion (safety check)"
        required: true
        type: choice
        options:
          - "no"
          - "yes"
        default: "no"

permissions:
  contents: write
  actions: read

concurrency:
  group: delete-package-${{ github.ref }}
  cancel-in-progress: false

jobs:
  delete-package:
    name: Delete Package and clean everything it touches
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ secrets.WORKFLOW_PAT || secrets.GITHUB_TOKEN }}
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"

      - name: Install build dependency
        run: python3 -m pip install pillow

      # The passive build also writes to builds/ and the READMEs. Let a running build finish first.
      - name: Wait for running builds to finish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          for attempt in $(seq 1 60); do
            busy=0
            for status in in_progress queued; do
              count="$(gh run list --workflow auto-version-bump.yml --status "$status" --json databaseId --jq length 2>/dev/null || echo 0)"
              busy=$((busy + count))
            done
            [ "$busy" -eq 0 ] && exit 0
            echo "A build is still running ($busy); waiting (attempt $attempt/60)..."
            sleep 20
          done
          echo "::warning::A build is still running after 20 minutes; continuing anyway."

      - name: Delete the package and clean everything it touches
        id: delete
        env:
          PACKAGE: ${{ inputs.package }}
          CONFIRM: ${{ inputs.confirm }}
        run: |
          set -euo pipefail
          if [ "$CONFIRM" != "yes" ]; then
            echo "Deletion cancelled: confirmation was not set to yes."
            echo "## Delete Package" >> "$GITHUB_STEP_SUMMARY"
            echo "Cancelled. Set **confirm** to \`yes\` to delete." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          python3 scripts/delete_project.py --package "$PACKAGE" --confirm "$CONFIRM"

      - name: Commit and push changes
        if: steps.delete.outputs.deleted_slug != ''
        env:
          BRANCH: ${{ github.ref_name }}
          DELETED_SLUG: ${{ steps.delete.outputs.deleted_slug }}
          DELETED_TYPE: ${{ steps.delete.outputs.deleted_type }}
          HAS_PAT: ${{ secrets.WORKFLOW_PAT != '' }}
        run: |
          set -Eeuo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for path in MCPEDL builds changelog_views Mcpeworlds/README.md README.md; do
            if [ -e "$path" ] || git ls-files --error-unmatch -- "$path" >/dev/null 2>&1; then
              git add -A -- "$path"
            fi
          done

          # The dropdown lives in a workflow file, which only a PAT may push.
          if [ "$HAS_PAT" = "true" ]; then
            git add -- .github/workflows/publish-curseforge.yml
          elif ! git diff --quiet -- .github/workflows/publish-curseforge.yml; then
            echo "::warning::No WORKFLOW_PAT secret: the publish dropdown was not updated. Run scripts/sync_dispatch_choices.py locally and commit it."
            git checkout -- .github/workflows/publish-curseforge.yml
          fi

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "chore(delete): remove ${DELETED_SLUG} from ${DELETED_TYPE} [skip ci]"
          python3 scripts/git_push_retry.py --branch "$BRANCH"
