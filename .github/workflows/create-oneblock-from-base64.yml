name: Create OneBlock Add-on from Base64

# Paste the base64 produced by an AI agent (see ONEBLOCK_ADDON_GENERATOR.md).
# Decodes the ZIP, validates it, writes MCPEDL/maps/<Map-Name>/, then builds the
# Creative, Survival, and Hardcore worlds from Mcpeworlds/ in this same run.
# Builds happen here because pushes made with GITHUB_TOKEN do not trigger
# build-oneblock-variants.yml. Structural checks only: never an in-game test.

on:
  workflow_dispatch:
    inputs:
      map_name:
        description: "Map folder name to create under MCPEDL/maps/ (letters, numbers, . _ -)"
        required: true
        type: string
      payload_base64:
        description: "Base64 of the add-on ZIP, single line. Leave blank if you use payload_file."
        required: false
        default: ""
        type: string
      payload_file:
        description: "Alternative for big payloads: path to a .b64 file under MCPEDL/incoming/"
        required: false
        default: ""
        type: string
      overwrite:
        description: "Replace the map folder if it already exists"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: create-oneblock-from-base64-${{ github.ref }}
  cancel-in-progress: false

jobs:
  create:
    name: Create add-on and build worlds
    runs-on: ubuntu-latest
    env:
      ONEBLOCK_MAP: ${{ inputs.map_name }}
      ONEBLOCK_PAYLOAD: ${{ inputs.payload_base64 }}
      PAYLOAD_FILE: ${{ inputs.payload_file }}
      OVERWRITE: ${{ inputs.overwrite }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check inputs
        shell: bash
        run: |
          set -euo pipefail
          [[ "$ONEBLOCK_MAP" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$ ]] \
            || { echo "::error::Map name: letters, numbers, . _ - only (max 64)"; exit 1; }
          if [ -z "$ONEBLOCK_PAYLOAD" ] && [ -z "$PAYLOAD_FILE" ]; then
            echo "::error::Provide payload_base64 or payload_file"; exit 1
          fi
          for mode in Creative Survival Hardcore; do
            [ -f "Mcpeworlds/$mode/level.dat" ] \
              || { echo "::error::Missing foundation Mcpeworlds/$mode/level.dat"; exit 1; }
          done

      - name: Decode, validate, and write the add-on
        shell: bash
        run: |
          set -euo pipefail
          ARGS=(--map "$ONEBLOCK_MAP")
          if [ "$OVERWRITE" = "true" ]; then ARGS+=(--overwrite); fi
          if [ -z "$ONEBLOCK_PAYLOAD" ]; then ARGS+=(--payload-file "$PAYLOAD_FILE"); fi
          python scripts/import_oneblock_payload.py "${ARGS[@]}"

      - name: Build worlds from Mcpeworlds foundations
        run: python scripts/build_oneblock_variants_from_template.py

      - name: Synchronize map README with generated world archives
        run: python scripts/sync_oneblock_map_readmes.py

      - name: Verify generated worlds are database-free
        shell: bash
        run: |
          python3 - <<'PY'
          import glob, os, sys, zipfile
          folder = "MCPEDL/maps/" + os.environ["ONEBLOCK_MAP"]
          worlds = glob.glob(folder + "/*.mcworld")
          bad = []
          if not worlds:
              bad.append(f"No .mcworld produced in {folder}")
          for w in worlds:
              names = zipfile.ZipFile(w).namelist()
              if not any(n.endswith("level.dat") for n in names):
                  bad.append(f"{w}: missing level.dat")
              if any(n.startswith("db/") or "/db/" in n for n in names):
                  bad.append(f"{w}: contains db/ data")
          if bad:
              print("\n".join("::error::" + b for b in bad)); sys.exit(1)
          print(f"Structural checks passed for {len(worlds)} world(s). Not an in-game test.")
          PY

      - name: Upload worlds as artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.map_name }}-worlds
          path: MCPEDL/maps/${{ inputs.map_name }}/*.mcworld
          if-no-files-found: error
          retention-days: 90

      - name: Commit add-on and worlds
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A -- MCPEDL/maps
          if [ -z "$ONEBLOCK_PAYLOAD" ] && [ -n "$PAYLOAD_FILE" ]; then
            git rm -q --ignore-unmatch -- "$PAYLOAD_FILE"
          fi
          if git diff --cached --quiet; then
            echo "No changes to commit."; exit 0
          fi
          git commit -m "feat(oneblock): create ${ONEBLOCK_MAP} from base64 payload [skip ci]"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Summary
        if: ${{ always() }}
        shell: bash
        run: |
          {
            echo "### Create OneBlock Add-on"
            echo "- Map: \`${ONEBLOCK_MAP}\`"
            echo "- Verified: ZIP safety, manifests, tick.json, recipes, archive structure, no \`db/\` (structural only)"
            echo "- **Not verified:** Minecraft loading the world or gameplay. Test the Creative world in-game."
          } >> "$GITHUB_STEP_SUMMARY"
