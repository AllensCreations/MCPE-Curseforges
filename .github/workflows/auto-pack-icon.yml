name: Auto Pack Icon (image1 -> pack_icon.png)

on:
  push:
    branches: [main]
    paths:
      - 'MCPEDL/**/image1.*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: auto-pack-icon
  cancel-in-progress: false

jobs:
  make-icon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pillow
      - name: Convert image1 to pack_icon.png
        run: python3 scripts/make_pack_icon.py
      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A MCPEDL
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "chore: set pack_icon.png from image1 [skip ci]"
            git pull --rebase origin main
            git push origin main
          fi
