name: Refresh Listing Kits (Package/*.listing.md)

# Manual and triggerable workflow to refresh Package/<Pack>.listing.md for all packs or a single pack.
# Rebuilds the CurseForge description HTML, extracts in-game names for assets/items, and links recipe images/GIFs.
on:
  workflow_dispatch:
    inputs:
      scope:
        description: "Refresh all packs or one pack"
        required: true
        default: all
        type: choice
        options:
          - all
          - one pack
      project:
        description: "Project folder name if scope = one pack (e.g. Grimoire-Relics-V2 or Mining-Helmet)"
        required: false
        default: ""
        type: string

permissions:
  contents: write

concurrency:
  group: refresh-listing-kits-${{ github.ref }}
  cancel-in-progress: false

jobs:
  refresh-listings:
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Refresh Listing Kits
        env:
          SCOPE: ${{ inputs.scope }}
          PROJECT: ${{ inputs.project }}
        run: |
          set -euo pipefail
          if [ "$SCOPE" = "all" ] || [ -z "$PROJECT" ]; then
            echo "Refreshing all listing kits..."
            python3 scripts/build_listing_kits.py --all
          else
            found=""
            for cat in Addons Maps Script Minigame; do
              if [ -d "MCPEDL/$cat/$PROJECT" ]; then
                found="MCPEDL/$cat/$PROJECT"
                break
              fi
            done
            if [ -z "$found" ]; then
              echo "::error::Project $PROJECT not found under MCPEDL/*/"
              exit 1
            fi
            echo "Refreshing listing kit for $found..."
            python3 scripts/build_listing_kits.py --project "$found"
          fi

      - name: Commit refreshed listings
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Package/*.listing.md
          if git diff --cached --quiet; then
            echo "Listing kits are already up to date."
          else
            git commit -m "docs(package): refresh listing kits HTML description views [skip ci]"
            python3 scripts/git_push_retry.py --branch "${GITHUB_REF#refs/heads/}"
          fi
