name: "Create New Addon Scaffold"

on:
  workflow_dispatch:
    inputs:
      payload_b64:
        description: "Paste the Base64-encoded add-on payload. Everything else is automatic."
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: addon-scaffold-${{ github.ref }}
  cancel-in-progress: false

jobs:
  scaffold:
    runs-on: ubuntu-latest

    env:
      PAYLOAD_B64: ${{ inputs.payload_b64 }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Validate and decode payload
        id: payload
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import base64
          import json
          import os
          import re
          import sys

          def fail(message):
              print(f"::error::{message}")
              sys.exit(1)

          MAX_PAYLOAD_BYTES = 2 * 1024 * 1024

          encoded = re.sub(r"\s+", "", os.environ.get("PAYLOAD_B64", ""))

          if encoded.lower().startswith("base64:"):
              encoded = encoded[7:]

          if not encoded:
              fail("Base64 payload is required.")

          if len(encoded) > MAX_PAYLOAD_BYTES * 2:
              fail("Encoded payload exceeds the size limit.")

          try:
              decoded = base64.b64decode(
                  encoded + "=" * (-len(encoded) % 4),
                  validate=True
              )
              if len(decoded) > MAX_PAYLOAD_BYTES:
                  fail("Decoded payload exceeds the 2 MiB limit.")

              text = decoded.decode("utf-8")
          except Exception as exc:
              fail(f"Unable to decode Base64 payload: {exc}")

          sections = {}

          if text.lstrip().startswith("{"):
              try:
                  data = json.loads(text)
              except json.JSONDecodeError as exc:
                  fail(f"Invalid JSON payload: {exc}")

              if not isinstance(data, dict):
                  fail("JSON payload must be an object.")

              aliases = {
                  "addon_name": "addon_name",
                  "name": "addon_name",
                  "description": "description",
                  "overview": "overview",
                  "features": "features",
                  "limitations": "limitations",
                  "main_js": "main_js",
                  "min_engine_version": "min_engine_version",
                  "server_api_version": "server_api_version",
              }

              for key, value in data.items():
                  normalized = aliases.get(key.lower())

                  if normalized is None:
                      fail(f"Unknown payload field: {key}")

                  if normalized in sections:
                      fail(f"Duplicate payload field: {normalized}")

                  if not isinstance(value, str):
                      fail(f"Payload field '{key}' must be a string.")

                  sections[normalized] = value

          else:
              allowed = {
                  "addon_name",
                  "description",
                  "overview",
                  "features",
                  "limitations",
                  "main_js",
                  "min_engine_version",
                  "server_api_version",
              }

              aliases = {
                  "name": "addon_name",
                  "addon": "addon_name",
              }

              current = None
              buffers = {}

              for line_number, line in enumerate(text.splitlines(), 1):
                  match = re.fullmatch(
                      r"===([A-Za-z_]+)===",
                      line.strip()
                  )

                  if match:
                      key = match.group(1).lower()
                      key = aliases.get(key, key)

                      if key not in allowed:
                          fail(
                              f"Unknown section '{key}' "
                              f"on line {line_number}."
                          )

                      if key in buffers:
                          fail(f"Duplicate section: {key}")

                      buffers[key] = []
                      current = key
                      continue

                  if current is None:
                      if line.strip():
                          fail(
                              "Unexpected text before the first section marker."
                          )
                      continue

                  buffers[current].append(line)

              sections = {
                  key: "\n".join(lines).strip("\n")
                  for key, lines in buffers.items()
              }

          addon = sections.get("addon_name", "").strip()

          if not addon:
              fail("Missing required ADDON_NAME section.")

          if not re.fullmatch(r"[A-Za-z0-9_-]+", addon):
              fail(
                  "Invalid add-on name. Use letters, numbers, "
                  "hyphens, and underscores only."
              )

          description = " ".join(
              sections.get("description", "").split()
          )

          if not description:
              fail("Missing required DESCRIPTION section.")

          if len(description) > 256:
              fail("Description exceeds 256 characters.")

          main_js = sections.get("main_js", "").strip("\n")

          if not main_js.strip():
              fail("Missing required MAIN_JS section.")

          engine = (
              sections.get("min_engine_version", "").strip() or "1.26.0"
          )
          api_version = (
              sections.get("server_api_version", "").strip() or "2.0.0"
          )

          for label, version in [
              ("Minimum engine version", engine),
              ("Script API version", api_version),
          ]:
              if not re.fullmatch(r"[0-9]+\.[0-9]+\.[0-9]+", version):
                  fail(f"Invalid {label}: {version}")

          output_path = "_incoming/decoded_addon_payload.json"
          os.makedirs("_incoming", exist_ok=True)

          normalized = {
              "addon_name": addon,
              "description": description,
              "overview": sections.get("overview", "").strip(),
              "features": sections.get("features", ""),
              "limitations": sections.get("limitations", ""),
              "main_js": main_js,
              "min_engine_version": engine,
              "server_api_version": api_version,
          }

          with open(output_path, "w", encoding="utf-8") as file:
              json.dump(normalized, file, ensure_ascii=False, indent=2)
              file.write("\n")

          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as file:
              file.write(f"ADDON={addon}\n")
              file.write(f"ENGINE={engine}\n")
              file.write(f"API_VER={api_version}\n")

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as file:
              file.write(f"addon_name={addon}\n")

          print("Payload validated.")
          print(f"Add-on: {addon}")
          print(f"Minimum engine: {engine}")
          print(f"Script API: {api_version}")
          PY

      - name: Check repository and prepare files
        shell: bash
        run: |
          set -euo pipefail

          if [ -d "MCPEDL/addons/$ADDON" ]; then
            echo "::error::Add-on already exists: MCPEDL/addons/$ADDON"
            exit 1
          fi

          if [ ! -f "scripts/auto_bump_and_build.py" ]; then
            echo "::error::Missing scripts/auto_bump_and_build.py"
            exit 1
          fi

      - name: Generate behavior pack, manifest, and README
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import json
          import os
          import re
          import sys
          import uuid

          addon = os.environ["ADDON"]
          engine = [
              int(part)
              for part in os.environ["ENGINE"].split(".")
          ]
          api_version = os.environ["API_VER"]

          with open(
              "_incoming/decoded_addon_payload.json",
              encoding="utf-8"
          ) as file:
              data = json.load(file)

          root = f"MCPEDL/addons/{addon}"
          bp = f"{root}/behavior_pack"
          scripts = f"{bp}/scripts"

          os.makedirs(scripts, exist_ok=False)

          with open(
              f"{scripts}/main.js",
              "w",
              encoding="utf-8"
          ) as file:
              file.write(data["main_js"].rstrip("\n") + "\n")

          manifest = {
              "format_version": 2,
              "header": {
                  "name": f"{addon} BP by AllensCreations",
                  "description": data["description"],
                  "uuid": str(uuid.uuid4()),
                  "version": [1, 0, 0],
                  "min_engine_version": engine,
              },
              "modules": [
                  {
                      "description": f"{addon} Behavior Module",
                      "type": "data",
                      "uuid": str(uuid.uuid4()),
                      "version": [1, 0, 0],
                  },
                  {
                      "description": f"{addon} Script Module",
                      "type": "script",
                      "language": "javascript",
                      "uuid": str(uuid.uuid4()),
                      "version": [1, 0, 0],
                      "entry": "scripts/main.js",
                  },
              ],
              "dependencies": [
                  {
                      "module_name": "@minecraft/server",
                      "version": api_version,
                  }
              ],
          }

          uuids = [
              manifest["header"]["uuid"],
              *[
                  module["uuid"]
                  for module in manifest["modules"]
              ],
          ]

          if len(uuids) != len(set(uuids)):
              sys.exit("Generated manifest contains duplicate UUIDs.")

          with open(
              f"{bp}/manifest.json",
              "w",
              encoding="utf-8"
          ) as file:
              json.dump(manifest, file, indent=2, ensure_ascii=False)
              file.write("\n")

          def markdown_escape(value):
              return (
                  value.replace("\\", "\\\\")
                  .replace("|", "\\|")
                  .replace("\n", " ")
              )

          def list_items(value):
              return [
                  re.sub(r"^\s*[-*]\s+", "", line).strip()
                  for line in value.splitlines()
                  if line.strip()
              ]

          title = addon.replace("-", " ").replace("_", " ")
          features = list_items(data["features"])
          limitations = list_items(data["limitations"])

          readme = [
              f"# {title} - Add-on for Minecraft Bedrock",
              "",
              "Creator: AllensCreations",
              "",
              f"Description: {markdown_escape(data['description'])}",
              "",
          ]

          if data["overview"]:
              readme += [
                  "## Overview",
                  "",
                  data["overview"],
                  "",
              ]

          if features:
              readme += ["## Features", ""]
              readme += [f"- {item}" for item in features]
              readme += [""]

          readme += [
              "## Requirements",
              "",
              "| Requirement | Value |",
              "| --- | --- |",
              f"| Behavior pack | `{addon} BP by AllensCreations` |",
              f"| Script API | `@minecraft/server` {api_version} |",
              "| Entry point | `scripts/main.js` |",
              f"| Minimum engine | {'.'.join(map(str, engine))} |",
              "",
              "## Installation",
              "",
              "1. Download the generated package from the repository catalog.",
              "2. Open the package with Minecraft to import it.",
              f"3. Activate `{addon} BP by AllensCreations` in the world's Behavior Packs settings.",
              "4. Enable any additional requirements documented for this add-on.",
              "",
              "## Compatibility and known limitations",
              "",
              f"- Declared minimum engine version: {'.'.join(map(str, engine))}.",
              f"- Declared Script API dependency: {api_version}.",
              "- Runtime compatibility must be verified in the target game version.",
              "",
          ]

          if limitations:
              readme += [f"- {item}" for item in limitations]
              readme += [""]

          readme += [
              "## Credits and permissions",
              "",
              "- Creator: AllensCreations.",
              "- Give credit when showcasing this add-on.",
              "- Do not redistribute without authorization.",
              "",
              "All rights reserved for AllensCreations.",
              "",
          ]

          with open(
              f"{root}/README.md",
              "w",
              encoding="utf-8"
          ) as file:
              file.write("\n".join(readme))

          print(f"Generated scaffold for {addon}.")
          PY

      - name: Validate manifest and JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import json
          import os
          import sys

          root = f"MCPEDL/addons/{os.environ['ADDON']}/behavior_pack"

          with open(
              f"{root}/manifest.json",
              encoding="utf-8"
          ) as file:
              manifest = json.load(file)

          if manifest.get("format_version") != 2:
              sys.exit("Unsupported manifest format.")

          if not manifest.get("header", {}).get("uuid"):
              sys.exit("Missing header UUID.")

          modules = manifest.get("modules", [])

          if not any(
              module.get("type") == "script"
              and module.get("entry") == "scripts/main.js"
              for module in modules
          ):
              sys.exit("Missing valid script module.")

          if not os.path.isfile(f"{root}/scripts/main.js"):
              sys.exit("Missing main.js.")

          print("Manifest validation passed.")
          PY

          cp "MCPEDL/addons/$ADDON/behavior_pack/scripts/main.js" /tmp/check.mjs
          node --check /tmp/check.mjs

          echo "JavaScript syntax validation passed."

      - name: Build packages and register catalogs
        shell: bash
        run: |
          set -euo pipefail

          python3 scripts/auto_bump_and_build.py \
            --project "$ADDON" \
            --no-bump

      - name: Verify generated package
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -d "builds/$ADDON" ]; then
            echo "::error::Build directory not found."
            exit 1
          fi

          PACKAGE=$(find "builds/$ADDON" -type f \
            \( -name "*.mcpack" -o -name "*.mcaddon" -o -name "*.zip" \) \
            -print -quit)

          if [ -z "$PACKAGE" ]; then
            echo "::error::No distributable package found."
            exit 1
          fi

          python3 - "$PACKAGE" <<'PY'
          import sys
          import zipfile

          path = sys.argv[1]

          if not zipfile.is_zipfile(path):
              sys.exit(f"Invalid package archive: {path}")

          with zipfile.ZipFile(path) as archive:
              corrupt = archive.testzip()

              if corrupt:
                  sys.exit(f"Corrupt archive entry: {corrupt}")

          print(f"Package archive verified: {path}")
          PY

      - name: Commit and push changes
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add "MCPEDL/addons/$ADDON"
          git add -f "builds/$ADDON"

          [ -f README.md ] && git add README.md || true
          [ -f builds/README.md ] && git add builds/README.md || true
          [ -f MCPEDL/addons/README.md ] && git add MCPEDL/addons/README.md || true

          git add -f _incoming/decoded_addon_payload.json

          if git diff --cached --quiet; then
            echo "::error::No generated changes to commit."
            exit 1
          fi

          git commit -m "feat(addon): scaffold $ADDON and build packages [skip ci]"

          PUSHED=false

          for attempt in 1 2 3; do
            if git pull --rebase origin "$GITHUB_REF_NAME" &&
               git push origin "HEAD:$GITHUB_REF_NAME"; then
              PUSHED=true
              break
            fi

            echo "::warning::Push attempt $attempt failed."

            if [ "$attempt" -lt 3 ]; then
              if [ -d "$(git rev-parse --git-dir)/rebase-merge" ] ||
                 [ -d "$(git rev-parse --git-dir)/rebase-apply" ]; then
                git rebase --abort || true
              fi

              sleep 3
            fi
          done

          if [ "$PUSHED" != "true" ]; then
            echo "::error::Failed to push changes after three attempts."
            exit 1
          fi

      - name: Job summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Add-on Scaffold Results"
            echo ""
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Add-on | \`${ADDON:-Not generated}\` |"
            echo "| Engine | \`${ENGINE:-Unknown}\` |"
            echo "| Script API | \`${API_VER:-Unknown}\` |"
            echo "| Initial version | 1.0.0 |"
            echo ""
            echo "Review the workflow steps for validation, build, and push results."
          } >> "$GITHUB_STEP_SUMMARY"
