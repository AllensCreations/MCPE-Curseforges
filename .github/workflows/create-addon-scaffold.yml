name: "Create New Addon Scaffold"

on:
  workflow_dispatch:
    inputs:
      payload_b64:
        description: "Paste the Base64-encoded add-on payload."
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: addon-scaffold-${{ github.ref }}
  cancel-in-progress: false

jobs:
  scaffold:
    runs-on: ubuntu-latest

    env:
      PAYLOAD_B64: ${{ inputs.payload_b64 }}
      TARGET_FOLDER: "new_addons"
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate and decode Base64 payload
        id: payload
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import base64
          import binascii
          import json
          import os
          import re
          import sys
          from pathlib import PurePosixPath

          def fail(message):
              print(f"::error::{message}")
              sys.exit(1)

          MAX_BYTES = 8 * 1024 * 1024
          MAX_FILES = 500

          encoded = re.sub(
              r"\s+",
              "",
              os.environ.get("PAYLOAD_B64", "")
          )

          if encoded.lower().startswith("base64:"):
              encoded = encoded[7:]

          if not encoded:
              fail("Base64 payload is required.")

          if len(encoded) > ((MAX_BYTES + 2) // 3) * 4 + 8:
              fail("Encoded payload exceeds the size limit.")

          try:
              decoded = base64.b64decode(
                  encoded + "=" * (-len(encoded) % 4),
                  validate=True
              )

              if len(decoded) > MAX_BYTES:
                  fail("Decoded payload exceeds the 8 MiB limit.")

              text = decoded.decode("utf-8-sig")

          except (
              binascii.Error,
              UnicodeDecodeError,
              ValueError
          ) as exc:
              fail(f"Unable to decode Base64 payload: {exc}")

          slug = None
          files = {}
          current_path = None
          buffer = []
          reading_slug = False

          def finish_section():
              global current_path, buffer, reading_slug, slug

              if reading_slug:
                  value = "\n".join(buffer).strip()

                  if slug is not None:
                      fail("Duplicate SLUG section.")

                  slug = value
                  reading_slug = False
                  buffer = []
                  return

              if current_path is not None:
                  if current_path in files:
                      fail(f"Duplicate file path: {current_path}")

                  files[current_path] = "\n".join(buffer)
                  current_path = None
                  buffer = []

          lines = text.replace("\r\n", "\n").split("\n")

          if lines and lines[-1] == "":
              lines.pop()

          for line_number, line in enumerate(lines, 1):
              marker = line.strip()

              if marker == "===SLUG===":
                  finish_section()

                  if slug is not None:
                      fail("Duplicate SLUG section.")

                  reading_slug = True
                  buffer = []
                  continue

              match = re.fullmatch(r"===FILE:(.+)===", marker)

              if match:
                  finish_section()

                  if reading_slug:
                      fail("Missing slug value.")

                  current_path = match.group(1).strip()
                  buffer = []
                  continue

              if current_path is None and not reading_slug:
                  if marker:
                      fail(
                          f"Unexpected content on line {line_number}."
                      )
                  continue

              buffer.append(line)

          finish_section()

          if not slug:
              fail("Missing SLUG section.")

          if not re.fullmatch(r"[A-Za-z0-9_-]+", slug):
              fail(
                  "Invalid slug. Use letters, numbers, hyphens, "
                  "and underscores."
              )

          if not files:
              fail("No FILE sections were supplied.")

          if len(files) > MAX_FILES:
              fail(f"Too many files. Maximum allowed: {MAX_FILES}.")

          normalized = {}

          for path, content in files.items():
              if not path or "\\" in path or "\x00" in path:
                  fail(f"Invalid file path: {path!r}")

              pure = PurePosixPath(path)

              if (
                  pure.is_absolute()
                  or path.startswith("/")
                  or any(
                      part in ("", ".", "..")
                      for part in path.split("/")
                  )
                  or ":" in path
              ):
                  fail(f"Unsafe file path: {path}")

              if pure.parts[0] in (".git", "_incoming"):
                  fail(f"Reserved directory in payload path: {path}")

              if pure.name in ("README.md", "DESCRIPTION.md"):
                  fail(f"{pure.name} is generated automatically.")

              if path in normalized:
                  fail(f"Duplicate normalized path: {path}")

              normalized[path] = content

          if not any(
              PurePosixPath(path).name == "manifest.json"
              for path in normalized
          ):
              fail("Payload must contain at least one manifest.json.")

          os.makedirs("_incoming", exist_ok=True)

          with open(
              "_incoming/decoded_addon_payload.json",
              "w",
              encoding="utf-8",
              newline="\n"
          ) as output:
              json.dump(
                  {"slug": slug, "files": normalized},
                  output,
                  ensure_ascii=False
              )

          with open(
              os.environ["GITHUB_ENV"],
              "a",
              encoding="utf-8"
          ) as env:
              env.write(f"ADDON={slug}\n")
              env.write("TARGET_FOLDER=new_addons\n")

          with open(
              os.environ["GITHUB_OUTPUT"],
              "a",
              encoding="utf-8"
          ) as output:
              output.write(f"addon_name={slug}\n")

          print("Base64 payload decoded and validated.")
          print(f"Slug: {slug}")
          print("Target folder: MCPEDL/new_addons")
          print(f"Files: {len(normalized)}")
          PY

      - name: Check repository and existing project
        shell: bash
        run: |
          set -euo pipefail

          if [ -d "MCPEDL/new_addons/$ADDON" ]; then
            echo "::error::Add-on already exists: MCPEDL/new_addons/$ADDON"
            exit 1
          fi

          if [ ! -f "scripts/auto_bump_and_build.py" ]; then
            echo "::error::Missing scripts/auto_bump_and_build.py"
            exit 1
          fi

          mkdir -p MCPEDL/new_addons

      - name: Generate add-on files and placeholder README
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import json
          import os
          import sys

          addon = os.environ["ADDON"]
          root = os.path.join("MCPEDL", "new_addons", addon)
          payload_path = "_incoming/decoded_addon_payload.json"

          with open(payload_path, encoding="utf-8") as source:
              payload = json.load(source)

          if payload.get("slug") != addon:
              sys.exit("Payload slug does not match the validated add-on name.")

          files = payload.get("files")

          if not isinstance(files, dict) or not files:
              sys.exit("Payload contains no files.")

          os.makedirs(root, exist_ok=False)
          root_real = os.path.realpath(root)

          for relative_path, content in files.items():
              destination = os.path.join(
                  root,
                  *relative_path.split("/")
              )
              destination_real = os.path.realpath(destination)

              if not destination_real.startswith(root_real + os.sep):
                  sys.exit(f"Unsafe output path: {relative_path}")

              if not isinstance(content, str):
                  sys.exit(f"Invalid file content: {relative_path}")

              os.makedirs(
                  os.path.dirname(destination),
                  exist_ok=True
              )

              with open(
                  destination,
                  "w",
                  encoding="utf-8",
                  newline="\n"
              ) as output:
                  output.write(content)

                  if content and not content.endswith("\n"):
                      output.write("\n")

          readme = f"""# {addon}

          **Download:** See the [New Add-ons download catalog](https://github.com/AllensCreations/MCPE-Curseforges/blob/main/MCPEDL/new_addons/README.md).
          """

          description = f"""# {addon}

          **By AllensCreations**

          Add the verified, player-facing product description for this add-on here. Describe only features and requirements confirmed by the included pack files. Follow the repository's DESCRIPTION.md guidelines.
          """

          import textwrap

          readme = textwrap.dedent(readme).lstrip()
          description = textwrap.dedent(description).lstrip()

          for filename, content in (("README.md", readme), ("DESCRIPTION.md", description)):
              with open(
                  os.path.join(root, filename),
                  "w",
                  encoding="utf-8",
                  newline="\\n"
              ) as output:
                  output.write(content)

          with open(os.path.join(root, "LOCK"), "w", encoding="utf-8", newline="\n") as output:
              output.write(
                  "AllensCreations Add-on Lock v1\n\n"
                  "Required repository marker for build validation.\n"
                  "This marker does not encrypt source files or prevent extraction of distributable packages.\n"
              )

          print(f"Generated {len(files)} supplied files.")
          print(f"Generated README for {addon}.")
          for pack_name in ("behavior_pack", "resource_pack"):
              pack_dir = os.path.join(root, pack_name)
              if os.path.isdir(pack_dir) and os.path.isfile(os.path.join(pack_dir, "manifest.json")):
                  with open(os.path.join(pack_dir, "LOCK"), "w", encoding="utf-8", newline="\n") as output:
                      output.write(
                          "AllensCreations Add-on Lock v1\n\n"
                          "Pack marker included in the exported Minecraft Bedrock pack.\n"
                          "This marker does not encrypt the pack or prevent extraction or editing.\n"
                      )

          print(f"Generated LOCK marker for {addon} and its valid packs.")
          PY

      - name: Convert pixel textures to PNG
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import os
          import struct
          import sys
          import zlib

          root = os.path.join("MCPEDL", "new_addons", os.environ["ADDON"])


          def convert(src, dst):
              palette = {}
              rows = []

              with open(src, encoding="utf-8") as source:
                  for line in source:
                      line = line.strip()

                      if not line:
                          continue

                      if "=" in line:
                          key, value = line.split("=", 1)
                          value = value.strip().lstrip("#")

                          if len(value) == 6:
                              value += "FF"

                          if len(value) != 8:
                              sys.exit(f"Invalid palette color in {src}: {line}")

                          palette[int(key)] = tuple(
                              int(value[i:i + 2], 16) for i in range(0, 8, 2)
                          )
                      else:
                          rows.append([int(v) for v in line.strip(",").split(",")])

              if not rows:
                  sys.exit(f"No pixel rows in {src}")

              width = len(rows[0])
              height = len(rows)

              if width > 256 or height > 256:
                  sys.exit(f"Texture too large in {src}")

              for row in rows:
                  if len(row) != width:
                      sys.exit(f"Rows must have equal length in {src}")

                  for index in row:
                      if index not in palette:
                          sys.exit(f"Undefined palette index {index} in {src}")

              raw = b"".join(
                  b"\x00" + b"".join(bytes(palette[i]) for i in row)
                  for row in rows
              )

              def chunk(tag, data):
                  body = tag + data
                  return (
                      struct.pack(">I", len(data))
                      + body
                      + struct.pack(">I", zlib.crc32(body) & 0xFFFFFFFF)
                  )

              png = (
                  b"\x89PNG\r\n\x1a\n"
                  + chunk(b"IHDR", struct.pack(">IIBBBBB", width, height, 8, 6, 0, 0, 0))
                  + chunk(b"IDAT", zlib.compress(raw, 9))
                  + chunk(b"IEND", b"")
              )

              with open(dst, "wb") as output:
                  output.write(png)


          count = 0

          for current_root, _, filenames in os.walk(root):
              for filename in filenames:
                  if filename.lower().endswith(".px"):
                      source_path = os.path.join(current_root, filename)
                      target_path = source_path[:-3] + ".png"
                      convert(source_path, target_path)
                      os.remove(source_path)
                      count += 1
                      print(f"Converted {source_path} -> {target_path}")

          print(f"Converted {count} pixel texture(s).")
          PY

      - name: Validate manifests, UUIDs, paths, and JSON
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import json
          import os
          import sys
          import uuid

          root = os.path.realpath(
              os.path.join("MCPEDL", "new_addons", os.environ["ADDON"])
          )

          manifest_count = 0
          seen_uuids = set()

          def validate_uuid(value, description, path):
              try:
                  parsed = str(uuid.UUID(value))
              except (ValueError, TypeError, AttributeError):
                  sys.exit(f"Invalid {description} UUID in {path}")

              if parsed in seen_uuids:
                  sys.exit(f"Duplicate UUID: {parsed}")

              seen_uuids.add(parsed)

          def validate_version(value, description, path):
              if (
                  not isinstance(value, list)
                  or len(value) != 3
                  or any(
                      type(part) is not int or part < 0
                      for part in value
                  )
              ):
                  sys.exit(f"Invalid {description} in {path}")

          def check_description(value, where, path):
              if value is None:
                  return

              if not isinstance(value, str):
                  sys.exit(f"Invalid {where} description in {path}")

              if len(value) > 256:
                  sys.exit(
                      f"{where} description exceeds 256 characters in {path}"
                  )

          for current_root, directories, filenames in os.walk(root):
              directories[:] = [
                  name for name in directories
                  if name != "__pycache__"
              ]

              for filename in filenames:
                  path = os.path.join(current_root, filename)

                  if not filename.endswith(".json"):
                      continue

                  try:
                      with open(path, encoding="utf-8") as source:
                          data = json.load(source)
                  except Exception as exc:
                      sys.exit(f"Invalid JSON file {path}: {exc}")

                  if filename != "manifest.json":
                      continue

                  manifest_count += 1

                  if not isinstance(data, dict):
                      sys.exit(f"Manifest must be a JSON object: {path}")

                  metadata = data.get("metadata")

                  if not isinstance(metadata, dict):
                      metadata = {}
                      data["metadata"] = metadata

                  metadata["authors"] = ["AllensCreations"]
                  metadata["product_type"] = "addon"

                  with open(path, "w", encoding="utf-8") as output:
                      json.dump(
                          data,
                          output,
                          indent=2,
                          ensure_ascii=False
                      )
                      output.write("\n")

                  header = data.get("header")

                  if not isinstance(header, dict):
                      sys.exit(f"Missing manifest header: {path}")

                  if (
                      not isinstance(header.get("name"), str)
                      or not header["name"].strip()
                  ):
                      sys.exit(f"Missing header name: {path}")

                  check_description(
                      header.get("description"),
                      "header",
                      path
                  )

                  validate_uuid(header.get("uuid"), "header", path)
                  validate_version(
                      header.get("version"),
                      "header version",
                      path
                  )
                  validate_version(
                      header.get("min_engine_version"),
                      "minimum engine version",
                      path
                  )

                  modules = data.get("modules")

                  if not isinstance(modules, list) or not modules:
                      sys.exit(f"Missing manifest modules: {path}")

                  pack_root = os.path.dirname(path)

                  for module in modules:
                      if not isinstance(module, dict):
                          sys.exit(f"Invalid module in {path}")

                      check_description(
                          module.get("description"),
                          "module",
                          path
                      )

                      validate_uuid(
                          module.get("uuid"),
                          "module",
                          path
                      )

                      validate_version(
                          module.get("version"),
                          "module version",
                          path
                      )

                      if module.get("type") == "script":
                          entry = module.get("entry")

                          if not isinstance(entry, str) or not entry:
                              sys.exit(
                                  f"Script module missing entry: {path}"
                              )

                          if "\\" in entry or entry.startswith("/"):
                              sys.exit(f"Unsafe script entry: {entry}")

                          entry_path = os.path.realpath(
                              os.path.join(pack_root, entry)
                          )

                          if not entry_path.startswith(pack_root + os.sep):
                              sys.exit(f"Unsafe script entry: {entry}")

                          if not os.path.isfile(entry_path):
                              sys.exit(
                                  f"Script entry does not exist: {entry}"
                              )

          if manifest_count == 0:
              sys.exit("No manifests found.")

          print(f"Validated {manifest_count} manifest(s).")
          print(f"Validated {len(seen_uuids)} unique UUID(s).")
          print("All JSON files are valid.")
          PY

      - name: Validate JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail

          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          count=0

          while IFS= read -r -d '' file; do
            cp "$file" "$tmp/check.mjs"

            if ! node --check "$tmp/check.mjs"; then
              echo "::error::Syntax error in $file"
              exit 1
            fi

            count=$((count + 1))
          done < <(
            find "MCPEDL/new_addons/$ADDON" \
              -type f -name '*.js' -print0
          )

          echo "JavaScript syntax validation passed ($count file(s))."

      - name: Build packages and register catalogs
        shell: bash
        run: |
          set -euo pipefail

          python3 scripts/auto_bump_and_build.py \
            --project "$ADDON" \
            --no-bump

      - name: Update new_addons source catalog
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import json
          import textwrap
          from pathlib import Path

          root = Path("MCPEDL/new_addons")
          builds = Path("builds")
          readme = root / "README.md"

          root.mkdir(parents=True, exist_ok=True)
          rows = []

          def clean(value):
              return (
                  str(value)
                  .replace("|", "\\|")
                  .replace("\r", " ")
                  .replace("\n", " ")
              )

          for addon_dir in sorted(root.iterdir()):
              if not addon_dir.is_dir():
                  continue

              slug = addon_dir.name
              manifests = sorted(addon_dir.rglob("manifest.json"))

              if not manifests:
                  continue

              name = slug
              description = "Minecraft Bedrock add-on."
              version = "Unknown"

              for manifest in manifests:
                  try:
                      data = json.loads(
                          manifest.read_text(encoding="utf-8")
                      )
                  except (OSError, json.JSONDecodeError):
                      continue

                  header = data.get("header", {})

                  if header.get("name"):
                      name = header["name"]

                  if header.get("description"):
                      description = header["description"]

                  if isinstance(header.get("version"), list):
                      version = ".".join(
                          str(part)
                          for part in header["version"]
                      )

                  break

              primary_package = None
              build_dir = builds / slug

              if build_dir.exists():
                  for ext in (".mcaddon", ".mcpack", ".zip"):
                      for package in sorted(build_dir.rglob(f"*{ext}"), reverse=True):
                          primary_package = package
                          break
                      if primary_package:
                          break

              if primary_package:
                  relative = primary_package.as_posix()
                  url = (
                      "https://github.com/AllensCreations/"
                      "MCPE-Curseforges/raw/main/"
                      + relative
                  )
                  pkg_ext = primary_package.suffix.lstrip(".").upper()
                  package_text = f"[{pkg_ext}]({url})"
              else:
                  package_text = "Not built"

              clean_name = clean(name).replace(" BP by AllensCreations", "").replace(" RP by AllensCreations", "").replace(" by AllensCreations", "").replace(" BP", "").replace(" RP", "").strip()

              rows.append(
                  f"| {clean_name} | {clean(version)} | [Source]({slug}/) | {package_text} |"
              )

          table = "\n".join(rows) if rows else (
              "| No add-ons registered yet. | | | |"
          )

          content = f"""# New Add-ons

          Source files for newly generated Minecraft Bedrock add-ons by AllensCreations.

          ## Available Add-ons

          | Add-on | Version | Source | Download |
          | :--- | :--- | :--- | :--- |
          {table}

          The catalog is automatically updated by the add-on generation workflow.

          ## Attribution

          Created by AllensCreations. All rights reserved.

          Videos and streams are welcome with credit. Redistribution of original or modified files without permission is prohibited.

          ## Related Directories

          - [Existing Add-ons](../addons/README.md)
          - [Scripts and Minigames](../script/README.md)
          """

          content = textwrap.dedent(content).lstrip()
          readme.write_text(content, encoding="utf-8")

          print(f"Updated {readme} with {len(rows)} add-on(s).")
          PY

      - name: Verify generated packages
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -d "builds/$ADDON" ]; then
            echo "::error::Build directory not found: builds/$ADDON"
            exit 1
          fi

          python3 - "$ADDON" <<'PY'
          import os
          import sys
          import zipfile

          addon = sys.argv[1]
          build_root = os.path.join("builds", addon)
          packages = []

          for current_root, _, filenames in os.walk(build_root):
              for filename in filenames:
                  if filename.lower().endswith(
                      (".mcpack", ".mcaddon", ".zip")
                  ):
                      packages.append(
                          os.path.join(current_root, filename)
                      )

          if not packages:
              sys.exit("No distributable packages found.")

          for path in packages:
              if not zipfile.is_zipfile(path):
                  sys.exit(f"Invalid package archive: {path}")

              with zipfile.ZipFile(path) as archive:
                  bad_entry = archive.testzip()

                  if bad_entry:
                      sys.exit(
                          f"Corrupt archive entry in {path}: {bad_entry}"
                      )

                  if not any(
                      name == "manifest.json"
                      or name.endswith("/manifest.json")
                      for name in archive.namelist()
                  ):
                      sys.exit(
                          f"Package contains no manifest.json: {path}"
                      )

              print(f"Verified: {path}")

          print(f"Verified {len(packages)} package(s).")
          PY

      - name: Commit and push changes
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          branch="${GITHUB_REF_NAME}"

          if [ -z "$branch" ]; then
            echo "::error::Unable to determine target branch."
            exit 1
          fi

          # Remove temporary payload data before staging.
          rm -rf _incoming

          # Stage only the generated add-on, build, and known catalogs.
          git add -- "MCPEDL/new_addons/$ADDON"
          git add -- "MCPEDL/new_addons/README.md"
          git add -f -- "builds/$ADDON"

          for path in \
            README.md \
            builds/README.md \
            MCPEDL/README.md \
            MCPEDL/addons/README.md \
            MCPEDL/script/README.md
          do
            if [ -f "$path" ]; then
              git add -- "$path"
            fi
          done

          # Include tracked catalog updates from the build script.
          git add -u -- \
            README.md \
            builds \
            MCPEDL

          if git diff --cached --quiet; then
            echo "::error::No changes staged for commit."
            exit 1
          fi

          git commit \
            -m "feat(addon): generate $ADDON packages [skip ci]"

          if ! git diff --quiet || \
             [ -n "$(git ls-files --others --exclude-standard)" ]; then
            echo "::error::Uncommitted changes remain after staging."
            git status --short
            exit 1
          fi

          for attempt in 1 2 3; do
            echo "Push attempt $attempt of 3."

            git fetch origin "$branch"

            if ! git rebase "origin/$branch"; then
              echo "::error::Rebase failed."
              git rebase --abort || true
              exit 1
            fi

            if git push origin "HEAD:refs/heads/$branch"; then
              echo "Changes pushed successfully."
              exit 0
            fi

            echo "::warning::Push attempt $attempt failed."

            if [ "$attempt" -lt 3 ]; then
              sleep 3
            fi
          done

          echo "::error::Failed to push changes after three attempts."
          exit 1

      - name: Job summary
        if: always()
        shell: bash
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          README_STATE="Not generated"

          if [ -n "${ADDON:-}" ] && \
             [ -f "MCPEDL/new_addons/${ADDON}/README.md" ]; then
            README_STATE="Generated"
          fi

          CATALOG_STATE="Not generated"

          if [ -f "MCPEDL/new_addons/README.md" ]; then
            CATALOG_STATE="Available"
          fi

          {
            echo "## Add-on Generation Results"
            echo ""
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Status | ${JOB_STATUS} |"
            echo "| Slug | \`${ADDON:-Not generated}\` |"
            echo "| Source Directory | \`MCPEDL/new_addons/\` |"
            echo "| Add-on README | ${README_STATE} |"
            echo "| Source Catalog | ${CATALOG_STATE} |"
            echo ""
            echo "Review the preceding steps for validation, build, and push results."
          } >> "$GITHUB_STEP_SUMMARY"
