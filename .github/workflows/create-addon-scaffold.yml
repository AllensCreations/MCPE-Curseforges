name: "Create New Addon Scaffold"

on:
  workflow_dispatch:
    inputs:
      payload_b64:
        description: "Paste the Base64-encoded plain-text add-on payload."
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: addon-scaffold-${{ github.ref }}
  cancel-in-progress: false

jobs:
  scaffold:
    runs-on: ubuntu-latest

    env:
      PAYLOAD_B64: ${{ inputs.payload_b64 }}
      PYTHONDONTWRITEBYTECODE: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Validate and decode Base64 payload
        id: payload
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import base64
          import os
          import re
          import sys

          def fail(message):
              print(f"::error::{message}")
              sys.exit(1)

          MAX_BYTES = 8 * 1024 * 1024

          encoded = re.sub(
              r"\s+",
              "",
              os.environ.get("PAYLOAD_B64", "")
          )

          if encoded.lower().startswith("base64:"):
              encoded = encoded[7:]

          if not encoded:
              fail("Base64 payload is required.")

          if len(encoded) > MAX_BYTES * 2:
              fail("Encoded payload exceeds the size limit.")

          try:
              decoded = base64.b64decode(
                  encoded + "=" * (-len(encoded) % 4),
                  validate=True
              )

              if len(decoded) > MAX_BYTES:
                  fail("Decoded payload exceeds the 8 MiB limit.")

              text = decoded.decode("utf-8")

          except Exception as exc:
              fail(f"Unable to decode Base64 payload: {exc}")

          lines = text.splitlines()
          slug = None
          files = {}
          current_path = None
          buffer = []

          def finish_file():
              global current_path, buffer

              if current_path is None:
                  return

              if current_path in files:
                  fail(f"Duplicate file path: {current_path}")

              files[current_path] = "\n".join(buffer)

          for line_number, line in enumerate(lines, 1):
              marker = line.strip()

              if marker == "===SLUG===":
                  finish_file()
                  current_path = None
                  buffer = []

                  if slug is not None:
                      fail("Duplicate SLUG section.")

                  slug = "__reading_slug__"
                  current_path = "__slug__"
                  continue

              file_match = re.fullmatch(
                  r"===FILE:(.+)===",
                  marker
              )

              if file_match:
                  finish_file()

                  current_path = file_match.group(1).strip()
                  buffer = []

                  if current_path == "__slug__":
                      fail("Reserved path.")

                  continue

              if current_path is None:
                  if marker:
                      fail(
                          f"Unexpected content on line {line_number}."
                      )
                  continue

              buffer.append(line)

          finish_file()

          if slug == "__reading_slug__":
              slug = files.pop("__slug__", "").strip()

          if not slug:
              fail("Missing SLUG section.")

          if not re.fullmatch(r"[A-Za-z0-9_-]+", slug):
              fail(
                  "Invalid slug. Use letters, numbers, "
                  "hyphens, and underscores."
              )

          if not files:
              fail("No FILE sections were supplied.")

          from pathlib import PurePosixPath

          normalized_files = {}

          for path, content in files.items():
              if not path or "\\" in path:
                  fail(f"Invalid file path: {path}")

              pure = PurePosixPath(path)

              if (
                  pure.is_absolute()
                  or any(part in ("", ".", "..") for part in pure.parts)
                  or ":" in path
                  or "\x00" in path
              ):
                  fail(f"Unsafe file path: {path}")

              if path.startswith(".git/") or path == ".git":
                  fail("Git metadata cannot be included in the payload.")

              if path == "README.md":
                  fail(
                      "README.md is generated automatically. "
                      "Remove it from the payload."
                  )

              if path in normalized_files:
                  fail(f"Duplicate normalized path: {path}")

              normalized_files[path] = content

          if not any(
              path.endswith("/manifest.json")
              or path == "manifest.json"
              for path in normalized_files
          ):
              fail("Payload must contain at least one manifest.json.")

          output_dir = "_incoming"
          os.makedirs(output_dir, exist_ok=True)

          output_path = os.path.join(
              output_dir,
              "decoded_addon_payload.txt"
          )

          with open(
              output_path,
              "w",
              encoding="utf-8",
              newline="\n"
          ) as output:
              output.write(f"SLUG={slug}\n")

              for path, content in normalized_files.items():
                  output.write(f"\n===FILE:{path}===\n")
                  output.write(content)
                  output.write("\n")

          with open(
              os.environ["GITHUB_ENV"],
              "a",
              encoding="utf-8"
          ) as env:
              env.write(f"ADDON={slug}\n")

          with open(
              os.environ["GITHUB_OUTPUT"],
              "a",
              encoding="utf-8"
          ) as output:
              output.write(f"addon_name={slug}\n")

          print("Base64 payload decoded and validated.")
          print(f"Slug: {slug}")
          print(f"Files: {len(normalized_files)}")
          PY

      - name: Check repository and existing project
        shell: bash
        run: |
          set -euo pipefail

          if [ -d "MCPEDL/addons/$ADDON" ]; then
            echo "::error::Add-on already exists: MCPEDL/addons/$ADDON"
            exit 1
          fi

          if [ ! -f "scripts/auto_bump_and_build.py" ]; then
            echo "::error::Missing scripts/auto_bump_and_build.py"
            exit 1
          fi

      - name: Generate add-on files and placeholder README
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import os
          import re
          import sys
          import uuid

          addon = os.environ["ADDON"]

          payload_path = "_incoming/decoded_addon_payload.txt"
          root = f"MCPEDL/addons/{addon}"

          files = {}
          current_path = None
          buffer = []

          with open(
              payload_path,
              encoding="utf-8"
          ) as source:
              for line in source:
                  line = line.rstrip("\n")

                  match = re.fullmatch(
                      r"===FILE:(.+)===",
                      line.strip()
                  )

                  if match:
                      if current_path is not None:
                          files[current_path] = "\n".join(buffer)

                      current_path = match.group(1).strip()
                      buffer = []
                      continue

                  if current_path is not None:
                      buffer.append(line)

          if current_path is not None:
              files[current_path] = "\n".join(buffer)

          if not files:
              sys.exit("No files found in decoded payload.")

          os.makedirs(root, exist_ok=False)

          for relative_path, content in files.items():
              destination = os.path.join(root, relative_path)

              resolved_root = os.path.realpath(root)
              resolved_destination = os.path.realpath(destination)

              if not (
                  resolved_destination == resolved_root
                  or resolved_destination.startswith(
                      resolved_root + os.sep
                  )
              ):
                  sys.exit(f"Unsafe output path: {relative_path}")

              os.makedirs(
                  os.path.dirname(destination),
                  exist_ok=True
              )

              with open(
                  destination,
                  "w",
                  encoding="utf-8",
                  newline="\n"
              ) as output:
                  output.write(content)

                  if content and not content.endswith("\n"):
                      output.write("\n")

          readme = f"""# {addon}

This add-on was generated automatically by the AllensCreations add-on workflow.

## Documentation status

- Actual README documentation: Missing.
- Logo: Missing.
- Banner: Missing.

These assets have not been supplied or generated by this workflow. Replace this placeholder README and add the missing branding assets before publishing the add-on.

## Project files

The project files are generated from the supplied Base64 payload. Refer to the included manifests and pack contents for the add-on configuration.
"""

          with open(
              os.path.join(root, "README.md"),
              "w",
              encoding="utf-8"
          ) as output:
              output.write(readme)

          print(f"Generated {len(files)} supplied files.")
          print(f"Generated placeholder README for {addon}.")
          PY

      - name: Validate manifests, UUIDs, paths, and JavaScript
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import json
          import os
          import re
          import sys
          import uuid

          root = f"MCPEDL/addons/{os.environ['ADDON']}"

          manifest_count = 0
          seen_uuids = set()
          script_files = []

          for current_root, directories, filenames in os.walk(root):
              directories[:] = [
                  name for name in directories
                  if name != "__pycache__"
              ]

              for filename in filenames:
                  path = os.path.join(current_root, filename)

                  if filename == "manifest.json":
                      manifest_count += 1

                      try:
                          with open(
                              path,
                              encoding="utf-8"
                          ) as source:
                              manifest = json.load(source)
                      except Exception as exc:
                          sys.exit(
                              f"Invalid manifest {path}: {exc}"
                          )

                      if not isinstance(manifest, dict):
                          sys.exit(
                              f"Manifest must be an object: {path}"
                          )

                      header = manifest.get("header")

                      if not isinstance(header, dict):
                          sys.exit(
                              f"Missing manifest header: {path}"
                          )

                      if not header.get("name"):
                          sys.exit(
                              f"Missing header name: {path}"
                          )

                      try:
                          header_uuid = str(
                              uuid.UUID(header["uuid"])
                          )
                      except Exception:
                          sys.exit(
                              f"Invalid header UUID: {path}"
                          )

                      if header_uuid in seen_uuids:
                          sys.exit(
                              f"Duplicate UUID: {header_uuid}"
                          )

                      seen_uuids.add(header_uuid)

                      if not isinstance(
                          header.get("version"),
                          list
                      ) or len(header["version"]) != 3:
                          sys.exit(
                              f"Invalid header version: {path}"
                          )

                      if not isinstance(
                          header.get("min_engine_version"),
                          list
                      ) or len(header["min_engine_version"]) != 3:
                          sys.exit(
                              f"Invalid minimum engine version: {path}"
                          )

                      modules = manifest.get("modules", [])

                      if not isinstance(modules, list) or not modules:
                          sys.exit(
                              f"Missing manifest modules: {path}"
                          )

                      for module in modules:
                          if not isinstance(module, dict):
                              sys.exit(
                                  f"Invalid module in {path}"
                              )

                          try:
                              module_uuid = str(
                                  uuid.UUID(module["uuid"])
                              )
                          except Exception:
                              sys.exit(
                                  f"Invalid module UUID: {path}"
                              )

                          if module_uuid in seen_uuids:
                              sys.exit(
                                  f"Duplicate UUID: {module_uuid}"
                              )

                          seen_uuids.add(module_uuid)

                          if module.get("type") == "script":
                              entry = module.get("entry")

                              if not isinstance(entry, str):
                                  sys.exit(
                                      f"Script module missing entry: {path}"
                                  )

                              pack_root = os.path.dirname(path)
                              entry_path = os.path.realpath(
                                  os.path.join(pack_root, entry)
                              )

                              if not entry_path.startswith(
                                  os.path.realpath(pack_root) + os.sep
                              ):
                                  sys.exit(
                                      f"Unsafe script entry: {entry}"
                                  )

                              if not os.path.isfile(entry_path):
                                  sys.exit(
                                      f"Script entry does not exist: "
                                      f"{entry_path}"
                                  )

                              if entry_path.endswith(".js"):
                                  script_files.append(entry_path)

                  elif filename.endswith(".json"):
                      try:
                          with open(
                              path,
                              encoding="utf-8"
                          ) as source:
                              json.load(source)
                      except Exception as exc:
                          sys.exit(
                              f"Invalid JSON file {path}: {exc}"
                          )

          if manifest_count == 0:
              sys.exit("No manifests found.")

          print(f"Validated {manifest_count} manifest(s).")
          print(f"Validated {len(seen_uuids)} unique UUID(s).")
          print("All JSON files are valid.")
          PY

          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(
            find "MCPEDL/addons/$ADDON" \
              -type f -name '*.js' -print0
          )

          echo "JavaScript syntax validation passed."

      - name: Build packages and register catalogs
        shell: bash
        run: |
          set -euo pipefail

          python3 scripts/auto_bump_and_build.py \
            --project "$ADDON" \
            --no-bump

      - name: Verify generated packages
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -d "builds/$ADDON" ]; then
            echo "::error::Build directory not found."
            exit 1
          fi

          python3 - "$ADDON" <<'PY'
          import os
          import sys
          import zipfile

          addon = sys.argv[1]
          build_root = f"builds/{addon}"

          packages = []

          for root, _, filenames in os.walk(build_root):
              for filename in filenames:
                  if filename.endswith(
                      (".mcpack", ".mcaddon", ".zip")
                  ):
                      packages.append(
                          os.path.join(root, filename)
                      )

          if not packages:
              sys.exit("No distributable packages found.")

          for path in packages:
              if not zipfile.is_zipfile(path):
                  sys.exit(f"Invalid package archive: {path}")

              with zipfile.ZipFile(path) as archive:
                  bad_entry = archive.testzip()

                  if bad_entry:
                      sys.exit(
                          f"Corrupt archive entry in {path}: "
                          f"{bad_entry}"
                      )

              print(f"Verified: {path}")

          print(f"Verified {len(packages)} package(s).")
          PY

      - name: Commit and push changes
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add "MCPEDL/addons/$ADDON"
          git add -f "builds/$ADDON"

          [ -f README.md ] && git add README.md || true
          [ -f builds/README.md ] && git add builds/README.md || true
          [ -f MCPEDL/addons/README.md ] && git add MCPEDL/addons/README.md || true

          if git diff --cached --quiet; then
            echo "::error::No generated changes to commit."
            exit 1
          fi

          git commit \
            -m "feat(addon): generate $ADDON packages [skip ci]"

          PUSHED=false

          for attempt in 1 2 3; do
            if git pull --rebase origin "$GITHUB_REF_NAME" &&
               git push origin "HEAD:$GITHUB_REF_NAME"; then
              PUSHED=true
              break
            fi

            echo "::warning::Push attempt $attempt failed."

            if [ "$attempt" -lt 3 ]; then
              if [ -d "$(git rev-parse --git-dir)/rebase-merge" ] ||
                 [ -d "$(git rev-parse --git-dir)/rebase-apply" ]; then
                git rebase --abort || true
              fi

              sleep 3
            fi
          done

          if [ "$PUSHED" != "true" ]; then
            echo "::error::Failed to push changes after three attempts."
            exit 1
          fi

      - name: Job summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Add-on Generation Results"
            echo ""
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Slug | \`${ADDON:-Not generated}\` |"
            echo "| README | Placeholder generated |"
            echo "| Logo | Not supplied |"
            echo "| Banner | Not supplied |"
            echo ""
            echo "Review the preceding steps for validation, build, and push results."
          } >> "$GITHUB_STEP_SUMMARY"
