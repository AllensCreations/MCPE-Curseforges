name: "Create New Addon Scaffold"

on:
  workflow_dispatch:
    inputs:
      payload_b64:
        description: "Paste the Base64-encoded add-on payload."
        required: true
        type: string
      target_folder:
        description: "Target subfolder under MCPEDL (default: 'new_addons' or customize e.g. 'addons')."
        required: false
        default: "new_addons"
        type: string

permissions:
  contents: write

concurrency:
  group: addon-scaffold-${{ github.ref }}
  cancel-in-progress: false

jobs:
  scaffold:
    runs-on: ubuntu-latest

    env:
      PAYLOAD_B64: ${{ inputs.payload_b64 }}
      TARGET_FOLDER: ${{ inputs.target_folder || 'new_addons' }}
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate and decode Base64 payload
        id: payload
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import base64
          import binascii
          import json
          import os
          import re
          import sys
          from pathlib import PurePosixPath

          def fail(message):
              print(f"::error::{message}")
              sys.exit(1)

          MAX_BYTES = 8 * 1024 * 1024
          MAX_FILES = 500

          encoded = re.sub(
              r"\s+",
              "",
              os.environ.get("PAYLOAD_B64", "")
          )

          if encoded.lower().startswith("base64:"):
              encoded = encoded[7:]

          if not encoded:
              fail("Base64 payload is required.")

          if len(encoded) > ((MAX_BYTES + 2) // 3) * 4 + 8:
              fail("Encoded payload exceeds the size limit.")

          try:
              decoded = base64.b64decode(
                  encoded + "=" * (-len(encoded) % 4),
                  validate=True
              )

              if len(decoded) > MAX_BYTES:
                  fail("Decoded payload exceeds the 8 MiB limit.")

              text = decoded.decode("utf-8-sig")

          except (binascii.Error, UnicodeDecodeError, ValueError) as exc:
              fail(f"Unable to decode Base64 payload: {exc}")

          slug = None
          files = {}
          current_path = None
          buffer = []
          reading_slug = False

          def finish_section():
              global current_path, buffer, reading_slug, slug

              if reading_slug:
                  value = "\n".join(buffer).strip()

                  if slug is not None:
                      fail("Duplicate SLUG section.")

                  slug = value
                  reading_slug = False
                  buffer = []
                  return

              if current_path is not None:
                  if current_path in files:
                      fail(f"Duplicate file path: {current_path}")

                  files[current_path] = "\n".join(buffer)
                  current_path = None
                  buffer = []

          for line_number, line in enumerate(text.splitlines(), 1):
              marker = line.strip()

              if marker == "===SLUG===":
                  finish_section()

                  if slug is not None:
                      fail("Duplicate SLUG section.")

                  reading_slug = True
                  buffer = []
                  continue

              match = re.fullmatch(r"===FILE:(.+)===", marker)

              if match:
                  finish_section()

                  if reading_slug:
                      fail("Missing slug value.")

                  current_path = match.group(1).strip()
                  buffer = []
                  continue

              if current_path is None and not reading_slug:
                  if marker:
                      fail(f"Unexpected content on line {line_number}.")
                  continue

              buffer.append(line)

          finish_section()

          if not slug:
              fail("Missing SLUG section.")

          if not re.fullmatch(r"[A-Za-z0-9_-]+", slug):
              fail("Invalid slug. Use letters, numbers, hyphens, and underscores.")

          if not files:
              fail("No FILE sections were supplied.")

          if len(files) > MAX_FILES:
              fail(f"Too many files. Maximum allowed: {MAX_FILES}.")

          normalized = {}

          for path, content in files.items():
              if not path or "\\" in path or "\x00" in path:
                  fail(f"Invalid file path: {path!r}")

              pure = PurePosixPath(path)

              if (
                  pure.is_absolute()
                  or path.startswith("/")
                  or any(part in ("", ".", "..") for part in path.split("/"))
                  or ":" in path
              ):
                  fail(f"Unsafe file path: {path}")

              if pure.parts[0] == ".git":
                  fail("Git metadata cannot be included in the payload.")

              if pure.parts[0] == "_incoming":
                  fail("The _incoming directory is reserved.")

              if pure.name == "README.md":
                  fail("README.md is generated automatically.")

              if path in normalized:
                  fail(f"Duplicate normalized path: {path}")

              normalized[path] = content

          if not any(
              PurePosixPath(path).name == "manifest.json"
              for path in normalized
          ):
              fail("Payload must contain at least one manifest.json.")

          os.makedirs("_incoming", exist_ok=True)

          with open(
              "_incoming/decoded_addon_payload.json",
              "w",
              encoding="utf-8",
              newline="\n"
          ) as output:
              json.dump(
                  {"slug": slug, "files": normalized},
                  output,
                  ensure_ascii=False
              )

          folder_raw = os.environ.get("TARGET_FOLDER", "new_addons")
          target_folder = re.sub(r"^MCPEDL[/\\]?", "", folder_raw).strip("/\\") or "new_addons"

          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env:
              env.write(f"ADDON={slug}\n")
              env.write(f"TARGET_FOLDER={target_folder}\n")

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"addon_name={slug}\n")

          print("Base64 payload decoded and validated.")
          print(f"Slug: {slug}")
          print(f"Files: {len(normalized)}")
          PY

      - name: Check repository and existing project
        shell: bash
        run: |
          set -euo pipefail

          if [ -d "MCPEDL/$TARGET_FOLDER/$ADDON" ]; then
            echo "::error::Add-on already exists: MCPEDL/$TARGET_FOLDER/$ADDON"
            exit 1
          fi

          if [ ! -f "scripts/auto_bump_and_build.py" ]; then
            echo "::error::Missing scripts/auto_bump_and_build.py"
            exit 1
          fi

          mkdir -p "MCPEDL/$TARGET_FOLDER" 

      - name: Generate add-on files and placeholder README
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import json
          import os
          import sys

          addon = os.environ["ADDON"]
          target_folder = os.environ.get("TARGET_FOLDER", "new_addons")
          payload_path = "_incoming/decoded_addon_payload.json"
          root = os.path.join("MCPEDL", target_folder, addon)

          with open(payload_path, encoding="utf-8") as source:
              payload = json.load(source)

          if payload.get("slug") != addon:
              sys.exit("Payload slug does not match the validated add-on name.")

          files = payload.get("files")

          if not isinstance(files, dict) or not files:
              sys.exit("Payload contains no files.")

          os.makedirs(root, exist_ok=False)
          root_real = os.path.realpath(root)

          for relative_path, content in files.items():
              destination = os.path.join(root, *relative_path.split("/"))
              destination_real = os.path.realpath(destination)

              if not destination_real.startswith(root_real + os.sep):
                  sys.exit(f"Unsafe output path: {relative_path}")

              if not isinstance(content, str):
                  sys.exit(f"Invalid file content: {relative_path}")

              os.makedirs(os.path.dirname(destination), exist_ok=True)

              with open(destination, "w", encoding="utf-8", newline="\n") as output:
                  output.write(content)

                  if content and not content.endswith("\n"):
                      output.write("\n")

          readme = f"""# {addon}

          This add-on was generated by the AllensCreations add-on workflow.

          ## Documentation status

          - Full project documentation: Not yet written.
          - Logo: Not supplied.
          - Banner: Not supplied.

          ## Project files

          This project was generated from the supplied payload. Review the included manifests, behavior pack files, resource pack files, and scripts before publishing.
          """

          with open(
              os.path.join(root, "README.md"),
              "w",
              encoding="utf-8",
              newline="\n"
          ) as output:
              output.write(readme)

          print(f"Generated {len(files)} supplied files.")
          print(f"Generated placeholder README for {addon}.")
          PY

      - name: Validate manifests, UUIDs, paths, and JSON
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import json
          import os
          import sys
          import uuid

          target_folder = os.environ.get("TARGET_FOLDER", "new_addons")
          root = os.path.realpath(
              os.path.join("MCPEDL", target_folder, os.environ["ADDON"])
          )

          manifest_count = 0
          seen_uuids = set()

          for current_root, directories, filenames in os.walk(root):
              directories[:] = [
                  name for name in directories
                  if name != "__pycache__"
              ]

              for filename in filenames:
                  path = os.path.join(current_root, filename)

                  if not filename.endswith(".json"):
                      continue

                  try:
                      with open(path, encoding="utf-8") as source:
                          data = json.load(source)
                  except Exception as exc:
                      sys.exit(f"Invalid JSON file {path}: {exc}")

                  if filename != "manifest.json":
                      continue

                  manifest_count += 1

                  if not isinstance(data, dict):
                      sys.exit(f"Manifest must be a JSON object: {path}")

                  # Ensure standardized Bedrock add-on root metadata
                  if "metadata" not in data or not isinstance(data.get("metadata"), dict):
                      data["metadata"] = {}
                  data["metadata"]["authors"] = ["AllensCreations"]
                  data["metadata"]["product_type"] = "addon"
                  with open(path, "w", encoding="utf-8") as out:
                      json.dump(data, out, indent=2)
                      out.write("\n")

                  header = data.get("header")

                  if not isinstance(header, dict):
                      sys.exit(f"Missing manifest header: {path}")

                  if not isinstance(header.get("name"), str) or not header["name"].strip():
                      sys.exit(f"Missing header name: {path}")

                  def validate_uuid(value, description):
                      try:
                          parsed = str(uuid.UUID(value))
                      except (ValueError, TypeError, AttributeError):
                          sys.exit(f"Invalid {description} UUID in {path}")

                      if parsed in seen_uuids:
                          sys.exit(f"Duplicate UUID: {parsed}")

                      seen_uuids.add(parsed)

                  def validate_version(value, description):
                      if (
                          not isinstance(value, list)
                          or len(value) != 3
                          or any(type(part) is not int or part < 0 for part in value)
                      ):
                          sys.exit(f"Invalid {description} in {path}")

                  validate_uuid(header.get("uuid"), "header")
                  validate_version(header.get("version"), "header version")
                  validate_version(
                      header.get("min_engine_version"),
                      "minimum engine version"
                  )

                  modules = data.get("modules")

                  if not isinstance(modules, list) or not modules:
                      sys.exit(f"Missing manifest modules: {path}")

                  pack_root = os.path.dirname(path)

                  for module in modules:
                      if not isinstance(module, dict):
                          sys.exit(f"Invalid module in {path}")

                      validate_uuid(module.get("uuid"), "module")
                      validate_version(module.get("version"), "module version")

                      if module.get("type") == "script":
                          entry = module.get("entry")

                          if not isinstance(entry, str) or not entry:
                              sys.exit(f"Script module missing entry: {path}")

                          if "\\" in entry or entry.startswith("/"):
                              sys.exit(f"Unsafe script entry: {entry}")

                          entry_path = os.path.realpath(
                              os.path.join(pack_root, entry)
                          )

                          if not entry_path.startswith(pack_root + os.sep):
                              sys.exit(f"Unsafe script entry: {entry}")

                          if not os.path.isfile(entry_path):
                              sys.exit(f"Script entry does not exist: {entry}")

          if manifest_count == 0:
              sys.exit("No manifests found.")

          print(f"Validated {manifest_count} manifest(s).")
          print(f"Validated {len(seen_uuids)} unique UUID(s).")
          print("All JSON files are valid.")
          PY

      - name: Validate JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail

          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(
            find "MCPEDL/$TARGET_FOLDER/$ADDON" \
              -type f -name '*.js' -print0
          )

          echo "JavaScript syntax validation passed."

      - name: Build packages and register catalogs
        shell: bash
        run: |
          set -euo pipefail

          python3 scripts/auto_bump_and_build.py \
            --project "$ADDON" \
            --no-bump

      - name: Verify generated packages
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -d "builds/$ADDON" ]; then
            echo "::error::Build directory not found: builds/$ADDON"
            exit 1
          fi

          python3 - "$ADDON" <<'PY'
          import os
          import sys
          import zipfile

          addon = sys.argv[1]
          build_root = os.path.join("builds", addon)
          packages = []

          for current_root, _, filenames in os.walk(build_root):
              for filename in filenames:
                  if filename.lower().endswith(
                      (".mcpack", ".mcaddon", ".zip")
                  ):
                      packages.append(os.path.join(current_root, filename))

          if not packages:
              sys.exit("No distributable packages found.")

          for path in packages:
              if not zipfile.is_zipfile(path):
                  sys.exit(f"Invalid package archive: {path}")

              with zipfile.ZipFile(path) as archive:
                  bad_entry = archive.testzip()

                  if bad_entry:
                      sys.exit(f"Corrupt archive entry in {path}: {bad_entry}")

                  if not any(
                      name == "manifest.json"
                      or name.endswith("/manifest.json")
                      for name in archive.namelist()
                  ):
                      sys.exit(f"Package contains no manifest.json: {path}")

              print(f"Verified: {path}")

          print(f"Verified {len(packages)} package(s).")
          PY

      - name: Commit and push changes
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          branch="${GITHUB_REF_NAME}"

          if [ -z "$branch" ]; then
            echo "::error::Unable to determine target branch."
            exit 1
          fi

          # Stage all intended add-on outputs and repository catalog updates.
          git add -- "MCPEDL/$TARGET_FOLDER/$ADDON"
          git add -f -- "builds/$ADDON"

          for path in \
            README.md \
            builds/README.md \
            "MCPEDL/$TARGET_FOLDER/README.md" \
            MCPEDL/addons/README.md
          do
            if [ -f "$path" ]; then
              git add -- "$path"
            fi
          done

          # Include tracked files changed by the build script.
          git add -u

          # Exclude temporary payload data from the commit.
          git reset -q -- _incoming 2>/dev/null || true

          if ! git diff --cached --quiet; then
            git commit \
              -m "feat(addon): generate $ADDON packages [skip ci]"
          else
            echo "No staged changes to commit."
          fi

          # Remove temporary workflow data before checking repository status.
          rm -rf _incoming

          # Build scripts may leave generated or unrelated changes.
          # Stage only the intended output paths and known catalog files.
          git add -- "MCPEDL/$TARGET_FOLDER/$ADDON"
          git add -f -- "builds/$ADDON"

          for path in \
            README.md \
            builds/README.md \
            "MCPEDL/$TARGET_FOLDER/README.md" \
            MCPEDL/addons/README.md
          do
            if [ -f "$path" ]; then
              git add -- "$path"
            fi
          done

          git add -u

          if ! git diff --cached --quiet; then
            git commit \
              -m "chore(addon): include generated catalog updates [skip ci]"
          fi

          # Fail rather than silently discarding changes required for the push.
          if ! git diff --quiet || [ -n "$(git ls-files --others --exclude-standard)" ]; then
            echo "::error::Uncommitted changes remain after staging."
            git status --short
            exit 1
          fi

          for attempt in 1 2 3; do
            echo "Push attempt $attempt of 3."

            git fetch origin "$branch"

            if ! git rebase "origin/$branch"; then
              echo "::error::Rebase failed."
              git rebase --abort || true
              exit 1
            fi

            if git push origin "HEAD:refs/heads/$branch"; then
              echo "Changes pushed successfully."
              exit 0
            fi

            echo "::warning::Push attempt $attempt failed."

            if [ "$attempt" -lt 3 ]; then
              sleep 3
            fi
          done

          echo "::error::Failed to push changes after three attempts."
          exit 1

      - name: Job summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Add-on Generation Results"
            echo ""
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Slug | \`${ADDON:-Not generated}\` |"
            echo "| README | Placeholder generated |"
            echo "| Logo | Not supplied |"
            echo "| Banner | Not supplied |"
            echo ""
            echo "Review the preceding steps for validation, build, and push results."
          } >> "$GITHUB_STEP_SUMMARY"
