name: Export Repo Content to TXT

# Type the paths you want (files or folders, comma or newline separated) and get readable
# TXT you can feed to an AI. Nothing is truncated; by default everything goes into ONE file
# named after what you exported. Binary files are skipped. The downloaded zip also contains
# INSTRUCTIONS.md (a short built-in AI prompt: every update comes back as one Termux .sh
# script that does git pull, applies the change, commits and pushes).
# Save as: .github/workflows/export-repo-to-txt.yml

on:
  workflow_dispatch:
    inputs:
      paths:
        description: "Paths to export, comma-separated. Files, folders or globs. e.g. MCPEDL/addons/Grand-Banquets, scripts, .github/workflows, MCPEDL/maps/*/behavior_pack"
        required: true
        type: string
      part_size_kb:
        description: "0 = one single TXT, no limit (default). Or a number of KB to split into parts"
        required: false
        default: "0"
        type: string
      output_name:
        description: "Optional override. Leave blank to name the file after the exported path(s)"
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build TXT export
        id: build
        env:
          PATHS: ${{ inputs.paths }}
          PART_KB: ${{ inputs.part_size_kb }}
          OUT_NAME: ${{ inputs.output_name }}
        run: |
          python3 - <<'PY'
          import os, re, pathlib

          AI_PROMPT = '''# AI Instructions

          Repo: https://github.com/AllensCreations/MCPE-Curseforges.git (branch main)
          The attached TXT export shows the current files. Read it before changing anything.

          ## Destination (remembered from this export)
          Repo-root-relative folders this work belongs to:
          __DEST__
          All file paths in the .sh script start from the repo root and stay inside these folders. New files for this work go here too. Put the first folder in a `DEST=` variable at the top of the script and use it for every path and for `git add`.

          ## Rules
          1. Never invent features, versions, links, assets or test results.
          2. Give only what changed. Smallest possible edits, no unrelated rewrites.
          3. No notes, summaries or explanations unless asked.
          4. Applies to any project type: add-on, map, script, workflow, website, anything. Keep the existing folder layout. A new project goes in its own new folder next to similar ones.

          ## Every update request = ONE Termux script
          Create `update_<short-name>.sh` as a downloadable file. It must, in this order:
          1. `#!/data/data/com.termux/files/usr/bin/bash` and `set -e`
          2. `cd "$HOME/MCPE-Curseforges"`, or `git clone` the repo URL first if the folder is missing
          3. `git pull --rebase`
          4. Apply every change (code and docs) inside the script itself (heredocs for new or replaced files, inline python3 for patching many files). No separate files to download.
          5. Validate every changed .json file with python3 and stop on error
          6. `git add` only the changed paths, `git commit -m "<short message>"`, `git push`
          7. Safe to run twice (skip anything already applied)

          ## Docs (every update, inside the same script)
          After the change, analyze README.md, DESCRIPTION.md and CHANGELOG.md in the destination folder. Edit a file only if the change makes it inaccurate or incomplete; leave the rest untouched. Never remove verified content.
          - Versions: never edit manifest versions or the README version/download link; the auto-version-bump workflow does that on push. In the script, read the current version from the manifest, and write the new CHANGELOG entry and the DESCRIPTION title as the next patch version (unless a different bump is asked).
          - Writing: player-facing only. In-game display names, never identifiers, file names, JSON, events or code. Write "Behavior Pack" / "Resource Pack", never BP/RP. No code blocks, emojis, hype, badges or images (DESCRIPTION may keep existing item sprites and recipe diagrams). No Markdown tables; use `### Feature Name` cards with `- **What Happens**: ...` bullets. Paragraphs of 4 sentences at most. State only verified facts; Verification line must say source created, package built or in-game tested, never mixed.
          - README.md (add-on): download landing page only, 24 non-empty lines max:
          ```
          # [Name] (vX.Y.Z)

          Download the current release of **[Name]** for Minecraft Bedrock Edition.

          ## Download

          - **Version:** X.Y.Z
          - **Package format:** `.mcaddon`
          - **Direct download:** [Download [Name] (.mcaddon)](link)

          ## Installation

          1. Download the package using the link above.
          2. Open the downloaded file with Minecraft to import it.
          3. If the package contains a pack that must be enabled separately, activate it in your world's settings.

          ## Add-on Information

          For gameplay features, usage details, recipes, compatibility notes, and other project information, read the [full description](DESCRIPTION link).
          ```
          Maps and scripts: README is the product page (Overview or Features section, 25+ non-empty lines, achievement, experiment and verification lines).
          - DESCRIPTION.md section order: `# [Name] (vX.Y.Z) — [subtitle]`, `**By AllensCreations**`, summary, `## Overview`, `## Key Features`, `## How to Use`, `## Compatibility` (Minecraft Bedrock Edition, Experimental features, Achievements, Verification), `## Creator and Permissions` (CurseForge profile https://www.curseforge.com/members/allenscreations/projects and MCPEDL profile https://mcpedl.com/user/allenscreations/), `## Guidelines and Attribution`, then `---` and `## Search & Discovery Keywords` built from real features.
          - Guidelines and Attribution block, exactly:
          ```
          - Creator: AllensCreations
          - Rights & Reservation: All rights reserved for AllensCreations.
          - Content Creators: Content creators are permitted to feature this creation in videos and streams with credit to AllensCreations.
          - Redistribution: Do not re-upload this pack or provide direct monetized download bypasses. Link directly to the official repository page.
          - Disclaimer: This is an unofficial community creation. It is not an official Minecraft product and is not approved by or associated with Mojang or Microsoft.

          ---

          © All rights reserved for AllensCreations.
          ```
          - CHANGELOG.md: `# Changelog — [Name]`, `---`, then newest release first as `## [X.Y.Z] - YYYY-MM-DD` (script uses today's date), grouped under `### Added`, `### Improved & Balanced`, `### Fixed` (bugs described by in-game experience). Entries are `- **Title**: player impact.` No links, URLs, badges, function or event names, or unverified benefits. No boilerplate after the title.

          ## Reply format
          1. The .sh file
          2. These steps, exactly:

          First time only:
          ```
          pkg update -y && pkg install -y git python
          termux-setup-storage
          git config --global user.name "AllensCreations"
          git config --global user.email "your-email@example.com"
          git config --global credential.helper store
          ```
          Every update:
          ```
          bash ~/storage/downloads/update_<short-name>.sh
          ```
          Download the .sh to your Downloads folder first. At the push prompt, the password is your GitHub Personal Access Token (repo scope), not your account password.
          '''

          raw_paths = [p.strip().strip("'\"") for p in re.split(r"[,\n]", os.environ["PATHS"]) if p.strip()]
          try:
              part_kb = int(os.environ.get("PART_KB", "0") or "0")
          except ValueError:
              part_kb = 0
          part_bytes = part_kb * 1024 if part_kb > 0 else 0   # 0 = unlimited, one file

          def safe(x):
              return re.sub(r"[^A-Za-z0-9._-]+", "_", x).strip("_.")

          def auto_label():
              names = []
              for e in raw_paths:
                  last = [c for c in pathlib.PurePosixPath(e.rstrip("/")).parts if c not in (".", "")]
                  n = safe(last[-1]) if last else ""
                  if n and n not in names:
                      names.append(n)
              if not names:
                  return "export"
              label = "+".join(names[:3]) + ("+more" if len(names) > 3 else "")
              return label[:80]

          label = safe(os.environ.get("OUT_NAME", "")) or auto_label() or "export"

          root = pathlib.Path(".").resolve()
          SKIP_DIRS = {".git", "db", "node_modules", "__pycache__", "exports"}
          selected, skipped, missing = {}, [], []
          dests = []

          def is_text(p: pathlib.Path) -> bool:
              try:
                  head = p.read_bytes()[:8192]
              except OSError:
                  return False
              if b"\x00" in head:
                  return False
              try:
                  head.decode("utf-8")
              except UnicodeDecodeError as e:
                  # a multi-byte char cut at the 8 KB boundary is fine
                  return e.start >= len(head) - 4
              return True

          def add(p: pathlib.Path):
              try:
                  rel = p.resolve().relative_to(root)
              except ValueError:
                  return  # outside the repo
              if any(part in SKIP_DIRS for part in rel.parts):
                  return
              if not p.is_file():
                  return
              if is_text(p):
                  selected[rel.as_posix()] = p
              else:
                  skipped.append(rel.as_posix())

          for entry in raw_paths:
              if ".." in pathlib.PurePosixPath(entry).parts or entry.startswith("/"):
                  missing.append(entry + "  (not allowed: must be inside the repo)")
                  continue
              matches = sorted(root.glob(entry))
              if not matches:
                  missing.append(entry)
                  continue
              for m in matches:
                  try:
                      d = (m if m.is_dir() else m.parent).relative_to(root).as_posix() or "."
                      if d not in dests:
                          dests.append(d)
                  except ValueError:
                      pass
                  if m.is_dir():
                      for f in sorted(m.rglob("*")):
                          add(f)
                  else:
                      add(m)

          files = sorted(selected, key=str.lower)
          if missing:
              for m in missing:
                  print(f"::warning::Path not found or not allowed: {m}")
          if not files:
              raise SystemExit("::error::Nothing matched. Check the paths (case-sensitive, relative to the repo root).")

          blocks = []
          for rel in files:
              data = selected[rel].read_bytes().decode("utf-8", errors="replace")
              head = f"===== FILE: {rel} ({data.count(chr(10)) + 1} lines, {len(data.encode('utf-8'))} bytes) ====="
              blocks.append((rel, f"\n{head}\n{data}\n===== END FILE: {rel} =====\n"))

          parts, cur, size = [], [], 0
          for rel, block in blocks:
              b = len(block.encode("utf-8"))
              if part_bytes and cur and size + b > part_bytes:
                  parts.append(cur); cur, size = [], 0
              cur.append((rel, block)); size += b
          if cur:
              parts.append(cur)

          out = pathlib.Path("exports"); out.mkdir(exist_ok=True)
          index = ["EXPORT REQUEST: " + ", ".join(raw_paths),
                   "DESTINATION: " + ", ".join(dests),
                   f"Text files: {len(files)}   Parts: {len(parts)}   Skipped binary: {len(skipped)}   Paths not found: {len(missing)}", ""]
          for i, part in enumerate(parts, 1):
              name = f"{label}.txt" if len(parts) == 1 else f"{label}_part{i:02d}_of_{len(parts):02d}.txt"
              head = f"PART {i} OF {len(parts)} | files in this part: {len(part)}\nCONTENTS OF THIS PART:\n" + "".join(f"- {r}\n" for r, _ in part)
              (out / name).write_text(head + "".join(b for _, b in part), encoding="utf-8")
              total = (out / name).stat().st_size
              index.append(f"{name}  ({len(part)} files, {total} bytes)")
              index.extend(f"    {r}" for r, _ in part)
          if missing:
              index += ["", "NOT FOUND:"] + [f"    {m}" for m in missing]
          if skipped:
              index += ["", "SKIPPED (binary):"] + [f"    {s}" for s in skipped[:1000]]
          (out / "INSTRUCTIONS.md").write_text(AI_PROMPT.replace("__DEST__", "\n".join("- " + d for d in dests) or "- .") + "\n", encoding="utf-8")
          index += ["", "ALSO INCLUDED: INSTRUCTIONS.md (AI update prompt: one Termux .sh script per update)"]
          (out / "INDEX.txt").write_text("\n".join(index) + "\n", encoding="utf-8")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write(f"label={label}\n")
          print(f"Exported {len(files)} files into {len(parts)} part(s); skipped {len(skipped)} binary; {len(missing)} path(s) not found.")
          PY

      - name: Summary
        if: ${{ always() }}
        env:
          PATHS_IN: ${{ inputs.paths }}
          LABEL: ${{ steps.build.outputs.label }}
        run: |
          {
            echo "### Export Repo Content to TXT"
            echo "- Paths: \`${PATHS_IN}\`"
            echo "- Download the **${LABEL}** artifact below (zip). It contains the TXT export, INDEX.txt and INSTRUCTIONS.md."
            [ -d exports ] && ls -la exports | sed 's/^/    /'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload export
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.build.outputs.label }}
          path: exports/
          if-no-files-found: error
          retention-days: 14
