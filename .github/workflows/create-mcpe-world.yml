name: "Create MCPE World from Level Data"

on:
  workflow_dispatch:
    inputs:
      world_name:
        description: "Name of the MCPE World (e.g. My OneBlock World)"
        required: true
        default: "OneBlock Survival World"
        type: string
      publish_to_repo:
        description: "Commit and publish the .mcworld into builds/ folder in the repository"
        required: false
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: create-mcpe-world-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-world:
    name: "Build .mcworld"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Generate MCPE World Archive
        id: generate
        shell: bash
        run: |
          set -euo pipefail
          WORLD_NAME="${{ inputs.world_name }}"
          SAFE_NAME=$(python3 -c "import re; print(re.sub(r'[\\\\/*?:\"<>|]', '', '''$WORLD_NAME''').strip() or 'MCPE_World')")
          OUTPUT_DIR="builds/${SAFE_NAME}"

          echo "SAFE_NAME=${SAFE_NAME}" >> "$GITHUB_ENV"
          echo "OUTPUT_DIR=${OUTPUT_DIR}" >> "$GITHUB_ENV"

          python3 scripts/create_mcpe_world.py --name "${WORLD_NAME}" --output-dir "${OUTPUT_DIR}"

      - name: Upload .mcworld Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.SAFE_NAME }}-mcworld
          path: "${{ env.OUTPUT_DIR }}/*.mcworld"
          retention-days: 90

      - name: Commit and Push to Repository
        if: ${{ inputs.publish_to_repo }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add "${{ env.OUTPUT_DIR }}/*.mcworld"
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "feat(world): generate MCPE world '${{ inputs.world_name }}' [skip ci]"
            git push origin HEAD:${{ github.ref }}
            echo "Successfully published ${{ env.SAFE_NAME }}.mcworld to repository!"
          fi
