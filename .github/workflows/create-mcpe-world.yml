name: "Create MCPE World from OneBlock Template"

# Role (INSTRUCTIONS.md Section 8): creates and persists the extracted OneBlock
# world template for future builds. Output is a database-free void world.
# Structural checks only: this workflow never proves the world loads in Minecraft.

on:
  workflow_dispatch:
    inputs:
      world_name:
        description: "Name of the MCPE World (e.g. My OneBlock World)"
        required: true
        default: "OneBlock Survival World"
        type: string
      publish_to_repo:
        description: "Commit and publish the .mcworld into builds/ in the repository"
        required: false
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: create-mcpe-world-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-world:
    name: "Build .mcworld"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Verify required sources exist
        shell: bash
        run: |
          set -euo pipefail
          test -f scripts/create_mcpe_world.py \
            || { echo "::error::Missing scripts/create_mcpe_world.py"; exit 1; }
          # Mcpeworlds/ is the only source of world foundations (Section 7).
          for mode in Creative Survival Hardcore; do
            test -d "Mcpeworlds/${mode}" \
              || { echo "::error::Missing foundation folder Mcpeworlds/${mode}"; exit 1; }
            test -f "Mcpeworlds/${mode}/level.dat" \
              || { echo "::error::Missing valid level.dat in Mcpeworlds/${mode}"; exit 1; }
          done

      - name: Generate complete MCPE World Archive
        id: generate
        shell: bash
        env:
          WORLD_NAME: ${{ inputs.world_name }}
        run: |
          set -euo pipefail
          SAFE_NAME="$(python3 - <<'PY'
          import os, re
          name = os.environ["WORLD_NAME"]
          name = re.sub(r'[\\/*?:"<>|]', "", name).strip().rstrip(".")
          print(name or "MCPE_World")
          PY
          )"
          OUTPUT_DIR="builds/${SAFE_NAME}"

          echo "SAFE_NAME=${SAFE_NAME}" >> "$GITHUB_ENV"
          echo "OUTPUT_DIR=${OUTPUT_DIR}" >> "$GITHUB_ENV"

          python3 scripts/create_mcpe_world.py --name "$WORLD_NAME" --output-dir "$OUTPUT_DIR"

      - name: Confirm source foundations were not modified
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$(git status --porcelain -- Mcpeworlds/)" ]; then
            echo "::error::Mcpeworlds/ was modified. Source foundations must stay untouched; only the staged copy may change."
            git status --porcelain -- Mcpeworlds/
            exit 1
          fi

      - name: Validate archive structure (database-free void world)
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import glob, json, os, sys, zipfile

          out = os.environ["OUTPUT_DIR"]
          archives = glob.glob(f"{out}/*.mcworld")
          if not archives:
              sys.exit(f"::error::No .mcworld produced in {out}")

          errors = []
          for path in archives:
              if not zipfile.is_zipfile(path):
                  errors.append(f"{path}: not a valid ZIP archive")
                  continue
              with zipfile.ZipFile(path) as z:
                  bad = z.testzip()
                  if bad:
                      errors.append(f"{path}: corrupt entry {bad}")
                  names = z.namelist()

                  if not any(n == "level.dat" or n.endswith("/level.dat") for n in names):
                      errors.append(f"{path}: missing level.dat")

                  # Intentional database-free design: no LevelDB data at all.
                  db = [n for n in names
                        if n.startswith("db/") or "/db/" in n
                        or n.endswith("db/CURRENT")]
                  if db:
                      errors.append(f"{path}: contains database files (must be absent): {db[:5]}")

                  # Pack link files must be valid JSON with pack_id + version.
                  for link in ("world_behavior_packs.json", "world_resource_packs.json"):
                      for n in (x for x in names if x == link or x.endswith("/" + link)):
                          try:
                              entries = json.loads(z.read(n))
                          except Exception as e:
                              errors.append(f"{path}: {n} is not valid JSON ({e})")
                              continue
                          for e in entries:
                              if "pack_id" not in e or "version" not in e:
                                  errors.append(f"{path}: {n} entry missing pack_id/version: {e}")
                              else:
                                  prefix = n[: -len(link)]
                                  folder = "behavior_packs/" if "behavior" in link else "resource_packs/"
                                  has_manifest = any(
                                      x.startswith(prefix + folder) and x.endswith("/manifest.json")
                                      for x in names
                                  )
                                  if not has_manifest:
                                      errors.append(f"{path}: {n} references a pack but no {folder} manifest exists")
              print(f"Checked: {path}")

          if errors:
              for e in errors:
                  print(f"::error::{e}")
              sys.exit(1)
          print("Structural validation passed (archive, level.dat, no database, pack links).")
          PY

      - name: Upload .mcworld Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.SAFE_NAME }}-mcworld
          path: "${{ env.OUTPUT_DIR }}/*.mcworld"
          if-no-files-found: error
          retention-days: 90

      - name: Commit and Push to Repository
        if: ${{ inputs.publish_to_repo }}
        shell: bash
        env:
          WORLD_NAME: ${{ inputs.world_name }}
          TARGET_REF: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Persist the extracted source template on the first successful build.
          # Later runs reuse it instead of extracting the archive again.
          if [ -d assets/oneblock-template ]; then
            git add assets/oneblock-template/
          fi
          git add "${OUTPUT_DIR}"/*.mcworld

          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "feat(world): generate MCPE world '${WORLD_NAME}' [skip ci]"
            git pull --rebase origin "${TARGET_REF}"
            git push origin "HEAD:${TARGET_REF}"
            echo "Published ${SAFE_NAME}.mcworld to ${OUTPUT_DIR}/"
          fi

      - name: Summary
        if: ${{ always() }}
        shell: bash
        run: |
          {
            echo "### Create MCPE World"
            echo "- World: \`${{ inputs.world_name }}\`"
            echo "- Output: \`${OUTPUT_DIR:-n/a}\`"
            echo "- Verified: archive structure, level.dat, no \`db/\` data, pack link JSON (structural only)"
            echo "- **Not verified:** Minecraft loading the world or gameplay. Test in the Creative world in-game."
          } >> "$GITHUB_STEP_SUMMARY"
