name: Build Test World

# Rebuilds "<Name> - Test.mcworld" for scripts and add-ons that have test_world.json.

on:
  workflow_dispatch:
    inputs:
      project:
        description: "Project folder, e.g. MCPEDL/script/My-Script. Leave blank to rebuild every project with a test_world.json."
        required: false
        default: ""
        type: string

permissions:
  contents: write

concurrency:
  group: build-test-world-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PROJECT: ${{ inputs.project }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      - name: Build test world(s)
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$PROJECT" ]; then
            [[ "$PROJECT" =~ ^MCPEDL/(script|new_addons|addons)/[A-Za-z0-9][A-Za-z0-9._-]{0,63}$ ]] \
              || { echo "::error::project must look like MCPEDL/script/<Name>"; exit 1; }
            python scripts/build_test_world.py --project "$PROJECT"
          else
            python scripts/build_test_world.py --all
          fi

      - name: Upload test worlds
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-worlds
          path: MCPEDL/**/* - Test.mcworld
          if-no-files-found: warn
          retention-days: 30

      - name: Commit test worlds
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A -- MCPEDL
          if git diff --cached --quiet; then
            echo "No changes to commit."; exit 0
          fi
          git commit -m "chore(test-world): rebuild test worlds [skip ci]"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
