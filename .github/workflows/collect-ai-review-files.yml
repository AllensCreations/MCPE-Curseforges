name: Collect Files for AI Review

# ONE workflow for everything you hand to an AI (replaces "Export Repo Content to MD").
#   Leave "paths" empty : the standard review bundle (scripts, workflows, instruction files, icon
#                         hashes, ALL_TEXT_FILES.txt). Download name: ai-review-bundle.zip
#   Type paths          : files, folders or globs, comma or newline separated
#                         (e.g. MCPEDL/Addons/Grand-Banquets, scripts, MCPEDL/Maps/*/behavior_pack).
#                         You get ONE <filename>.b64 file (base64 of a Markdown export: index, AI instructions,
#                         every text file, nothing truncated; decode with base64 -d) inside a zip named after the first folder with its
#                         latest changelog version:  (X.Y.Z) Filename.zip
#                         The built-in AI prompt keeps the Termux .sh rules: (Repofilename)_(Version)_(Rand).sh,
#                         CHANGELOG.md updated on every change with the X.Y.Z-only policy.
#                         Replies use ONLY: File Needed, Changelog, Termux Script.
# GitHub cannot push a download to your device by itself: open the run summary and tap the link.
#
# CHANGELOG VIEWS (merged from the old "Build Changelog Views" workflow)
#   Every run rebuilds changelog_views/ from each CHANGELOG.md with scripts/build_changelog_views.py
#   and puts it in the download. The AI instructions below explain the views to the AI.
#   Tick "commit_changelog_views" to also save the refreshed views to the repo (needs write access).
# PACK CREATOR KIT (toggle "pack_creator_kit")
#   Tick it to download pack-creator-kit.zip instead: START_HERE.md (what an AI agent must do to CREATE
#   a new pack or UPDATE an existing one), PACK_GENERATOR_INSTRUCTIONS.md, INSTRUCTIONS.md and the helper
#   files (payload builder, recipe image maker, crafting template, icon maker, listing images, mandatory
#   assets). To update an existing pack, also type its folder in "kit_project" (e.g. MCPEDL/Addons/Mining-Helmet)
#   and its current source files are added under existing_project/. The paths field is ignored in kit mode.
# Save as: .github/workflows/collect-ai-review-files.yml

on:
  workflow_dispatch:
    inputs:
      paths:
        description: "Leave empty for the standard review bundle. Or paths to export, comma-separated: files, folders or globs, e.g. MCPEDL/Addons/Grand-Banquets, scripts, .github/workflows"
        required: false
        default: ""
        type: string
      pack_creator_kit:
        description: "Build the Pack Creator Kit zip (AI instructions + helper files to create or update a pack). Ignores paths."
        required: false
        default: false
        type: boolean
      kit_project:
        description: "[kit] Only to UPDATE a pack: its folder, e.g. MCPEDL/Addons/Mining-Helmet. Empty = kit for a NEW pack."
        required: false
        default: ""
        type: string
      commit_changelog_views:
        description: "Also commit the refreshed changelog_views/ folder to the repo"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'

      - name: Build changelog views (folded GitHub + CurseForge copies of every CHANGELOG.md)
        run: python3 scripts/build_changelog_views.py --all

      - name: Choose mode
        id: mode
        env:
          PATHS: ${{ inputs.paths }}
          KIT: ${{ inputs.pack_creator_kit }}
        run: |
          if [ "$KIT" = "true" ]; then
            echo "kit=true" >> "$GITHUB_OUTPUT"
            echo "default=false" >> "$GITHUB_OUTPUT"
            echo "artifact_name=pack-creator-kit" >> "$GITHUB_OUTPUT"
          elif [ -z "$(echo "$PATHS" | tr -d '[:space:],')" ]; then
            echo "default=true" >> "$GITHUB_OUTPUT"
            echo "artifact_name=ai-review-bundle" >> "$GITHUB_OUTPUT"
          else
            echo "default=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build pack creator kit
        if: steps.mode.outputs.kit == 'true'
        env:
          KIT_PROJECT: ${{ inputs.kit_project }}
        run: |
          set -euo pipefail
          OUT=ai_review_bundle
          mkdir -p "$OUT/tools" "$OUT/assets"
          : > "$OUT/manifest.txt"
          take() { # take <src> <dest>
            if [ -e "$1" ]; then mkdir -p "$(dirname "$2")"; cp -r "$1" "$2"; echo "OK      $1" >> "$OUT/manifest.txt"
            else echo "MISSING $1" >> "$OUT/manifest.txt"; fi
          }
          take PACK_GENERATOR_INSTRUCTIONS.md "$OUT/PACK_GENERATOR_INSTRUCTIONS.md"
          take INSTRUCTIONS.md "$OUT/INSTRUCTIONS.md"
          for f in build_payload.py import_project_payload.py crafting_template.py generate_recipe_images.py \
                   convert_crafting_recipe_svgs_to_png.py ensure_recipe_unlocks.py make_pack_icon.py \
                   optimize_images.py manifest_tools.py doc_template.py build_test_world.py \
                   CRAFTING_TABLE.png CRAFTING_TABLE.svg; do
            take "scripts/$f" "$OUT/tools/$f"
          done
          take assets/Images "$OUT/assets/Images"
          take assets/cheatstick-ui "$OUT/assets/cheatstick-ui"
          if [ -d Mcpeworlds/assets ]; then
            while IFS= read -r f; do take "$f" "$OUT/$f"; done < <(find Mcpeworlds/assets -type f -size -2M | sort)
          fi

          MODE="CREATE a NEW pack"
          if [ -n "$(echo "$KIT_PROJECT" | tr -d '[:space:]')" ]; then
            P="${KIT_PROJECT%/}"
            case "$P" in *..*|/*) echo "::error::kit_project must be a repo folder such as MCPEDL/Addons/Mining-Helmet"; exit 1;; esac
            [ -d "$P" ] || { echo "::error::kit_project folder not found: $P"; exit 1; }
            while IFS= read -r f; do take "$f" "$OUT/existing_project/$f"; done < <(find "$P" -type f -size -2M \
              ! -name '*.mcpack' ! -name '*.mcaddon' ! -name '*.mcworld' ! -name '*.zip' | sort)
            VIEW="changelog_views/$(basename "$P")"
            take "$VIEW.github.md" "$OUT/existing_project/$VIEW.github.md"
            MODE="UPDATE the existing pack in $P"
          fi

          cat > "$OUT/START_HERE.md" <<'MD'
          # Pack Creator Kit: START HERE (AI agent)

          Task: __MODE__.

          ## Read in this order
          1. `PACK_GENERATOR_INSTRUCTIONS.md`: the rules for building a pack. Follow it exactly.
          2. `INSTRUCTIONS.md`: maintenance rules. It wins on any conflict.
          3. `existing_project/` (only present for an UPDATE): the current source of the pack. Inspect it before changing anything.

          ## What is in this kit
          - `tools/build_payload.py`: installs the mandatory repo assets that are missing, runs every structural check, builds the ZIP and writes the one-line `payload.b64`.
          - `tools/import_project_payload.py`: the checks the repo runs when the payload is imported (same checks as above).
          - `tools/crafting_template.py`, `generate_recipe_images.py`, `convert_crafting_recipe_svgs_to_png.py`, `CRAFTING_TABLE.png/.svg`: recipe images.
          - `tools/ensure_recipe_unlocks.py`, `manifest_tools.py`, `doc_template.py`, `make_pack_icon.py`, `optimize_images.py`, `build_test_world.py`: recipe unlocks, manifests, docs, icon, image size, test world.
          - `assets/Images/` and the mandatory pack assets under `Mcpeworlds/assets/`.
          - `assets/cheatstick-ui/`: the Cheatstick UI components (textures, `design.json`, `README.txt`, `preview_reference.png`). Use them as the reference for any menu or UI you build: copy `textures/ui/cheatstick/` into the Resource Pack, follow the sizes, colors and layout in `design.json`, and match `preview_reference.png`. Do not invent a different style.

          ## CREATE a new pack
          1. Ask ONE line only if the request is unclear (type: addon, map, script or minigame). Otherwise proceed.
          2. Build the project in `build/<Project-Name>/` with a `project.json`: `{"type": "addon|map|script|minigame", "name": "Display Name"}`.
          3. Run `python tools/build_payload.py build/<Project-Name>`. Fix every reported error. Exit code 0 means the structural checks passed. It never proves the pack works in Minecraft.
          4. Deliver `payload.b64` (one line of base64).

          ## UPDATE an existing pack
          1. Start from `existing_project/`. Change only what was requested. Smallest edits.
          2. Keep pack and module UUIDs unchanged. Raise the version: an update is Z+1 (1.2.4 -> 1.2.5). Beta (Y+1) or Release (X+1) only if the user asks.
          3. Add the new CHANGELOG.md entry for the new version, as the instruction files require.
          4. Run `python tools/build_payload.py` on the updated project folder and deliver `payload.b64`.

          ## How the user imports the result
          - GitHub, workflow **Create Project from Base64**: paste the base64 into `payload_base64`, or commit `payload.b64` to `MCPEDL/incoming/` and type its name in `payload_file` (the extension is optional).
          - `import_mode`: `create` for a new pack, `update` for an existing pack, `auto` to let the workflow decide.
          - Then **Build Changed Packs & Sync Catalogs** builds the packages.

          ## Never
          - Invent features, versions, links, assets or test results.
          - Claim anything was tested in Minecraft unless it was.
          - Hand-edit manifest versions or README download links beyond what the instruction files allow.
          MD
          python3 - <<PY
          import pathlib
          p = pathlib.Path("$OUT/START_HERE.md")
          p.write_text(p.read_text().replace("__MODE__", """$MODE"""))
          PY
          echo "Kit: $MODE"; cat "$OUT/manifest.txt"

      - name: Build path export (index, AI instructions and file contents in one MD)
        if: steps.mode.outputs.default == 'false' && steps.mode.outputs.kit != 'true'
        id: build
        env:
          PATHS: ${{ inputs.paths }}
        run: |
          python3 - <<'PY'
          import os, re, pathlib

          AI_PROMPT = r'''# AI Instructions

          Repo: https://github.com/AllensCreations/MCPE-Curseforges.git (branch main)
          Export: .b64 file. Decode: `base64 -d <name>.b64 > <name>.md`. Read it before changing anything.

          ## Destination
          Repo-root-relative folders for this work:
          __DEST__
          - .sh paths start at repo root, stay inside these folders. New files go here too.
          - First folder -> `DEST=` variable at script top. Use it for every path and `git add`.

          ## Rules
          1. NEVER invent features, versions, links, assets, test results.
          2. Output only what changed. Smallest edits. No unrelated rewrites.
          3. No notes/summaries/explanations unless asked.
          4. Any project type (add-on, map, script, workflow, website). Keep folder layout. New project = own new folder beside similar ones.

          ## Update request = ONE Termux script
          - Name: `<Repofilename>_<Version>_<RAND>.sh` (e.g. `Monster-Companions_1.2.4_k7q2x.sh`). Deliver as downloadable file.
          - Repofilename: project/folder/file changed. No extension, no spaces (hyphens ok).
          - Version: new X.Y.Z. Update = Z+1. Beta/Release only if requested (see Versions).
          - RAND: >=5 random lowercase letters/digits. Fresh every script. NEVER reuse (earlier reply or existing file), so a new script never overwrites or re-runs an old one.
          - Same exact name in reply steps.
          Script order:
          1. `#!/data/data/com.termux/files/usr/bin/bash` + `set -e`
          2. `cd "$HOME/MCPE-Curseforges"`; `git clone` repo URL first if folder missing
          3. `git pull --rebase`
          4. Apply ALL changes (code + docs) inside the script: heredocs for new/replaced files, inline python3 to patch many files. No separate downloads.
          5. Validate every changed .json with python3. Stop on error.
          5b. Verify top CHANGELOG.md heading == new X.Y.Z == script filename version. Stop on mismatch. If project has manifests: check each source manifest `metadata.version` is X.Y.Z (build rewrites it after push; NEVER edit in script).
          5c. If INSTRUCTIONS.md or PACK_GENERATOR_INSTRUCTIONS.md changed: run `python3 scripts/check_instruction_files.py`. Stop on error
          6. `git add` changed paths only; `git commit -m "<short message>"`; `git push`
          7. After push, start Build Changed Packs & Sync Catalogs. Only when `DEST` starts with `MCPEDL/`. NEVER stop the script on failure (`|| echo` warning). Use exactly:
          ```
          TOKEN=$(printf 'protocol=https\nhost=github.com\n\n' | git credential fill | sed -n 's/^password=//p')
          curl -fsS -X POST -H "Authorization: Bearer $TOKEN" -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/AllensCreations/MCPE-Curseforges/actions/workflows/auto-version-bump.yml/dispatches \
            -d "{\"ref\":\"main\",\"inputs\":{\"task\":\"build\",\"scope\":\"one project (pick it below)\",\"other\":\"$DEST\"}}" \
            && echo "Build Changed Packs & Sync Catalogs started for $DEST" \
            || echo "Could not start the build; run Build Changed Packs & Sync Catalogs manually."
          ```
             `$DEST` = project folder itself (e.g. `MCPEDL/Addons/Mining-Helmet`). Push may also trigger the same workflow; runs queue, second changes nothing.
          8. Idempotent: skip anything already applied.

          ## Docs (every update, same script)
          - Templates STRICT: README.md, DESCRIPTION.md, CHANGELOG.md match templates below exactly: same headings, text, order, labels, bullet format. NEVER add/remove/rename/merge/reorder sections. No boilerplate/extra text. No placeholders: fill every [bracket] with verified content. Accuracy + requested scope outrank template.
          - CHANGELOG.md: MANDATORY every update, no exceptions. Add new release entry for the change.
          - README.md + DESCRIPTION.md: after change, analyze both in destination folder. Edit ONLY if change makes them inaccurate/incomplete. NEVER remove verified content.

          ### Versions (X.Y.Z ONLY)
          - Format: exactly X.Y.Z everywhere. NEVER X.Y.Z.A. No fourth part. No Alpha.
          - X = Release, Y = Beta, Z = Update.
          - Update: Z+1 (1.2.3 -> 1.2.4). Default.
          - Beta: Y+1, Z=0 (1.2.4 -> 1.3.0). Only if requested.
          - Release: X+1, Y=0, Z=0 (1.3.0 -> 2.0.0). Only if requested.
          - New X.Y.Z goes in CHANGELOG heading + script filename.
          - NEVER hand-edit manifest versions or README download links. Build Changed Packs & Sync Catalogs aligns header.version, metadata.version, module/dependency versions, titles, packages, snapshots.
          - NEVER put release version in README/DESCRIPTION titles. NEVER reuse a heading.

          ### Changelog views
          - `changelog_views/<Name>.github.md` (newest open, older folded by minor series) and `changelog_views/<Name>.curseforge.html` (CurseForge spoilers, paste into project description): generated from CHANGELOG.md by `scripts/build_changelog_views.py`.
          - CHANGELOG.md = plain text, exact template format, only source of truth. NEVER add HTML/fold markup/links to it. NEVER edit views by hand. NEVER create/change views inside the .sh.
          - Refresh: Build Changed Packs & Sync Catalogs; Collect Files for AI Review (tick commit_changelog_views to save); or `python3 scripts/build_changelog_views.py --project <Name>`.

          ### Writing
          - Player-facing only. In-game display names, never identifiers, file names, JSON, events, code.
          - "Behavior Pack" / "Resource Pack", NEVER BP/RP.
          - README: no code blocks, emojis, hype, badges.
          - DESCRIPTION: exactly the two Minecraft Bedrock + Format badges from repo template, no others. May keep existing item sprites + recipe diagrams.
          - No Markdown tables. Use `### Feature Name` cards with `- **What Happens**: ...` bullets.
          - Paragraphs <=4 sentences. Verified facts only. Verification line = source created | package built | in-game tested, NEVER mixed.

          ### README.md (add-on): download landing page only, EXACTLY 11 non-empty lines
          ```
          # [Name]

          Download the current release of **[Name]** for Minecraft Bedrock Edition.

          ## Download

          - **Package format:** `.mcaddon`
          - **Direct download:** [Download [Name] (.mcaddon)](link)

          ## Installation

          1. Download the package using the link above.
          2. Open the downloaded file with Minecraft to import it.
          3. If the package contains a pack that must be enabled separately, activate it in your world's settings.

          ## Pack Information

          For gameplay features, usage details, compatibility notes, and other project information, read the [full description](DESCRIPTION link).
          ```
          Maps/scripts/minigames: same landing page. Use real package format; .mcworld = tell players to open the imported world. Product details live in DESCRIPTION.md.

          ### DESCRIPTION.md order
          1. `# [Name] — [subtitle]` (no release version)
          2. `**By ALNStudios**`
          3. Two exact badges (Minecraft Bedrock "Stable Release", Format) from repo template
          4. Summary
          5. `## Overview`
          6. `## Key Features`
          7. `## How to Use`
          8. `## Compatibility`: Minecraft Bedrock Edition, Experimental features, Achievements, Verification
          9. `## Creator and Permissions`: `- Creator: ALNStudios`, `- Profiles:` CurseForge https://www.curseforge.com/members/allenscreations/projects · MCPEDL https://mcpedl.com/user/alnstudios/, then the two clickable listing images (HTML, `width="45%"`, no `height`, raw URLs `assets/Images/curseforge.jpg`, `assets/Images/MCPEDL.jpg`). NEVER edit/copy the images
          10. `## Guidelines and Attribution`
          11. `---` then `## Search & Discovery Keywords` from real features
          - Add-ons: Achievements line ALWAYS `Likely achievement-friendly`; add caveats if world settings/cheats can disable achievements.

          ### Guidelines and Attribution block, exactly
          ```
          - Creator: ALNStudios
          - Rights & Reservation: All rights reserved for ALNStudios.
          - Content Creators: Content creators are permitted to feature this creation in videos and streams with credit to ALNStudios.
          - Redistribution: Do not re-upload this pack or provide direct monetized download bypasses. Link directly to the official repository page.
          - Disclaimer: This is an unofficial community creation. It is not an official Minecraft product and is not approved by or associated with Mojang or Microsoft.

          ---

          © All rights reserved for ALNStudios.

          ---
          ```

          ### CHANGELOG.md
          - `# Changelog — [Name]`, `---`, then newest first: `## [X.Y.Z] - YYYY-MM-DD` (date: `TZ=Asia/Singapore date +%F`).
          - Groups: `### Added`, `### Improved & Balanced`, `### Fixed` (bugs as in-game experience). Omit empty groups. Each group >=1 bullet.
          - Entry: `- **Title**: player impact.`
          - NO links, URLs, badges, function/event names, unverified benefits. No boilerplate after title.
          - Insert new entry directly under `---`, above previous release. NEVER edit/delete older entries.

          ## Reply Format (STRICT)
          ```
          [SYSTEM_CONFIG]
          Mode: Direct Execution
          Token_Efficiency: Maximum
          Rules: no greeting, intro, outro, offers, restating. High technical accuracy.
          ```
          Output ONLY these three sections, in order, exact headings:
          1. **File Needed:** repo-root-relative path of each file created/edited.
          2. **Changelog:** bullets, brief summary of changes.
          3. **Termux Script:** ONE fenced `bash` block holding the run command: `bash ~/storage/downloads/<Repofilename>_<Version>_<RAND>.sh`
          - The .sh (`<Repofilename>_<Version>_<RAND>.sh`, random chars included) is the downloadable file. Exact same name in the command.
          - NEVER text before, between, after. NEVER rename/merge/reorder/skip a section. Nothing to report: `- None`.
          - Unclear request: ask ONE line, then proceed with defaults.
          - First-time Termux setup, ONLY if the user asks:
          ```
          pkg update -y && pkg install -y git python curl
          termux-setup-storage
          git config --global user.name "ALNStudios"
          git config --global user.email "your-email@example.com"
          git config --global credential.helper store
          ```
          - Push password = GitHub Personal Access Token (repo + workflow scopes), NOT account password. Same token starts the build after push.
          '''

          raw_paths = [p.strip().strip("'\"") for p in re.split(r"[,\n]", os.environ["PATHS"]) if p.strip()]

          def safe(x):
              return re.sub(r"[^A-Za-z0-9._-]+", "_", x).strip("_.")

          def auto_label():
              names = []
              for e in raw_paths:
                  last = [c for c in pathlib.PurePosixPath(e.rstrip("/")).parts if c not in (".", "")]
                  n = safe(last[-1]) if last else ""
                  if n and n not in names:
                      names.append(n)
              if not names:
                  return "export"
              label = "+".join(names[:3]) + ("+more" if len(names) > 3 else "")
              return label[:80]

          label = auto_label() or "export"

          root = pathlib.Path(".").resolve()
          SKIP_DIRS = {".git", "db", "node_modules", "__pycache__", "exports"}
          selected, skipped, missing = {}, [], []
          dests = []

          def is_text(p: pathlib.Path) -> bool:
              try:
                  head = p.read_bytes()[:8192]
              except OSError:
                  return False
              if b"\x00" in head:
                  return False
              try:
                  head.decode("utf-8")
              except UnicodeDecodeError as e:
                  # a multi-byte char cut at the 8 KB boundary is fine
                  return e.start >= len(head) - 4
              return True

          def add(p: pathlib.Path):
              try:
                  rel = p.resolve().relative_to(root)
              except ValueError:
                  return  # outside the repo
              if any(part in SKIP_DIRS for part in rel.parts):
                  return
              if not p.is_file():
                  return
              if is_text(p):
                  selected[rel.as_posix()] = p
              else:
                  skipped.append(rel.as_posix())

          for entry in raw_paths:
              if ".." in pathlib.PurePosixPath(entry).parts or entry.startswith("/"):
                  missing.append(entry + "  (not allowed: must be inside the repo)")
                  continue
              matches = sorted(root.glob(entry))
              if not matches:
                  missing.append(entry)
                  continue
              for m in matches:
                  try:
                      d = (m if m.is_dir() else m.parent).relative_to(root).as_posix() or "."
                      if d not in dests:
                          dests.append(d)
                  except ValueError:
                      pass
                  if m.is_dir():
                      for f in sorted(m.rglob("*")):
                          add(f)
                  else:
                      add(m)

          # Always include the docs next to (or one level above) each destination,
          # so the AI can see the current CHANGELOG.md and version. add() ignores missing files.
          for d in list(dests):
              for base in (root / d, (root / d).parent):
                  for doc in ("CHANGELOG.md", "README.md", "DESCRIPTION.md"):
                      add(base / doc)
              view_name = pathlib.PurePosixPath(d).name
              for ext in (".github.md", ".curseforge.html"):
                  add(root / "changelog_views" / (view_name + ext))

          files = sorted(selected, key=str.lower)
          if missing:
              for m in missing:
                  print(f"::warning::Path not found or not allowed: {m}")
          if not files:
              raise SystemExit("::error::Nothing matched. Check the paths (case-sensitive, relative to the repo root).")

          # Detect the current version from every exported CHANGELOG.md (top release heading)
          version_lines, top_versions = [], []
          for rel in files:
              if pathlib.PurePosixPath(rel).name != "CHANGELOG.md":
                  continue
              text = selected[rel].read_text(encoding="utf-8", errors="replace")
              mv = re.search(r"^## \[(\d+)\.(\d+)\.(\d+)(?:\.(\d+))?\]", text, re.M)
              if mv:
                  a, b, c, d = mv.groups()
                  if d is not None:  # legacy X.Y.Z.A -> X.Z.A
                      a, b, c = a, c, d
                  a, b, c = int(a), int(b), int(c)
                  version_lines.append(f"CURRENT VERSION: {a}.{b}.{c} / NEXT UPDATE: {a}.{b}.{c + 1}  ({rel})")
                  top_versions.append(f"{a}.{b}.{c}")

          blocks = []
          for rel in files:
              data = selected[rel].read_bytes().decode("utf-8", errors="replace")
              runs = re.findall(r"`+", data)
              fence = "`" * max(3, max((len(r) for r in runs), default=0) + 1)
              head = f"## FILE: {rel} ({data.count(chr(10)) + 1} lines, {len(data.encode('utf-8'))} bytes)"
              blocks.append((rel, f"\n{head}\n\n{fence}\n{data.rstrip(chr(10))}\n{fence}\n"))

          out = pathlib.Path("ai_review_bundle"); out.mkdir(exist_ok=True)
          name = f"{label}.b64"
          index = ["- **Export request:** " + ", ".join(f"`{r}`" for r in raw_paths),
                   "- **Destination:** " + ", ".join(f"`{d}`" for d in dests)]
          index += [f"- **{v.split('  (')[0]}**  (`{v.split('  (')[1].rstrip(')')}`)" for v in version_lines]
          index += [f"- **Text files:** {len(files)}", f"- **Skipped binary:** {len(skipped)}", f"- **Paths not found:** {len(missing)}", "", "### Files in this export", ""]
          index += [f"- `{r}`" for r in files]
          if missing:
              index += ["", "### Not found", ""] + [f"- `{m}`" for m in missing]
          if skipped:
              index += ["", "### Skipped (binary)", ""] + [f"- `{x}`" for x in skipped[:1000]]
          instructions = AI_PROMPT.replace("__DEST__", "\n".join("- " + d for d in dests) or "- .")
          content = ("# Repo Export\n\n## Index\n\n" + "\n".join(index) + "\n\n---\n\n"
                     + "## AI Instructions\n\n" + instructions.replace("# AI Instructions", "", 1).strip() + "\n\n---\n\n"
                     + "## File Contents\n" + "".join(b for _, b in blocks))
          import base64
          (out / name).write_bytes(base64.encodebytes(content.encode("utf-8")))
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write(f"label={label}\n")
              fh.write(f"artifact_name={'(' + top_versions[0] + ') ' + label if top_versions else label}\n")
          print(f"Exported {len(files)} files into ai_review_bundle/{name} (base64 of the Markdown export); skipped {len(skipped)} binary; {len(missing)} path(s) not found.")
          PY

      - name: Gather standard review files
        if: steps.mode.outputs.default == 'true'
        run: |
          set -u
          OUT=ai_review_bundle
          mkdir -p "$OUT"

          # 1. Repo tree (depth 3, no .git, no world data noise)
          find . -maxdepth 3 -not -path './.git*' -not -path './node_modules*' \
            | sort > "$OUT/repo_tree_depth3.txt"

          # Full list of files under key folders (names only)
          find . -type f -not -path './.git/*' \
            \( -path './scripts/*' -o -path './.github/*' -o -path './Mcpeworlds/assets/*' \) \
            | sort > "$OUT/key_folder_file_list.txt"

          # 2. Helper to copy a file while keeping its path
          copy_item() {
            src="$1"
            if [ -e "$src" ]; then
              mkdir -p "$OUT/files/$(dirname "$src")"
              cp -r "$src" "$OUT/files/$src"
              echo "OK      $src" >> "$OUT/manifest.txt"
            else
              echo "MISSING $src" >> "$OUT/manifest.txt"
            fi
          }

          : > "$OUT/manifest.txt"

          # 3. The files requested
          copy_item scripts/build_oneblock_variants_from_template.py
          copy_item INSTRUCTIONS.md
          copy_item changelog_views
          copy_item PACK_GENERATOR_INSTRUCTIONS.md
          copy_item .agents/skills/checkrm/SKILL.md
          copy_item Mcpeworlds/assets/resources_pack/textures/items/trader_ledger.png
          copy_item Mcpeworlds/assets/resources_pack/textures/items/controller.png
          copy_item Mcpeworlds/assets/resources_pack/textures/item_texture.json

          # All workflows (conventions: Python version, permissions, branch)
          for f in .github/workflows/*.yml .github/workflows/*.yaml; do
            [ -f "$f" ] && copy_item "$f"
          done

          # Every other script in scripts/
          for f in scripts/*; do
            [ -f "$f" ] && copy_item "$f"
          done

          # 5. Hash of the Trader Ledger PNG (to verify the embedded copy)
          PNG=Mcpeworlds/assets/resources_pack/textures/items/trader_ledger.png
          if [ -f "$PNG" ]; then
            sha256sum "$PNG" > "$OUT/trader_ledger_sha256.txt"
            stat -c '%s bytes' "$PNG" >> "$OUT/trader_ledger_sha256.txt"
          else
            echo "trader_ledger.png not found at expected path" > "$OUT/trader_ledger_sha256.txt"
          fi

          # 6. Environment hints
          {
            echo "Default branch: ${{ github.event.repository.default_branch }}"
            echo "Ref: ${{ github.ref }}"
            echo "Python on runner: $(python3 --version 2>&1)"
          } > "$OUT/env_info.txt"

      - name: Build one readable TXT of all text files
        if: steps.mode.outputs.default == 'true'
        run: |
          python3 - <<'PY'
          import os, pathlib
          root = pathlib.Path("ai_review_bundle")
          files_dir = root / "files"
          text_ext = {".py", ".yml", ".yaml", ".json", ".md", ".txt", ".js", ".mcfunction", ".lang", ".sh", ".html"}
          out = root / "ALL_TEXT_FILES.txt"
          items = sorted(p for p in files_dir.rglob("*") if p.is_file())
          included = []
          with out.open("w", encoding="utf-8") as fh:
              fh.write("TABLE OF CONTENTS\n")
              for p in items:
                  if p.suffix.lower() in text_ext:
                      included.append(p)
                      fh.write(f"- {p.relative_to(files_dir).as_posix()}\n")
              fh.write(f"\nTotal text files: {len(included)}\n\n")
              for p in included:
                  rel = p.relative_to(files_dir).as_posix()
                  fh.write(f"\n===== FILE: {rel} =====\n")
                  fh.write(p.read_text(encoding="utf-8", errors="replace"))
                  fh.write(f"\n===== END FILE: {rel} =====\n")
          print(f"Wrote {out} with {len(included)} files")
          PY

      - name: Show what was collected
        if: steps.mode.outputs.default == 'true'
        run: |
          echo "=== manifest ==="
          cat ai_review_bundle/manifest.txt
          echo "=== trader ledger ==="
          cat ai_review_bundle/trader_ledger_sha256.txt

      - name: Commit refreshed changelog views (optional)
        if: ${{ inputs.commit_changelog_views }}
        run: |
          set -euo pipefail
          if [ -n "$(git status --porcelain changelog_views)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add changelog_views
            git commit -m "chore(changelog): update changelog views [skip ci]"
            python3 scripts/git_push_retry.py --branch "${GITHUB_REF_NAME}"
          else
            echo "Changelog views are already up to date."
          fi

      - name: Pick download name
        id: name
        env:
          DEFAULT_NAME: ${{ steps.mode.outputs.artifact_name }}
          EXPORT_NAME: ${{ steps.build.outputs.artifact_name }}
        run: echo "artifact_name=${DEFAULT_NAME:-$EXPORT_NAME}" >> "$GITHUB_OUTPUT"

      - name: Upload bundle
        id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.name.outputs.artifact_name }}
          path: ai_review_bundle/
          include-hidden-files: true
          retention-days: 14

      - name: Summary
        if: ${{ always() }}
        env:
          PATHS_IN: ${{ inputs.paths }}
          NAME: ${{ steps.name.outputs.artifact_name }}
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
        run: |
          {
            echo "### Collect Files for AI Review"
            echo "- Paths: \`${PATHS_IN:-(standard review bundle)}\` (kit mode ignores paths)"
            echo "- Download **${NAME}.zip**: ${ARTIFACT_URL}"
          } >> "$GITHUB_STEP_SUMMARY"
