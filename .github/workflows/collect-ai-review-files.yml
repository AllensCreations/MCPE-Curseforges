name: Collect Files for AI Review

# ONE workflow for everything you hand to an AI (replaces "Export Repo Content to MD").
#   Leave "paths" empty : the standard review bundle (scripts, workflows, instruction files, icon
#                         hashes; only the files an update needs, no combined copy). Download name: (N) ai-review-bundle.zip (repo version from REPO_VERSION)
#   Type paths          : files, folders or globs, comma or newline separated
#                         (e.g. MCPEDL/Addons/Grand-Banquets, scripts, MCPEDL/Maps/*/behavior_pack).
#                         You get TWO plain .txt files inside a zip named after the first folder with its
#                         latest changelog version:  (X.Y.Z) Filename.zip
#                           <Filename>.txt        = the PACK: index, AI instructions, every text file of the paths
#                                                   (nothing truncated, no base64, no loose files)
#                           <Filename>_tools.txt  = OTHER: PACK_GENERATOR_INSTRUCTIONS.md, INSTRUCTIONS.md and the
#                                                   helper scripts (payload builder, recipe images, icon maker ...)
#                         Works for UPDATING a pack (type its folder, e.g. MCPEDL/Addons/Mining-Helmet) and for
#                         creating a NEW pack (type NEW: only the tools txt is built, no pack files).
#                         The built-in AI prompt keeps the Termux .sh rules: (Repofilename)_(Version)_(Rand).sh,
#                         CHANGELOG.md updated on every change with the X.Y.Z-only policy.
#                         Replies use ONLY: File Needed, Changelog, Termux Script (commands in their own bash block). No Summary.
#   The paths zips also hold SKILL.md at their root (copy of .agents/skills/mcpe-new-pack/SKILL.md): the AI reads it
#   first, it gives the reading order and the checks for a new pack. The standard bundle has it once, under files/.
# GitHub cannot push a download to your device by itself: open the run summary and tap the link.
#
# CHANGELOG VIEWS (merged from the old "Build Changelog Views" workflow)
#   Every run rebuilds changelog_views/ from each CHANGELOG.md with scripts/build_changelog_views.py
#   and puts it in the paths downloads (not in the standard bundle). The AI instructions below explain the views to the AI.
#   Tick "commit_changelog_views" to also save the refreshed views to the repo (needs write access).
#
# AUTOMATIC PER-PACKAGE FILES (new)
#   "Build Changed Packs & Sync Catalogs" runs scripts/auto_ai_review.py itself (push, nightly, manual); this workflow only
#   repeats it on demand (refresh_package_files). Every package whose files changed gets ONE fresh file inside its own folder:
#     MCPEDL/<Category>/<Name>/ai-review/<Name>.txt     (same content as the manual paths run)
#   plus ai-review/tools.txt once for the whole repo (instruction files and helper scripts).
#   The root README.md list of download links is refreshed when README.md holds the two lines
#   <!-- AI-REVIEW:START --> and <!-- AI-REVIEW:END -->. Unchanged packages are skipped (source hash), so a run with
#   nothing new commits nothing. The commit carries [skip ci]. Tick "refresh_package_files" to run it by hand.
# Save as: .github/workflows/collect-ai-review-files.yml

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Export mode"
        type: choice
        default: "update_pack"
        options:
          - "update_pack"
          - "new_pack"
          - "repo_maintenance"
      pack_path:
        description: "update_pack: pack folder path (e.g. MCPEDL/Addons/Mining-Helmet). Ignored for new_pack and repo_maintenance."
        required: false
        default: ""
        type: string


permissions:
  contents: write

concurrency:
  group: collect-ai-review-files
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'

      - name: Build changelog views (folded GitHub + CurseForge copies of every CHANGELOG.md)
        run: python3 scripts/build_changelog_views.py --all

      - name: Build description views (CurseForge page of every DESCRIPTION.md)
        run: |
          python3 scripts/build_listing_kits.py --all || echo "::warning::Some listing kits could not be built (see log). The rest of the export continues."

      - name: Choose mode
        id: mode
        env:
          MODE: ${{ inputs.mode }}
          PACK_PATH: ${{ inputs.pack_path }}
          EVENT: ${{ github.event_name }}
          run: |
          if [ "$EVENT" = "workflow_run" ]; then

            echo "auto=true" >> "$GITHUB_OUTPUT"
            echo "default=false" >> "$GITHUB_OUTPUT"
            echo "export_mode=repo_maintenance" >> "$GITHUB_OUTPUT"
            echo "paths=" >> "$GITHUB_OUTPUT"
          elif [ "$MODE" = "repo_maintenance" ]; then
            echo "auto=false" >> "$GITHUB_OUTPUT"
            echo "default=true" >> "$GITHUB_OUTPUT"
            echo "export_mode=repo_maintenance" >> "$GITHUB_OUTPUT"
            echo "paths=" >> "$GITHUB_OUTPUT"
            echo "artifact_name=($(cat REPO_VERSION 2>/dev/null || echo 0)) ai-review-bundle" >> "$GITHUB_OUTPUT"
          elif [ "$MODE" = "new_pack" ]; then
            echo "auto=false" >> "$GITHUB_OUTPUT"
            echo "default=false" >> "$GITHUB_OUTPUT"
            echo "export_mode=new_pack" >> "$GITHUB_OUTPUT"
            echo "paths=NEW" >> "$GITHUB_OUTPUT"
          else
            # update_pack (default)
            if [ -z "$(echo "${PACK_PATH}" | tr -d [:space:])" ]; then
              # Empty pack_path fallback to standard review bundle
              echo "auto=false" >> "$GITHUB_OUTPUT"
              echo "default=true" >> "$GITHUB_OUTPUT"
              echo "export_mode=repo_maintenance" >> "$GITHUB_OUTPUT"
              echo "paths=" >> "$GITHUB_OUTPUT"
              echo "artifact_name=($(cat REPO_VERSION 2>/dev/null || echo 0)) ai-review-bundle" >> "$GITHUB_OUTPUT"
            else
              echo "auto=false" >> "$GITHUB_OUTPUT"
              echo "default=false" >> "$GITHUB_OUTPUT"
              echo "export_mode=update_pack" >> "$GITHUB_OUTPUT"
              echo "paths=${PACK_PATH}" >> "$GITHUB_OUTPUT"
            fi
          fi


      - name: Refresh per-package AI review files (automatic run)
        if: steps.mode.outputs.auto == 'true'
        id: auto
        run: python3 scripts/auto_ai_review.py


      - name: Commit the refreshed AI review files
        if: steps.mode.outputs.auto == 'true' && steps.auto.outputs.changed == 'true'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A ai-review 2>/dev/null || true
          git add -A "MCPEDL/*/*/ai-review" 2>/dev/null || true
          if [ -f README.md ]; then git add README.md; fi
          if git diff --cached --quiet; then
            echo "AI review files are already up to date."
            exit 0
          fi
          git commit -m "chore(ai-review): refresh per-package AI review files [skip ci]"
          python3 scripts/git_push_retry.py --branch "${GITHUB_REF_NAME}"

      - name: Build path export (index, AI instructions and file contents in one MD)
        if: steps.mode.outputs.default == 'false' && steps.mode.outputs.auto != 'true'
        id: build
        env:
          PATHS: ${{ steps.mode.outputs.paths }}
          EXPORT_MODE: ${{ steps.mode.outputs.export_mode }}
          AI_SKIP_TOOLS: ${{ steps.mode.outputs.export_mode == 'update_pack' && '1' || '' }}
        run: python3 scripts/collect_ai_review.py

      - name: Gather standard review files
        if: steps.mode.outputs.default == 'true'
        run: |
          set -u
          OUT=ai_review_bundle
          mkdir -p "$OUT"

          # 1. Repo tree (depth 3, no .git, no world data noise)
          find . -maxdepth 3 -not -path './.git*' -not -path './node_modules*' \
            | sort > "$OUT/repo_tree_depth3.txt"

          # Full list of files under key folders (names only)
          find . -type f -not -path './.git/*' \
            \( -path './scripts/*' -o -path './.github/*' -o -path './Mcpeworlds/assets/*' \) \
            | sort > "$OUT/key_folder_file_list.txt"

          # 2. Helper to copy a file while keeping its path
          copy_item() {
            src="$1"
            if [ -e "$src" ]; then
              mkdir -p "$OUT/files/$(dirname "$src")"
              cp -r "$src" "$OUT/files/$src"
              echo "OK      $src" >> "$OUT/manifest.txt"
            else
              echo "MISSING $src" >> "$OUT/manifest.txt"
            fi
          }

          : > "$OUT/manifest.txt"

          # 3. The files requested
          copy_item scripts/build_oneblock_variants_from_template.py
          copy_item INSTRUCTIONS.md
          copy_item DOCS_RULES.md
          copy_item CHANGELOG.md
          copy_item PACK_GENERATOR_INSTRUCTIONS.md
          copy_item .agents/skills/checkrm/SKILL.md
          copy_item .agents/skills/mcpe-new-pack/SKILL.md
          copy_item Mcpeworlds/assets/resources_pack/textures/items/trader_ledger.png
          copy_item Mcpeworlds/assets/resources_pack/textures/items/controller.png
          copy_item Mcpeworlds/assets/resources_pack/textures/item_texture.json

          # All workflows (conventions: Python version, permissions, branch)
          for f in .github/workflows/*.yml .github/workflows/*.yaml; do
            [ -f "$f" ] && copy_item "$f"
          done

          # Every other script in scripts/
          for f in scripts/*; do
            [ -f "$f" ] && copy_item "$f"
          done

          # 5. Hash of the Trader Ledger PNG (to verify the embedded copy)
          PNG=Mcpeworlds/assets/resources_pack/textures/items/trader_ledger.png
          if [ -f "$PNG" ]; then
            sha256sum "$PNG" > "$OUT/trader_ledger_sha256.txt"
            stat -c '%s bytes' "$PNG" >> "$OUT/trader_ledger_sha256.txt"
          else
            echo "trader_ledger.png not found at expected path" > "$OUT/trader_ledger_sha256.txt"
          fi

          # 6. Environment hints
          {
            echo "Default branch: ${{ github.event.repository.default_branch }}"
            echo "Ref: ${{ github.ref }}"
            echo "Python on runner: $(python3 --version 2>&1)"
            echo "Repo version: $(cat REPO_VERSION 2>/dev/null || echo unknown)"
            echo "Latest repo changelog entry: $(grep -m1 '^## ' CHANGELOG.md || echo none)"
          } > "$OUT/env_info.txt"

      - name: Show what was collected
        if: steps.mode.outputs.default == 'true'
        run: |
          echo "=== manifest ==="
          cat ai_review_bundle/manifest.txt
          echo "=== trader ledger ==="
          cat ai_review_bundle/trader_ledger_sha256.txt

      - name: Add SKILL.md to the zip root
        if: steps.mode.outputs.default != 'true' && steps.mode.outputs.auto != 'true'
        run: |
          set -euo pipefail
          SKILL=.agents/skills/mcpe-new-pack/SKILL.md
          mkdir -p ai_review_bundle
          if [ -f "$SKILL" ]; then
            cp "$SKILL" ai_review_bundle/SKILL.md
            echo "SKILL.md added to the bundle root."
          else
            echo "::warning::$SKILL not found: the bundle has no SKILL.md."
          fi

      - name: Commit refreshed changelog and description views
        run: |
          set -euo pipefail
          if [ -n "$(git status --porcelain changelog_views description_views)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add changelog_views description_views
            git commit -m "chore(docs): update changelog and description views [skip ci]"
            python3 scripts/git_push_retry.py --branch "${GITHUB_REF_NAME}"
          else
            echo "Changelog views are already up to date."
          fi


      - name: Pick download name
        if: steps.mode.outputs.auto != 'true'
        id: name
        env:
          DEFAULT_NAME: ${{ steps.mode.outputs.artifact_name }}
          EXPORT_NAME: ${{ steps.build.outputs.artifact_name }}
        run: echo "artifact_name=${DEFAULT_NAME:-$EXPORT_NAME}" >> "$GITHUB_OUTPUT"

      - name: Upload bundle
        if: steps.mode.outputs.auto != 'true'
        id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.name.outputs.artifact_name }}
          path: ai_review_bundle/
          include-hidden-files: true
          retention-days: 14

      - name: Summary
        if: ${{ always() }}
        env:
          PATHS_IN: ${{ steps.mode.outputs.paths }}
          NAME: ${{ steps.name.outputs.artifact_name }}
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
          AUTO: ${{ steps.mode.outputs.auto }}
          CHANGED: ${{ steps.auto.outputs.changed }}
        run: |
          {
            echo "### Collect Files for AI Review"
            if [ "$AUTO" = "true" ]; then
              echo "- Automatic per-package refresh: changed files = ${CHANGED:-false}"
              echo "- Files are in each package folder under \`ai-review/\`, tools in \`ai-review/tools.txt\`, \`ai-review/New-Pack_tools.txt\`, \`ai-review/Update-Pack_tools.txt\`"
            else
              echo "- Paths: \`${PATHS_IN:-(standard review bundle)}\` (NEW = new-pack kit, UPDATE = update-pack kit, REPO = repo-maintenance kit)"
              echo "- Download **${NAME}.zip**: ${ARTIFACT_URL}"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
