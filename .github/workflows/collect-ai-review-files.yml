name: Collect Files for AI Review

# ONE workflow for everything you hand to an AI (replaces "Export Repo Content to MD").
#   Leave "paths" empty : the standard review bundle (scripts, workflows, instruction files, icon
#                         hashes, ALL_TEXT_FILES.txt). Download name: ai-review-bundle.zip
#   Type paths          : files, folders or globs, comma or newline separated
#                         (e.g. MCPEDL/Addons/Grand-Banquets, scripts, MCPEDL/Maps/*/behavior_pack).
#                         You get ONE <filename>.b64 file (base64 of a Markdown export: index, AI instructions,
#                         every text file, nothing truncated; decode with base64 -d) inside a zip named after the first folder with its
#                         latest changelog version:  (X.Y.Z) Filename.zip
#                         The built-in AI prompt keeps the Termux .sh rules: (Repofilename)_(Version)_(Rand).sh,
#                         CHANGELOG.md updated on every change with the three-part X.Y.Z policy.
# GitHub cannot push a download to your device by itself: open the run summary and tap the link.
#
# CHANGELOG VIEWS (merged from the old "Build Changelog Views" workflow)
#   Every run rebuilds changelog_views/ from each CHANGELOG.md with scripts/build_changelog_views.py
#   and puts it in the download. The AI instructions below explain the views to the AI.
#   Tick "commit_changelog_views" to also save the refreshed views to the repo (needs write access).
# Save as: .github/workflows/collect-ai-review-files.yml

on:
  workflow_dispatch:
    inputs:
      paths:
        description: "Leave empty for the standard review bundle. Or paths to export, comma-separated: files, folders or globs, e.g. MCPEDL/Addons/Grand-Banquets, scripts, .github/workflows"
        required: false
        default: ""
        type: string
      commit_changelog_views:
        description: "Also commit the refreshed changelog_views/ folder to the repo"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'

      - name: Build changelog views (folded GitHub + CurseForge copies of every CHANGELOG.md)
        run: python3 scripts/build_changelog_views.py --all

      - name: Choose mode
        id: mode
        env:
          PATHS: ${{ inputs.paths }}
        run: |
          if [ -z "$(echo "$PATHS" | tr -d '[:space:],')" ]; then
            echo "default=true" >> "$GITHUB_OUTPUT"
            echo "artifact_name=ai-review-bundle" >> "$GITHUB_OUTPUT"
          else
            echo "default=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build path export (index, AI instructions and file contents in one MD)
        if: steps.mode.outputs.default == 'false'
        id: build
        env:
          PATHS: ${{ inputs.paths }}
        run: |
          python3 - <<'PY'
          import os, re, pathlib

          AI_PROMPT = r'''# AI Instructions

          Repo: https://github.com/AllensCreations/MCPE-Curseforges.git (branch main)
          The attached export (a .b64 file: decode it with `base64 -d <name>.b64 > <name>.md`) shows the current files. Read it before changing anything.

          ## Destination (remembered from this export)
          Repo-root-relative folders this work belongs to:
          __DEST__
          All file paths in the .sh script start from the repo root and stay inside these folders. New files for this work go here too. Put the first folder in a `DEST=` variable at the top of the script and use it for every path and for `git add`.

          ## Rules
          1. Never invent features, versions, links, assets or test results.
          2. Give only what changed. Smallest possible edits, no unrelated rewrites.
          3. No notes, summaries or explanations unless asked.
          4. Applies to any project type: add-on, map, script, workflow, website, anything. Keep the existing folder layout. A new project goes in its own new folder next to similar ones.

          ## Every update request = ONE Termux script
          Create `<Repofilename>_<Version>_<RAND>.sh` (for example `Monster-Companions_1.2.4_k7q2x.sh`) as a downloadable file. `<Repofilename>` is the project, folder or file being changed, with no extension and no spaces (hyphens allowed). `<Version>` is that item's new X.Y.Z version (normally Z+1 for an Update; use the Beta or Release progression only when requested, see Versions below). `<RAND>` is at least 5 random lowercase letters or digits (for example `k7q2x`), freshly generated for every script and never reused from an earlier reply or an existing file, so a new script can never overwrite or re-run an older one with the same name. Use the exact same file name in the reply steps. It must, in this order:
          1. `#!/data/data/com.termux/files/usr/bin/bash` and `set -e`
          2. `cd "$HOME/MCPE-Curseforges"`, or `git clone` the repo URL first if the folder is missing
          3. `git pull --rebase`
          4. Apply every change (code and docs) inside the script itself (heredocs for new or replaced files, inline python3 for patching many files). No separate files to download.
          5. Validate every changed .json file with python3 and stop on error
          5b. Verify the top CHANGELOG.md heading equals the new X.Y.Z version and the script file name version; stop on mismatch. If the project has manifests, also check that each source manifest's metadata.version is X.Y.Z (the build rewrites it after the push; do not edit it in the script)
          6. `git add` only the changed paths, `git commit -m "<short message>"`, `git push`
          7. After the push, start the Build Changed Packs & Sync Catalogs workflow so the pack is built automatically. Only when `DEST` starts with `MCPEDL/`; it must never stop the script (`|| echo` a warning on failure). Use exactly:
          ```
          TOKEN=$(printf 'protocol=https\nhost=github.com\n\n' | git credential fill | sed -n 's/^password=//p')
          curl -fsS -X POST -H "Authorization: Bearer $TOKEN" -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/AllensCreations/MCPE-Curseforges/actions/workflows/auto-version-bump.yml/dispatches \
            -d "{\"ref\":\"main\",\"inputs\":{\"task\":\"build\",\"scope\":\"one project (pick it below)\",\"other\":\"$DEST\"}}" \
            && echo "Build Changed Packs & Sync Catalogs started for $DEST" \
            || echo "Could not start the build; run Build Changed Packs & Sync Catalogs manually."
          ```
          `$DEST` must be the project folder itself (for example `MCPEDL/Addons/Mining-Helmet`). The push may also start the same workflow by itself; the runs are queued and the second one changes nothing.
          8. Safe to run twice (skip anything already applied)

          ## Docs (every update, inside the same script)
          Strict templates: README.md, DESCRIPTION.md and CHANGELOG.md must follow the templates below exactly: same headings, same heading text, same order, same labels and bullet format. Do not add, remove, rename, merge or reorder sections, and add no boilerplate or extra text. Leave no placeholders; fill every [bracket] with verified content. Accuracy and the requested scope still outrank the template.
          CHANGELOG.md is mandatory on every update, with no exceptions: every script must add a new release entry for the change. After the change, analyze README.md and DESCRIPTION.md in the destination folder. Edit them only if the change makes them inaccurate or incomplete; leave the rest untouched. Never remove verified content.
          - Versions: use exactly X.Y.Z everywhere: X = Release generation, Y = Beta generation, Z = Update counter. A normal Update increments Z only (1.2.3 -> 1.2.4). A Beta increments Y and resets Z (1.2.4 -> 1.3.0). A Release increments X and resets Y/Z (1.3.0 -> 2.0.0). Legacy X.Y.Z.A values migrate to X.Z.A because the old Y was Alpha, Z was Beta, and A was Update; legacy three-part X.Y.Z values migrate to X.Z.0. The repository migration handles old manifests, changelogs, registry baselines and archives old snapshots. For a normal code update, increment Z by one; only use Beta or Release transitions when the request explicitly asks for that channel. Use the new X.Y.Z in the CHANGELOG heading and script filename. Never edit manifest versions or README download links by hand; the Build Changed Packs & Sync Catalogs workflow aligns header.version, metadata.version, module/dependency versions, titles, packages and snapshots. Never put a release version in README or DESCRIPTION titles, and never reuse an existing heading.
          - Changelog views: `changelog_views/<Name>.github.md` (newest release open, older releases folded by minor series) and `changelog_views/<Name>.curseforge.html` (same layout with CurseForge spoilers, to paste into the project description) are generated from CHANGELOG.md by `scripts/build_changelog_views.py`. CHANGELOG.md stays plain text in the exact template format and is the only source of truth: never add HTML, fold markup or links to it, never edit the views by hand, and never create or change them inside the .sh script. After a CHANGELOG.md change they are refreshed by the Collect Files for AI Review workflow (tick commit_changelog_views), or locally with `python3 scripts/build_changelog_views.py --project <Name>`.
          - Writing: player-facing only. In-game display names, never identifiers, file names, JSON, events or code. Write "Behavior Pack" / "Resource Pack", never BP/RP. No code blocks, emojis, hype, or badges in README; every DESCRIPTION must include the two exact Minecraft Bedrock and Format badges from the repo template and no other badges. DESCRIPTION may keep existing item sprites and recipe diagrams. No Markdown tables; use `### Feature Name` cards with `- **What Happens**: ...` bullets. Paragraphs of 4 sentences at most. State only verified facts; Verification line must say source created, package built or in-game tested, never mixed.
          - README.md (add-on): download landing page only, 24 non-empty lines max:
          ```
          # [Name]

          Download the current release of **[Name]** for Minecraft Bedrock Edition.

          ## Download

          - **Package format:** `.mcaddon`
          - **Direct download:** [Download [Name] (.mcaddon)](link)

          ## Installation

          1. Download the package using the link above.
          2. Open the downloaded file with Minecraft to import it.
          3. If the package contains a pack that must be enabled separately, activate it in your world's settings.

          ## Pack Information

          For gameplay features, usage details, compatibility notes, and other project information, read the [full description](DESCRIPTION link).
          ```
          Maps, scripts and minigames use the same download landing page (use the real package format, and for .mcworld tell players to open the imported world). Product details live in DESCRIPTION.md.
          - DESCRIPTION.md section order: `# [Name] — [subtitle]` (no release version), `**By ALNStudios**`, the two exact Minecraft Bedrock and Format badges from the repo template, summary, `## Overview`, `## Key Features`, `## How to Use`, `## Compatibility` (Minecraft Bedrock Edition, Experimental features, Achievements, Verification), `## Creator and Permissions` (CurseForge profile https://www.curseforge.com/members/allenscreations/projects and MCPEDL profile https://mcpedl.com/user/allenscreations/), `## Guidelines and Attribution`, then `---` and `## Search & Discovery Keywords` built from real features. For Add-ons, always use `Likely achievement-friendly` on the Achievements line; include caveats if world settings or cheats can disable achievements.
          - Guidelines and Attribution block, exactly:
          ```
          - Creator: ALNStudios
          - Rights & Reservation: All rights reserved for ALNStudios.
          - Content Creators: Content creators are permitted to feature this creation in videos and streams with credit to ALNStudios.
          - Redistribution: Do not re-upload this pack or provide direct monetized download bypasses. Link directly to the official repository page.
          - Disclaimer: This is an unofficial community creation. It is not an official Minecraft product and is not approved by or associated with Mojang or Microsoft.

          ---

          © All rights reserved for ALNStudios.
          ```
          - CHANGELOG.md: `# Changelog — [Name]`, `---`, then newest release first as `## [X.Y.Z] - YYYY-MM-DD` (script uses today's date from `TZ=Asia/Singapore date +%F`), grouped under `### Added`, `### Improved & Balanced`, `### Fixed` (bugs described by in-game experience). Entries are `- **Title**: player impact.` No links, URLs, badges, function or event names, or unverified benefits. No boilerplate after the title. Every entry needs at least one bullet; omit headings that have no entries. Insert the new entry directly under the `---` and above the previous release. Never edit or delete older entries.

          ## Reply format
          1. The .sh file (named <Repofilename>_<Version>_<RAND>.sh, ending with the random characters)
          2. These steps, exactly:

          First time only:
          ```
          pkg update -y && pkg install -y git python curl
          termux-setup-storage
          git config --global user.name "ALNStudios"
          git config --global user.email "your-email@example.com"
          git config --global credential.helper store
          ```
          Every update:
          ```
          bash ~/storage/downloads/<Repofilename>_<Version>_<RAND>.sh
          ```
          Download the .sh to your Downloads folder first and use its exact file name, including the random characters. At the push prompt, the password is your GitHub Personal Access Token (repo and workflow scopes), not your account password. The same token starts the build after the push.
          '''

          raw_paths = [p.strip().strip("'\"") for p in re.split(r"[,\n]", os.environ["PATHS"]) if p.strip()]

          def safe(x):
              return re.sub(r"[^A-Za-z0-9._-]+", "_", x).strip("_.")

          def auto_label():
              names = []
              for e in raw_paths:
                  last = [c for c in pathlib.PurePosixPath(e.rstrip("/")).parts if c not in (".", "")]
                  n = safe(last[-1]) if last else ""
                  if n and n not in names:
                      names.append(n)
              if not names:
                  return "export"
              label = "+".join(names[:3]) + ("+more" if len(names) > 3 else "")
              return label[:80]

          label = auto_label() or "export"

          root = pathlib.Path(".").resolve()
          SKIP_DIRS = {".git", "db", "node_modules", "__pycache__", "exports"}
          selected, skipped, missing = {}, [], []
          dests = []

          def is_text(p: pathlib.Path) -> bool:
              try:
                  head = p.read_bytes()[:8192]
              except OSError:
                  return False
              if b"\x00" in head:
                  return False
              try:
                  head.decode("utf-8")
              except UnicodeDecodeError as e:
                  # a multi-byte char cut at the 8 KB boundary is fine
                  return e.start >= len(head) - 4
              return True

          def add(p: pathlib.Path):
              try:
                  rel = p.resolve().relative_to(root)
              except ValueError:
                  return  # outside the repo
              if any(part in SKIP_DIRS for part in rel.parts):
                  return
              if not p.is_file():
                  return
              if is_text(p):
                  selected[rel.as_posix()] = p
              else:
                  skipped.append(rel.as_posix())

          for entry in raw_paths:
              if ".." in pathlib.PurePosixPath(entry).parts or entry.startswith("/"):
                  missing.append(entry + "  (not allowed: must be inside the repo)")
                  continue
              matches = sorted(root.glob(entry))
              if not matches:
                  missing.append(entry)
                  continue
              for m in matches:
                  try:
                      d = (m if m.is_dir() else m.parent).relative_to(root).as_posix() or "."
                      if d not in dests:
                          dests.append(d)
                  except ValueError:
                      pass
                  if m.is_dir():
                      for f in sorted(m.rglob("*")):
                          add(f)
                  else:
                      add(m)

          # Always include the docs next to (or one level above) each destination,
          # so the AI can see the current CHANGELOG.md and version. add() ignores missing files.
          for d in list(dests):
              for base in (root / d, (root / d).parent):
                  for doc in ("CHANGELOG.md", "README.md", "DESCRIPTION.md"):
                      add(base / doc)
              view_name = pathlib.PurePosixPath(d).name
              for ext in (".github.md", ".curseforge.html"):
                  add(root / "changelog_views" / (view_name + ext))

          files = sorted(selected, key=str.lower)
          if missing:
              for m in missing:
                  print(f"::warning::Path not found or not allowed: {m}")
          if not files:
              raise SystemExit("::error::Nothing matched. Check the paths (case-sensitive, relative to the repo root).")

          # Detect the current version from every exported CHANGELOG.md (top release heading)
          version_lines, top_versions = [], []
          for rel in files:
              if pathlib.PurePosixPath(rel).name != "CHANGELOG.md":
                  continue
              text = selected[rel].read_text(encoding="utf-8", errors="replace")
              mv = re.search(r"^## \[(\d+)\.(\d+)\.(\d+)(?:\.(\d+))?\]", text, re.M)
              if mv:
                  a, b, c, d = (int(x or 0) for x in mv.groups())
                  version_lines.append(f"CURRENT VERSION: {a}.{b}.{c}.{d} / NEXT: {a}.{b}.{c}.{d + 1}  ({rel})")
                  top_versions.append(f"{a}.{b}.{c}.{d}")

          blocks = []
          for rel in files:
              data = selected[rel].read_bytes().decode("utf-8", errors="replace")
              runs = re.findall(r"`+", data)
              fence = "`" * max(3, max((len(r) for r in runs), default=0) + 1)
              head = f"## FILE: {rel} ({data.count(chr(10)) + 1} lines, {len(data.encode('utf-8'))} bytes)"
              blocks.append((rel, f"\n{head}\n\n{fence}\n{data.rstrip(chr(10))}\n{fence}\n"))

          out = pathlib.Path("ai_review_bundle"); out.mkdir(exist_ok=True)
          name = f"{label}.b64"
          index = ["- **Export request:** " + ", ".join(f"`{r}`" for r in raw_paths),
                   "- **Destination:** " + ", ".join(f"`{d}`" for d in dests)]
          index += [f"- **{v.split('  (')[0]}**  (`{v.split('  (')[1].rstrip(')')}`)" for v in version_lines]
          index += [f"- **Text files:** {len(files)}", f"- **Skipped binary:** {len(skipped)}", f"- **Paths not found:** {len(missing)}", "", "### Files in this export", ""]
          index += [f"- `{r}`" for r in files]
          if missing:
              index += ["", "### Not found", ""] + [f"- `{m}`" for m in missing]
          if skipped:
              index += ["", "### Skipped (binary)", ""] + [f"- `{x}`" for x in skipped[:1000]]
          instructions = AI_PROMPT.replace("__DEST__", "\n".join("- " + d for d in dests) or "- .")
          content = ("# Repo Export\n\n## Index\n\n" + "\n".join(index) + "\n\n---\n\n"
                     + "## AI Instructions\n\n" + instructions.replace("# AI Instructions", "", 1).strip() + "\n\n---\n\n"
                     + "## File Contents\n" + "".join(b for _, b in blocks))
          import base64
          (out / name).write_bytes(base64.encodebytes(content.encode("utf-8")))
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write(f"label={label}\n")
              fh.write(f"artifact_name={'(' + top_versions[0] + ') ' + label if top_versions else label}\n")
          print(f"Exported {len(files)} files into ai_review_bundle/{name} (base64 of the Markdown export); skipped {len(skipped)} binary; {len(missing)} path(s) not found.")
          PY

      - name: Gather standard review files
        if: steps.mode.outputs.default == 'true'
        run: |
          set -u
          OUT=ai_review_bundle
          mkdir -p "$OUT"

          # 1. Repo tree (depth 3, no .git, no world data noise)
          find . -maxdepth 3 -not -path './.git*' -not -path './node_modules*' \
            | sort > "$OUT/repo_tree_depth3.txt"

          # Full list of files under key folders (names only)
          find . -type f -not -path './.git/*' \
            \( -path './scripts/*' -o -path './.github/*' -o -path './Mcpeworlds/assets/*' \) \
            | sort > "$OUT/key_folder_file_list.txt"

          # 2. Helper to copy a file while keeping its path
          copy_item() {
            src="$1"
            if [ -e "$src" ]; then
              mkdir -p "$OUT/files/$(dirname "$src")"
              cp -r "$src" "$OUT/files/$src"
              echo "OK      $src" >> "$OUT/manifest.txt"
            else
              echo "MISSING $src" >> "$OUT/manifest.txt"
            fi
          }

          : > "$OUT/manifest.txt"

          # 3. The files requested
          copy_item scripts/build_oneblock_variants_from_template.py
          copy_item INSTRUCTIONS.md
          copy_item changelog_views
          copy_item PACK_GENERATOR_INSTRUCTIONS.md
          copy_item .agents/skills/checkrm/SKILL.md
          copy_item Mcpeworlds/assets/resources_pack/textures/items/trader_ledger.png
          copy_item Mcpeworlds/assets/resources_pack/textures/items/controller.png
          copy_item Mcpeworlds/assets/resources_pack/textures/item_texture.json

          # All workflows (conventions: Python version, permissions, branch)
          for f in .github/workflows/*.yml .github/workflows/*.yaml; do
            [ -f "$f" ] && copy_item "$f"
          done

          # Every other script in scripts/
          for f in scripts/*; do
            [ -f "$f" ] && copy_item "$f"
          done

          # 5. Hash of the Trader Ledger PNG (to verify the embedded copy)
          PNG=Mcpeworlds/assets/resources_pack/textures/items/trader_ledger.png
          if [ -f "$PNG" ]; then
            sha256sum "$PNG" > "$OUT/trader_ledger_sha256.txt"
            stat -c '%s bytes' "$PNG" >> "$OUT/trader_ledger_sha256.txt"
          else
            echo "trader_ledger.png not found at expected path" > "$OUT/trader_ledger_sha256.txt"
          fi

          # 6. Environment hints
          {
            echo "Default branch: ${{ github.event.repository.default_branch }}"
            echo "Ref: ${{ github.ref }}"
            echo "Python on runner: $(python3 --version 2>&1)"
          } > "$OUT/env_info.txt"

      - name: Build one readable TXT of all text files
        if: steps.mode.outputs.default == 'true'
        run: |
          python3 - <<'PY'
          import os, pathlib
          root = pathlib.Path("ai_review_bundle")
          files_dir = root / "files"
          text_ext = {".py", ".yml", ".yaml", ".json", ".md", ".txt", ".js", ".mcfunction", ".lang", ".sh", ".html"}
          out = root / "ALL_TEXT_FILES.txt"
          items = sorted(p for p in files_dir.rglob("*") if p.is_file())
          included = []
          with out.open("w", encoding="utf-8") as fh:
              fh.write("TABLE OF CONTENTS\n")
              for p in items:
                  if p.suffix.lower() in text_ext:
                      included.append(p)
                      fh.write(f"- {p.relative_to(files_dir).as_posix()}\n")
              fh.write(f"\nTotal text files: {len(included)}\n\n")
              for p in included:
                  rel = p.relative_to(files_dir).as_posix()
                  fh.write(f"\n===== FILE: {rel} =====\n")
                  fh.write(p.read_text(encoding="utf-8", errors="replace"))
                  fh.write(f"\n===== END FILE: {rel} =====\n")
          print(f"Wrote {out} with {len(included)} files")
          PY

      - name: Show what was collected
        if: steps.mode.outputs.default == 'true'
        run: |
          echo "=== manifest ==="
          cat ai_review_bundle/manifest.txt
          echo "=== trader ledger ==="
          cat ai_review_bundle/trader_ledger_sha256.txt

      - name: Commit refreshed changelog views (optional)
        if: ${{ inputs.commit_changelog_views }}
        run: |
          set -euo pipefail
          if [ -n "$(git status --porcelain changelog_views)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add changelog_views
            git commit -m "chore(changelog): update changelog views [skip ci]"
            python3 scripts/git_push_retry.py --branch "${GITHUB_REF_NAME}"
          else
            echo "Changelog views are already up to date."
          fi

      - name: Pick download name
        id: name
        env:
          DEFAULT_NAME: ${{ steps.mode.outputs.artifact_name }}
          EXPORT_NAME: ${{ steps.build.outputs.artifact_name }}
        run: echo "artifact_name=${DEFAULT_NAME:-$EXPORT_NAME}" >> "$GITHUB_OUTPUT"

      - name: Upload bundle
        id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.name.outputs.artifact_name }}
          path: ai_review_bundle/
          include-hidden-files: true
          retention-days: 14

      - name: Summary
        if: ${{ always() }}
        env:
          PATHS_IN: ${{ inputs.paths }}
          NAME: ${{ steps.name.outputs.artifact_name }}
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
        run: |
          {
            echo "### Collect Files for AI Review"
            echo "- Paths: \`${PATHS_IN:-(standard review bundle)}\`"
            echo "- Download **${NAME}.zip**: ${ARTIFACT_URL}"
          } >> "$GITHUB_STEP_SUMMARY"
