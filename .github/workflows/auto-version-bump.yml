name: Build Changed Packs & Sync Catalogs

# ONE workflow for building, publishing and documentation. Pick "task" when you run it by hand.
#
#   build (default, also runs on push to main and daily)
#     Rebuild packs and synchronize their catalogs. Every build follows the version in the pack
#     manifests: BP and RP manifests are aligned to the highest one, and
#     builds/<pack>/versions/V<x.y.z>/ (packages, source.zip, source.sha256, build_info.json) is
#     created or REFRESHED IN PLACE whenever the source or packages differ from the saved snapshot.
#     Manifest versions are only bumped when "bump_on_change" is on (input, or repo variable
#     AUTO_BUMP_MANIFEST=true); otherwise the publish task owns version bumps.
#
#   publish  (the ONLY place that uploads to CurseForge; replaces "Publish Pack to CurseForge")
#     Dropdown + project IDs + last published versions all come from builds/Curseforge_IDs.json
#     (written by "Register CurseForge ID", which also refreshes the dropdown).
#     Versions are X.Y.Z.A. Every normal update only bumps A in CHANGELOG.md; manifests stay X.Y.Z.
#       beta:    X.Y.Z.A becomes X.Y.(Z+1).0; every unpublished A version is merged into one grouped entry.
#       alpha:   X.Y.Z.A becomes X.(Y+1).0.0; the changelog shows every series (1.3.x and lower) as a group.
#       release: X.Y.Z.A becomes (X+1).0.0.0; the changelog shows every major (v1.x.x) as a group.
#     The uploaded file is named like: Release - Mining Helmet v(2.0.0.0).mcaddon (Beta / Alpha / Release).
#     Set the repo variable CURSEFORGE_CHANGELOG_STYLE=plain to send markdown headings instead of spoiler folds.
#     After a successful upload the build task runs automatically (all projects) in the same run.
#
#   remake-docs  (replaces "Remake Docs")
#     standardize (default): keeps existing text. Rebuilds each add-on README as the download page,
#       fixes DESCRIPTION structure and adds a missing CHANGELOG entry for the current version.
#     rebuild: add-ons only. Replaces DESCRIPTION.md and README.md with generic text built from the
#       source files. Use it for stubs; write real features with the AI export workflow.
#     docs_dry_run only reports. docs_commit_mode pull_request (default) opens a pull request.

on:
  push:
    branches:
      - main
    paths:
      - 'MCPEDL/Addons/**'
      - 'MCPEDL/Script/**'
      - 'MCPEDL/Minigame/**'
      - 'MCPEDL/Maps/**'
      - 'scripts/ensure_recipe_unlocks.py'
  # Daily refresh, even when no source files changed (bumps only when AUTO_BUMP_MANIFEST is true).
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:
    inputs:
      task:
        description: "What to run: build (default), publish to CurseForge, or remake-docs"
        required: true
        default: build
        type: choice
        options:
          - build
          - publish
          - remake-docs

      # ---- task = build ----
      scope:
        description: "[build] What to process"
        required: true
        default: all
        type: choice
        options:
          - all
          - one project (pick it below)
      addon:
        description: "[build] Project from MCPEDL/Addons (only when scope = one project)"
        required: true
        default: "-"
        type: choice
        options:
          # BEGIN addon
          - "-"
          - "Fletching-Table-Arsenal"
          - "Ghast-Mob-Head-Transformers"
          - "Grand-Banquets"
          - "Grimoire-Relics-V2"
          - "Harvest-Intelligence"
          - "Immortal-Pets"
          - "Magnetic-Satchel"
          - "Melody-Figurine"
          - "Mining-Helmet"
          - "Monster-Companions"
          - "One-Block-Economy"
          - "Passive-Auto-Switch-Tools"
          - "Selective-Mob-Controller"
          - "Smart-Tree-Capitator-and-Domino-Ore-Miner"
          - "Sudden-Death-Roulette"
          - "Swarm-Mob-Booster"
          - "Tameable-Companion-Fox"
          - "Universal-Clutch"
          - "Vanilla-Quality-of-Life"
          # END addon
      script:
        description: "[build] Project from MCPEDL/Script (only when scope = one project)"
        required: true
        default: "-"
        type: choice
        options:
          # BEGIN script
          - "-"
          # END script
      minigame:
        description: "[build] Project from MCPEDL/Minigame (only when scope = one project)"
        required: true
        default: "-"
        type: choice
        options:
          # BEGIN minigame
          - "-"
          - "Alphabet-Scavenger-Hunt"
          - "Mob-Chaos-Behavioral-Roulette"
          - "Shared-Hivemind-Inventory"
          - "Tethered-Breaker-And-Builder"
          - "Trivia-Vault-The-Locked-World"
          # END minigame
      map:
        description: "[build] Project from MCPEDL/Maps (only when scope = one project)"
        required: true
        default: "-"
        type: choice
        options:
          # BEGIN map
          - "-"
          - "OneBlock-Dirtbound-Kingdom-Beta"
          - "Oneblock-SM"
          - "OneBlock-Void-Survival"
          # END map
      other:
        description: "[build] Optional: project path or name missing from the lists above"
        required: false
        default: ""
        type: string
      bump_on_change:
        description: "[build] Bump X.Y.Z -> X.Y.(Z+1) in the manifests when the source changed since the saved snapshot"
        required: false
        default: false
        type: boolean

      # ---- task = publish ----
      publish_project:
        description: "[publish] Registered pack"
        required: true
        default: "-"
        type: choice
        options:
          # BEGIN registered
          - "-"
          - "MCPEDL/Addons/Monster-Companions"
          - "MCPEDL/Addons/Vanilla-Quality-of-Life"
          - "MCPEDL/Maps/OneBlock-Void-Survival"
          - "MCPEDL/Minigame/Shared-Hivemind-Inventory"
          # END registered
      publish_map_variant:
        description: "[publish] Maps only (default = auto, all = Creative + Survival + Hardcore)"
        required: true
        default: default
        type: choice
        options:
          - default
          - Creative
          - Survival
          - Hardcore
          - all
      publish_release_type:
        description: "[publish] beta = X.Y.Z+1.0 (groups the A versions), alpha = X.Y+1.0.0, release = X+1.0.0.0"
        required: true
        default: beta
        type: choice
        options:
          - release
          - beta
          - alpha

      # ---- task = remake-docs ----
      docs_scope:
        description: "[remake-docs] all projects, or one project (fill in docs_project)"
        required: true
        default: all
        type: choice
        options:
          - all
          - one project
      docs_project:
        description: "[remake-docs] Project folder name, used when docs_scope = one project (e.g. Mining-Helmet)"
        required: false
        default: ""
        type: string
      docs_mode:
        description: "[remake-docs] standardize keeps existing text; rebuild regenerates add-on docs from source files"
        required: true
        default: standardize
        type: choice
        options:
          - standardize
          - rebuild
      docs_which:
        description: "[remake-docs] Which documents to remake"
        required: true
        default: all
        type: choice
        options:
          - all
          - readme
          - description
          - changelog
      docs_dry_run:
        description: "[remake-docs] Only report what would change"
        required: true
        default: false
        type: boolean
      docs_confirm_rebuild:
        description: "[remake-docs] Type REBUILD to allow docs_mode = rebuild with docs_scope = all"
        required: false
        default: ""
        type: string
      docs_commit_mode:
        description: "[remake-docs] pull_request opens a PR to review (default); direct pushes straight to the branch"
        required: true
        default: pull_request
        type: choice
        options:
          - pull_request
          - direct

# Least privilege by default; each job asks for what it needs.
permissions:
  contents: read

jobs:
  # =====================================================================================
  # task = publish
  # =====================================================================================
  publish:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.task == 'publish' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: publish-curseforge-${{ inputs.publish_project }}
      cancel-in-progress: false
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref }}

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'

      - name: Install build dependency
        run: python3 -m pip install pillow

      - name: Validate inputs and load ID from registry
        env:
          CURSEFORGE_API_TOKEN: ${{ secrets.CURSEFORGE_API_TOKEN }}
          PROJECT_PATH: ${{ inputs.publish_project }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == refs/heads/* ]] || { echo "::error::Run this workflow on a branch."; exit 1; }
          [ "$PROJECT_PATH" != "-" ] || { echo "::error::Pick a registered pack (run 'Register CurseForge ID' first if it is missing)."; exit 1; }
          [ -n "$CURSEFORGE_API_TOKEN" ] || { echo "::error::Add the CURSEFORGE_API_TOKEN repository secret."; exit 1; }
          python3 - <<'PY'
          import os, sys
          sys.path.insert(0, "scripts")
          import prepare_curseforge_upload as release
          try:
              info = release.read_info(os.environ["PROJECT_PATH"])
          except ValueError as exc:
              print(f"::error::{exc}")
              sys.exit(1)
          print(f"CurseForge project {info['project_id']}, last published: {info.get('last_published_version', 'never')}")
          PY

      - name: Bump version, merge changelog, build and upload (once)
        env:
          CURSEFORGE_API_TOKEN: ${{ secrets.CURSEFORGE_API_TOKEN }}
          PROJECT_PATH: ${{ inputs.publish_project }}
          MAP_VARIANT: ${{ inputs.publish_map_variant }}
          RELEASE_TYPE: ${{ inputs.publish_release_type }}
          CURSEFORGE_CHANGELOG_STYLE: ${{ vars.CURSEFORGE_CHANGELOG_STYLE || 'spoiler' }}
        run: |
          set -euo pipefail
          python3 scripts/auto_publish_curseforge.py \
            --project "$PROJECT_PATH" \
            --map-variant "$MAP_VARIANT" \
            --release-type "$RELEASE_TYPE"

      # Runs only after a successful upload, so a failed upload leaves the repo untouched.
      - name: Commit new version, merged changelog and saved release info
        env:
          PROJECT_PATH: ${{ inputs.publish_project }}
        run: |
          set -euo pipefail
          NAME="${PROJECT_PATH##*/}"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(curseforge): publish $NAME [skip ci]"
          python3 scripts/git_push_retry.py --branch "${GITHUB_REF#refs/heads/}"

  # =====================================================================================
  # task = remake-docs
  # =====================================================================================
  remake-docs:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.task == 'remake-docs' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: release-build-refresh
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"

      - name: Remake documents
        id: remake
        env:
          SCOPE: ${{ inputs.docs_scope }}
          PROJECT: ${{ inputs.docs_project }}
          MODE: ${{ inputs.docs_mode }}
          DOCS: ${{ inputs.docs_which }}
          DRY_RUN: ${{ inputs.docs_dry_run }}
          CONFIRM: ${{ inputs.docs_confirm_rebuild }}
        run: |
          set -uo pipefail
          set +e
          ARGS=(--remake "$MODE" --docs "$DOCS")
          if [ "$SCOPE" = "all" ]; then
            ARGS+=(--all)
            if [ "$MODE" = "rebuild" ]; then
              if [ "$CONFIRM" != "REBUILD" ]; then
                echo "::error::docs_mode = rebuild with docs_scope = all replaces every add-on DESCRIPTION.md and README.md. Type REBUILD in docs_confirm_rebuild, or pick one project."
                exit 1
              fi
              ARGS+=(--confirm-rebuild)
            fi
          else
            if [ -z "$PROJECT" ]; then
              echo "::error::docs_scope is 'one project': fill in docs_project."
              exit 1
            fi
            ARGS+=(--project "$PROJECT")
          fi
          if [ "$DRY_RUN" = "true" ]; then ARGS+=(--check); fi
          echo "Running: python3 scripts/check_readme_status.py ${ARGS[*]}"
          python3 scripts/check_readme_status.py "${ARGS[@]}" 2>&1 | tee remake.log
          STATUS=${PIPESTATUS[0]}
          if [ "$STATUS" -eq 1 ] && [ "$DRY_RUN" = "true" ]; then STATUS=0; fi
          {
            echo "### Remake docs ($MODE, $DOCS, $SCOPE)"
            echo '```'
            cat remake.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$STATUS"

      - name: Audit result (report only)
        continue-on-error: true
        run: |
          {
            echo "### README audit after remake"
            echo '```'
            python3 scripts/check_readme_status.py || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Commit changes
        if: ${{ !inputs.docs_dry_run }}
        env:
          COMMIT_MODE: ${{ inputs.docs_commit_mode }}
          MODE: ${{ inputs.docs_mode }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          BRANCH="docs/remake-${GITHUB_RUN_ID}"
          if [ "$COMMIT_MODE" = "pull_request" ]; then
            git checkout -b "$BRANCH"
          fi
          git add -A -- MCPEDL
          if git diff --cached --quiet; then
            echo "No changes to commit."; exit 0
          fi
          git commit -m "docs: remake README, DESCRIPTION and CHANGELOG (${MODE}) [skip ci]"
          if [ "$COMMIT_MODE" = "direct" ]; then
            python3 scripts/git_push_retry.py --branch "${GITHUB_REF_NAME}"
          else
            git push origin "$BRANCH"
            gh pr create --base "${GITHUB_REF_NAME}" --head "$BRANCH" \
              --title "Remake docs (${MODE})" \
              --body "Generated by Build Changed Packs & Sync Catalogs (task remake-docs). Mode: ${MODE}. Review the changed README, DESCRIPTION and CHANGELOG files. Added defaults such as 'Verification: Source created, not tested in game' and generated changelog entries must be replaced with verified facts."
          fi

  # =====================================================================================
  # task = build (push, daily schedule, manual build, and right after a successful publish)
  # =====================================================================================
  release-refresh:
    needs: [publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: release-build-refresh
      cancel-in-progress: false
    # Skip on remake-docs runs. After a publish, run only when the upload succeeded.
    # Pushes only: skip bot commits, and skip when the push touches Dirtbound's source tree
    # (its dedicated world build owns that README and archives).
    if: ${{ !cancelled() && (needs.publish.result == 'success' || needs.publish.result == 'skipped') && !(github.event_name == 'workflow_dispatch' && inputs.task == 'remake-docs') && (github.event_name != 'push' || (!contains(github.event.head_commit.message, '[skip ci]') && !contains(toJSON(github.event.commits), 'MCPEDL/Maps/OneBlock-Dirtbound-Kingdom-Beta/'))) }}

    steps:
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'

      - name: Ensure custom crafting recipes are always unlocked
        run: python3 scripts/ensure_recipe_unlocks.py

      - name: Convert icon files to pack_icon.png
        run: |
          set -euo pipefail
          pip install pillow
          python3 scripts/make_pack_icon.py

      - name: Rebuild packages & register new projects
        id: process
        env:
          EVENT: ${{ github.event_name }}
          TASK: ${{ github.event.inputs.task }}
          SCOPE: ${{ github.event.inputs.scope }}
          ADDON: ${{ github.event.inputs.addon }}
          SCRIPT: ${{ github.event.inputs.script }}
          MINIGAME: ${{ github.event.inputs.minigame }}
          MAP: ${{ github.event.inputs.map }}
          OTHER: ${{ github.event.inputs.other }}
          BUMP_INPUT: ${{ github.event.inputs.bump_on_change }}
          AUTO_BUMP_MANIFEST: ${{ vars.AUTO_BUMP_MANIFEST }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          ARGS=()
          case "$EVENT" in
            schedule)
              ARGS=(--all)
              ;;
            workflow_dispatch)
              if [ "$TASK" = "publish" ]; then
                # Publish can change only CHANGELOG/manifests, or nothing the diff would catch, so
                # re-check every project. Builds are reproducible and snapshots are hash-gated:
                # untouched projects produce no diff.
                ARGS=(--all)
              elif [ "$SCOPE" = "all" ]; then
                ARGS=(--all)
              else
                PICKS=()
                [ -n "$ADDON" ]     && [ "$ADDON" != "-" ]     && PICKS+=("MCPEDL/Addons/$ADDON")
                [ -n "$SCRIPT" ]    && [ "$SCRIPT" != "-" ]    && PICKS+=("MCPEDL/Script/$SCRIPT")
                [ -n "$MINIGAME" ]  && [ "$MINIGAME" != "-" ]  && PICKS+=("MCPEDL/Minigame/$MINIGAME")
                [ -n "$MAP" ]       && [ "$MAP" != "-" ]       && PICKS+=("MCPEDL/Maps/$MAP")
                [ -n "$OTHER" ]                                && PICKS+=("$OTHER")
                if [ "${#PICKS[@]}" -ne 1 ]; then
                  echo "::error::scope is 'one project': pick exactly one project (found ${#PICKS[@]}). Leave the other lists on '-'."
                  exit 1
                fi
                ARGS=(--project "${PICKS[0]}")
              fi
              ;;
            *)
              if [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ]; then
                ARGS=(--base "$BEFORE")
              else
                ARGS=(--base "HEAD~1")
              fi
              ;;
          esac
          if [ "$BUMP_INPUT" = "true" ] || [ "${AUTO_BUMP_MANIFEST:-}" = "true" ]; then ARGS+=(--bump); fi
          echo "Running: python3 scripts/auto_bump_and_build.py ${ARGS[*]}"
          python3 scripts/auto_bump_and_build.py "${ARGS[@]}"

      - name: Synchronize OneBlock map READMEs
        run: python3 scripts/sync_oneblock_map_readmes.py

      - name: Sync every README link to the current builds
        run: |
          set -uo pipefail
          set +e
          python3 scripts/sync_readme_links.py 2>&1 | tee "$RUNNER_TEMP/readme-links.log"
          STATUS=${PIPESTATUS[0]}
          {
            echo "### README link sync (follows the manifest version)"
            echo '```'
            cat "$RUNNER_TEMP/readme-links.log"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$STATUS"

      - name: Standardize DESCRIPTION files
        run: |
          set -uo pipefail
          set +e
          python3 scripts/remake_docs.py --remake standardize --all --docs description 2>&1 | tee "$RUNNER_TEMP/description-standardize.log"
          STATUS=${PIPESTATUS[0]}
          {
            echo "### DESCRIPTION standardization"
            echo '```'
            cat "$RUNNER_TEMP/description-standardize.log"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$STATUS"

      - name: Verify builds/ snapshots match source and manifest versions (report only)
        continue-on-error: true
        run: |
          {
            echo "### Snapshot verification"
            echo '```'
            python3 scripts/auto_bump_and_build.py --verify || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Validate manifest titles and creator attribution
        run: python3 scripts/validate_manifest_titles.py

      - name: Check every manifest in the repository (report only)
        continue-on-error: true
        run: |
          {
            echo "### Whole-repository manifest check"
            echo '```'
            python3 scripts/check_manifest_versions.py || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Audit README and DESCRIPTION status (report only)
        continue-on-error: true
        run: |
          {
            echo "### README audit"
            echo '```'
            python3 scripts/check_readme_status.py || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Commit and push changes
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          for dir in MCPEDL builds; do
            if [ -d "$dir" ]; then git add "$dir"; fi
          done
          if [ -f README.md ]; then git add README.md; fi
          if [ -f Mcpeworlds/README.md ]; then git add Mcpeworlds/README.md; fi

          if git diff --cached --quiet; then
            echo "Nothing to commit: packages, catalogs and READMEs are up to date."
          else
            git commit -m "chore(build): rebuild packages and sync catalogs [skip ci]"
            python3 scripts/git_push_retry.py --branch main
          fi
