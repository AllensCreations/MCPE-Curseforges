name: Release - Bump, Rebuild, Refresh & Sync READMEs

# One workflow for everything that used to live in two:
#   * "Auto-Bump Pack Version, Rebuild & Register New Projects" (push + manual)
#   * "Refresh Add-ons and Rebuild Packs" (daily schedule + manual)
# Every run also re-syncs the READMEs (project, category, builds, root, OneBlock maps).

on:
  push:
    branches:
      - main
    paths:
      - 'MCPEDL/addons/**'
      - 'MCPEDL/new_addons/**'
      - 'MCPEDL/script/**'
      - 'MCPEDL/maps/**'
      - 'scripts/ensure_recipe_unlocks.py'
  # Daily refresh, even when no source files changed (never bumps versions).
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:
    inputs:
      scope:
        description: "What to process"
        required: true
        default: all
        type: choice
        options:
          - all
          - one project (pick it below)
      addon:
        description: "Project from MCPEDL/addons (only when scope = one project)"
        required: true
        default: "-"
        type: choice
        options:
          # BEGIN addon
          - "-"
          - "Ghast-Mob-Head-Transformers"
          - "Grand-Banquets"
          - "Grimoire-Relics-V2"
          - "Harvest-Intelligence"
          - "Immortal-Pets"
          - "Magnetic-Satchel"
          - "Mining-Helmet"
          - "Monster-Companions"
          - "Passive-Auto-Switch-Tools"
          - "Smart-Tree-Capitator-and-Domino-Ore-Miner"
          - "Sudden-Death-Roulette"
          - "Tameable-Companion-Fox"
          - "Universal-Clutch"
          - "Vanilla-Quality-of-Life"
          # END addon
      new_addon:
        description: "Project from MCPEDL/new_addons (only when scope = one project)"
        required: true
        default: "-"
        type: choice
        options:
          # BEGIN new_addon
          - "-"
          - "Melody-Figurine"
          - "One-Block-Economy"
          - "Selective-Mob-Controller"
          - "Swarm-Mob-Booster"
          - "trial"
          # END new_addon
      script:
        description: "Project from MCPEDL/script (only when scope = one project)"
        required: true
        default: "-"
        type: choice
        options:
          # BEGIN script
          - "-"
          - "Alphabet-Scavenger-Hunt"
          - "Mob-Chaos-Behavioral-Roulette"
          - "Shared-Hivemind-Inventory"
          - "Tethered-Breaker-And-Builder"
          - "Trivia-Vault-The-Locked-World"
          # END script
      map:
        description: "Project from MCPEDL/maps (only when scope = one project)"
        required: true
        default: "-"
        type: choice
        options:
          # BEGIN map
          - "-"
          - "OneBlock-Dirtbound-Kingdom-Beta"
          - "Oneblock-SM"
          - "OneBlock-Void-Survival"
          # END map
      other:
        description: "Optional: project path or name missing from the lists above"
        required: false
        default: ""
        type: string
      bump:
        description: "Bump pack versions (turn off for a refresh-only rebuild)"
        required: true
        default: true
        type: boolean
      sync_engine:
        description: "Raise min_engine_version when item or block files need a newer game version"
        required: true
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: release-build-refresh
  cancel-in-progress: false

jobs:
  release-refresh:
    runs-on: ubuntu-latest
    # Pushes only: skip bot commits, and skip when the push touches Dirtbound's
    # source tree (its dedicated world workflow owns that README and archives).
    if: ${{ github.event_name != 'push' || (!contains(github.event.head_commit.message, '[skip ci]') && !contains(toJSON(github.event.commits), 'MCPEDL/maps/OneBlock-Dirtbound-Kingdom-Beta/')) }}

    steps:
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.x'

      - name: Ensure custom crafting recipes are always unlocked
        run: python3 scripts/ensure_recipe_unlocks.py

      - name: Convert icon files to pack_icon.png
        run: |
          set -euo pipefail
          pip install pillow
          python3 scripts/make_pack_icon.py

      - name: Bump versions, rebuild packages & register new projects
        id: process
        env:
          EVENT: ${{ github.event_name }}
          SCOPE: ${{ github.event.inputs.scope }}
          ADDON: ${{ github.event.inputs.addon }}
          NEW_ADDON: ${{ github.event.inputs.new_addon }}
          SCRIPT: ${{ github.event.inputs.script }}
          MAP: ${{ github.event.inputs.map }}
          OTHER: ${{ github.event.inputs.other }}
          BUMP: ${{ github.event.inputs.bump }}
          BEFORE: ${{ github.event.before }}
          SYNC_ENGINE: ${{ github.event.inputs.sync_engine }}
        run: |
          set -euo pipefail
          ARGS=()
          MODE="refresh"
          case "$EVENT" in
            schedule)
              ARGS=(--all --no-bump)
              ;;
            workflow_dispatch)
              if [ "$SCOPE" = "all" ]; then
                ARGS=(--all)
              else
                PICKS=()
                [ -n "$ADDON" ]     && [ "$ADDON" != "-" ]     && PICKS+=("MCPEDL/addons/$ADDON")
                [ -n "$NEW_ADDON" ] && [ "$NEW_ADDON" != "-" ] && PICKS+=("MCPEDL/new_addons/$NEW_ADDON")
                [ -n "$SCRIPT" ]    && [ "$SCRIPT" != "-" ]    && PICKS+=("MCPEDL/script/$SCRIPT")
                [ -n "$MAP" ]       && [ "$MAP" != "-" ]       && PICKS+=("MCPEDL/maps/$MAP")
                [ -n "$OTHER" ]                                && PICKS+=("$OTHER")
                if [ "${#PICKS[@]}" -ne 1 ]; then
                  echo "::error::scope is 'one project': pick exactly one project (found ${#PICKS[@]}). Leave the other lists on '-'."
                  exit 1
                fi
                ARGS=(--project "${PICKS[0]}")
              fi
              if [ "$BUMP" = "true" ]; then
                MODE="release"
              else
                ARGS+=(--no-bump)
              fi
              ;;
            *)
              MODE="release"
              if [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ]; then
                ARGS=(--base "$BEFORE")
              else
                ARGS=(--base "HEAD~1")
              fi
              ;;
          esac
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          SYNC_ARGS=()
          for a in "${ARGS[@]}"; do
            if [ "$a" != "--no-bump" ]; then SYNC_ARGS+=("$a"); fi
          done
          if [ "${SYNC_ENGINE:-true}" != "false" ]; then SYNC_ARGS+=(--raise-engine); fi
          echo "Syncing versions and UUID references: ${SYNC_ARGS[*]}"
          python3 scripts/sync_manifest_versions.py "${SYNC_ARGS[@]}" | tee "$RUNNER_TEMP/sync.log"
          echo "Running: python3 scripts/auto_bump_and_build.py ${ARGS[*]}"
          python3 scripts/auto_bump_and_build.py "${ARGS[@]}"
          echo "Verifying manifest versions of the processed projects"
          VERIFY_ARGS=()
          for a in "${SYNC_ARGS[@]}"; do
            if [ "$a" != "--raise-engine" ]; then VERIFY_ARGS+=("$a"); fi
          done
          VERIFY_STATUS=0
          python3 scripts/sync_manifest_versions.py "${VERIFY_ARGS[@]}" --verify-only | tee "$RUNNER_TEMP/verify.log" || VERIFY_STATUS=$?
          {
            echo "### Version and UUID sync"
            echo '```'
            cat "$RUNNER_TEMP/sync.log"
            echo '```'
            echo "### Manifest version check"
            echo '```'
            cat "$RUNNER_TEMP/verify.log"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$VERIFY_STATUS" -ne 0 ]; then
            echo "::error::Manifest version check failed. Nothing was committed."
            exit "$VERIFY_STATUS"
          fi
          echo "Syncing DESCRIPTION headings and CHANGELOG entries"
          python3 scripts/sync_project_docs.py "${VERIFY_ARGS[@]}" | tee "$RUNNER_TEMP/docs.log"
          {
            echo "### DESCRIPTION and CHANGELOG sync"
            echo '```'
            cat "$RUNNER_TEMP/docs.log"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Synchronize OneBlock map READMEs
        run: python3 scripts/sync_oneblock_map_readmes.py

      - name: Validate manifest titles and creator attribution
        run: python3 scripts/validate_manifest_titles.py

      - name: Check every manifest in the repository (report only)
        continue-on-error: true
        run: |
          {
            echo "### Whole-repository manifest check"
            echo '```'
            python3 scripts/check_manifest_versions.py || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Audit README and DESCRIPTION status (report only)
        continue-on-error: true
        run: |
          {
            echo "### README audit"
            echo '```'
            python3 scripts/check_readme_status.py || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Commit and push changes
        env:
          MODE: ${{ steps.process.outputs.mode }}
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          for dir in MCPEDL packs minigames maps builds; do
            if [ -d "$dir" ]; then git add "$dir"; fi
          done
          if [ -f README.md ]; then git add README.md; fi

          if git diff --cached --quiet; then
            echo "Nothing to commit: packages, catalogs and READMEs are up to date."
          else
            if [ "$MODE" = "release" ]; then
              git commit -m "chore(release): auto-bump versions, rebuild packages, register projects & sync READMEs [skip ci]"
            else
              git commit -m "chore(build): refresh project packages, catalogs & READMEs [skip ci]"
            fi
            git pull --rebase origin main
            git push origin main
          fi
