name: Auto-Bump Pack Version & Rebuild Distribution

on:
  push:
    branches:
      - main
    paths:
      - 'MCPEDL/**'
  workflow_dispatch:
    inputs:
      target:
        description: 'Which project to bump? (Type "all" for every pack in MCPEDL, or enter a pack name like "Mining-Helmet")'
        required: true
        default: 'all'
        type: string

permissions:
  contents: write

jobs:
  bump-and-build:
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Detect Changes and Bump Version (+0.0.1) & Rebuild Packages
        id: bump
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ "${{ github.event.inputs.target }}" = "all" ] || [ "${{ github.event.inputs.target }}" = "" ]; then
              python3 scripts/auto_bump_and_build.py --all
            else
              python3 scripts/auto_bump_and_build.py --project "${{ github.event.inputs.target }}"
            fi
          elif [ "${{ github.event.before }}" != "" ] && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            python3 scripts/auto_bump_and_build.py --base "${{ github.event.before }}"
          else
            python3 scripts/auto_bump_and_build.py --base "HEAD~1"
          fi

      - name: Commit and Push Updated Manifests, Builds, and Documentation
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Stage updated directories only if they exist
          for dir in MCPEDL packs minigames maps builds; do
            if [ -d "$dir" ]; then
              git add "$dir"
            fi
          done
          [ -f "README.md" ] && git add README.md
          
          if git diff --staged --quiet; then
            echo "No version bump or package rebuild changes to commit."
          else
            git commit -m "chore(release): auto-bump pack version and rebuild distribution [skip ci]"
            git push origin main
          fi
