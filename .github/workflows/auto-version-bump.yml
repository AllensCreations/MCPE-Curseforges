name: Auto-Bump Pack Version, Rebuild & Register New Projects

on:
  push:
    branches:
      - main
    paths:
      - 'MCPEDL/addons/**'
      - 'MCPEDL/new_addons/**'
      - 'MCPEDL/script/**'
      - 'MCPEDL/maps/**'
      - 'scripts/ensure_recipe_unlocks.py'
  workflow_dispatch:
    inputs:
      target:
        description: "'all' or one project folder name under MCPEDL/"
        required: true
        default: 'all'
        type: string

permissions:
  contents: write

concurrency:
  group: auto-version-bump-${{ github.ref }}
  cancel-in-progress: false

jobs:
  bump-build-register:
    runs-on: ubuntu-latest
    # Dirtbound's dedicated world workflow owns its README and archive generation;
    # skip this generic release job when a push includes that map's source tree.
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') && (github.event_name == 'workflow_dispatch' || !contains(toJSON(github.event.commits), 'MCPEDL/maps/OneBlock-Dirtbound-Kingdom-Beta/')) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.x'

      - name: Ensure custom crafting recipes are always unlocked
        run: python3 scripts/ensure_recipe_unlocks.py

      - name: Bump versions, rebuild packages & register new projects
        id: process
        env:
          EVENT: ${{ github.event_name }}
          TARGET: ${{ github.event.inputs.target }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "workflow_dispatch" ]; then
            if [ -z "$TARGET" ] || [ "$TARGET" = "all" ]; then
              python3 scripts/auto_bump_and_build.py --all
            else
              python3 scripts/auto_bump_and_build.py --project "$TARGET"
            fi
          elif [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ]; then
            python3 scripts/auto_bump_and_build.py --base "$BEFORE"
          else
            python3 scripts/auto_bump_and_build.py --base "HEAD~1"
          fi

      - name: Synchronize OneBlock map READMEs
        run: python3 scripts/sync_oneblock_map_readmes.py

      - name: Validate manifest titles and creator attribution
        run: python3 scripts/validate_manifest_titles.py

      - name: Commit and push changes
        run: |
          set -euo pipefail
          git config --global user.name  "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          for dir in MCPEDL packs minigames maps builds; do
            if [ -d "$dir" ]; then git add "$dir"; fi
          done
          if [ -f README.md ]; then git add README.md; fi

          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore(release): auto-bump versions, rebuild packages & register new projects [skip ci]"
            git pull --rebase origin main
            git push origin main
          fi
