name: Build Changed Packs & Sync Catalogs

# PASSIVE BUILD. It runs by itself on every push to main (and daily), and always rebuilds ALL
# projects, so there is nothing to pick and nothing to configure.
#
#   - It NEVER bumps a version. Versions only change in "Publish to CurseForge".
#   - Each pack's BP and RP manifests are aligned to the highest version already in the pack.
#   - builds/<pack>/versions/V<X.Y.Z>/ (packages, source.zip, source.sha256, build_info.json) is
#     created or REFRESHED IN PLACE whenever the source or the packages differ from the snapshot.
#   - Catalogs, READMEs, download links, changelog views, CurseForge description views and image prompts are re-synced.
#     Description views and image prompts are rebuilt only for packs whose inputs changed.
#
# Publishing to CurseForge lives in its own workflow (publish-curseforge.yml). When a publish
# succeeds it starts this workflow once so the catalogs pick up the new version.
# "Run workflow" is still available for a manual full rebuild (it has no options).

on:
  push:
    branches:
      - main
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

# Least privilege by default; the job asks for what it needs.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: release-build-refresh
      cancel-in-progress: false
    # Pushes only: skip bot commits, and skip when the push touches Dirtbound's source tree
    # (its dedicated world build owns that README and archives).
    if: ${{ github.event_name != 'push' || (!contains(github.event.head_commit.message, '[skip ci]') && !contains(toJSON(github.event.commits), 'MCPEDL/Maps/OneBlock-Dirtbound-Kingdom-Beta/')) }}

    steps:
      - name: Check out the triggering branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'

      - name: Migrate legacy X.Y.Z.A versions and changelogs to X.Y.Z
        run: python3 scripts/migrate_three_part_versions.py

      - name: Normalize all manifests to X.Y.Z
        run: python3 scripts/manifest_tools.py --all --align

      - name: Ensure custom crafting recipes are always unlocked
        run: python3 scripts/ensure_recipe_unlocks.py

      - name: Convert icon files to pack_icon.png
        run: |
          set -euo pipefail
          pip install -r requirements.txt
          python3 scripts/make_pack_icon.py

      - name: Rebuild packages & register new projects
        id: process
        env:
          PACK_FILENAME_TEMPLATE: ${{ vars.PACK_FILENAME_TEMPLATE }}
          # This workflow NEVER changes versions. Publishing owns every version bump.
          AUTO_BUMP_MANIFEST: "false"
        run: |
          set -euo pipefail
          # Passive build: every run rebuilds ALL projects and re-syncs the catalogs. Manifest
          # versions are only aligned to the highest one already in the pack; when the source
          # changed, builds/<pack>/versions/V<X.Y.Z>/ is refreshed in place.
          echo "Running: python3 scripts/auto_bump_and_build.py --all"
          python3 scripts/auto_bump_and_build.py --all

      # Generic pack builds do not create .mcworld files. Rebuild eligible OneBlock
      # archives here before synchronizing links; test-gated maps remain owned by
      # their dedicated world-build workflow.
      - name: Rebuild non-test-gated OneBlock world archives
        env:
          ONEBLOCK_TEST_GATED_MAPS: OneBlock-Dirtbound-Kingdom-Beta
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r config; do
            project="${config%/oneblock.json}"
            map="${project##*/}"
            case " ${ONEBLOCK_TEST_GATED_MAPS//,/ } " in
              *" $map "*) echo "Skipping test-gated OneBlock world build: $map"; continue ;;
            esac
            echo "Building current OneBlock world archives: $map"
            ONEBLOCK_MAP="$map" python3 scripts/build_oneblock_variants_from_template.py
          done < <(find MCPEDL/Maps -type f -name oneblock.json -print | sort)

      - name: Synchronize OneBlock map READMEs
        env:
          ONEBLOCK_SKIP_MAPS: OneBlock-Dirtbound-Kingdom-Beta
        run: python3 scripts/sync_oneblock_map_readmes.py

      - name: Sync every README link to the current builds
        run: |
          set -uo pipefail
          set +e
          python3 scripts/sync_readme_links.py 2>&1 | tee "$RUNNER_TEMP/readme-links.log"
          STATUS=${PIPESTATUS[0]}
          {
            echo "### README link sync (follows the manifest version)"
            echo '```'
            cat "$RUNNER_TEMP/readme-links.log"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$STATUS"

      - name: Refresh GitHub and CurseForge changelog views
        run: python3 scripts/build_changelog_views.py --all

      - name: Standardize DESCRIPTION files
        run: |
          set -uo pipefail
          set +e
          python3 scripts/remake_docs.py --remake standardize --all --docs description 2>&1 | tee "$RUNNER_TEMP/description-standardize.log"
          STATUS=${PIPESTATUS[0]}
          {
            echo "### DESCRIPTION standardization"
            echo '```'
            cat "$RUNNER_TEMP/description-standardize.log"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$STATUS"

      - name: Refresh CurseForge description views (changed packs only)
        run: python3 scripts/build_description_views.py --all --style all --changed || echo "::warning::Some description views could not be built (see log)."

      - name: Refresh Logo and Banner image prompts (changed packs only)
        run: python3 scripts/build_image_prompts.py --all --changed || echo "::warning::Some image prompts could not be built (see log)."

      - name: Verify builds/ snapshots match source and manifest versions (report only)
        continue-on-error: true
        run: |
          {
            echo "### Snapshot verification"
            echo '```'
            python3 scripts/auto_bump_and_build.py --verify || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Validate manifest titles and creator attribution
        run: python3 scripts/validate_manifest_titles.py

      - name: Check every manifest in the repository (report only)
        continue-on-error: true
        run: |
          {
            echo "### Whole-repository manifest check"
            echo '```'
            python3 scripts/check_manifest_versions.py || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Audit README and DESCRIPTION status (report only)
        continue-on-error: true
        run: |
          {
            echo "### README audit"
            echo '```'
            python3 scripts/check_readme_status.py || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Commit and push changes
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for dir in MCPEDL builds changelog_views description_views image_prompts; do
            if [ -d "$dir" ]; then git add "$dir"; fi
          done
          if [ -f README.md ]; then git add README.md; fi
          if [ -f Mcpeworlds/README.md ]; then git add Mcpeworlds/README.md; fi

          if git diff --cached --quiet; then
            echo "Nothing to commit: packages, catalogs and READMEs are up to date."
          else
            git commit -m "chore(build): rebuild packages and sync catalogs [skip ci]"
            python3 scripts/git_push_retry.py --branch "${GITHUB_REF#refs/heads/}"
          fi
