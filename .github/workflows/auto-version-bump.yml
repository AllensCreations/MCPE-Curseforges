name: Build Changed Packs & Sync Catalogs

# Rebuild packs and synchronize their catalogs without changing manifest versions.

on:
  push:
    branches:
      - main
    paths:
      - 'MCPEDL/Addons/**'
      - 'MCPEDL/Script/**'
      - 'MCPEDL/Minigame/**'
      - 'MCPEDL/Maps/**'
      - 'scripts/ensure_recipe_unlocks.py'
  # Daily refresh, even when no source files changed (never bumps versions).
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:
    inputs:
      scope:
        description: "What to process"
        required: true
        default: all
        type: choice
        options:
          - all
          - one project (pick it below)
      addon:
        description: "Project from MCPEDL/Addons (only when scope = one project)"
        required: true
        default: "-"
        type: choice
        options:
          # BEGIN addon
          - "-"
          - "Fletching-Table-Arsenal"
          - "Ghast-Mob-Head-Transformers"
          - "Grand-Banquets"
          - "Grimoire-Relics-V2"
          - "Harvest-Intelligence"
          - "Immortal-Pets"
          - "Magnetic-Satchel"
          - "Melody-Figurine"
          - "Mining-Helmet"
          - "Monster-Companions"
          - "One-Block-Economy"
          - "Passive-Auto-Switch-Tools"
          - "Selective-Mob-Controller"
          - "Smart-Tree-Capitator-and-Domino-Ore-Miner"
          - "Sudden-Death-Roulette"
          - "Swarm-Mob-Booster"
          - "Tameable-Companion-Fox"
          - "Universal-Clutch"
          - "Vanilla-Quality-of-Life"
          # END addon
      script:
        description: "Project from MCPEDL/Script (only when scope = one project)"
        required: true
        default: "-"
        type: choice
        options:
          # BEGIN script
          - "-"
          # END script
      minigame:
        description: "Project from MCPEDL/Minigame (only when scope = one project)"
        required: true
        default: "-"
        type: choice
        options:
          # BEGIN minigame
          - "-"
          - "Alphabet-Scavenger-Hunt"
          - "Mob-Chaos-Behavioral-Roulette"
          - "Shared-Hivemind-Inventory"
          - "Tethered-Breaker-And-Builder"
          - "Trivia-Vault-The-Locked-World"
          # END minigame
      map:
        description: "Project from MCPEDL/Maps (only when scope = one project)"
        required: true
        default: "-"
        type: choice
        options:
          # BEGIN map
          - "-"
          - "OneBlock-Dirtbound-Kingdom-Beta"
          - "Oneblock-SM"
          - "OneBlock-Void-Survival"
          # END map
      other:
        description: "Optional: project path or name missing from the lists above"
        required: false
        default: ""
        type: string
permissions:
  contents: write

concurrency:
  group: release-build-refresh
  cancel-in-progress: false

jobs:
  release-refresh:
    runs-on: ubuntu-latest
    # Pushes only: skip bot commits, and skip when the push touches Dirtbound's
    # source tree (its dedicated world workflow owns that README and archives).
    if: ${{ github.event_name != 'push' || (!contains(github.event.head_commit.message, '[skip ci]') && !contains(toJSON(github.event.commits), 'MCPEDL/Maps/OneBlock-Dirtbound-Kingdom-Beta/')) }}

    steps:
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.x'

      - name: Ensure custom crafting recipes are always unlocked
        run: python3 scripts/ensure_recipe_unlocks.py

      - name: Convert icon files to pack_icon.png
        run: |
          set -euo pipefail
          pip install pillow
          python3 scripts/make_pack_icon.py

      - name: Rebuild packages & register new projects
        id: process
        env:
          EVENT: ${{ github.event_name }}
          SCOPE: ${{ github.event.inputs.scope }}
          ADDON: ${{ github.event.inputs.addon }}
          SCRIPT: ${{ github.event.inputs.script }}
          MINIGAME: ${{ github.event.inputs.minigame }}
          MAP: ${{ github.event.inputs.map }}
          OTHER: ${{ github.event.inputs.other }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          ARGS=()
          case "$EVENT" in
            schedule)
              ARGS=(--all)
              ;;
            workflow_dispatch)
              if [ "$SCOPE" = "all" ]; then
                ARGS=(--all)
              else
                PICKS=()
                [ -n "$ADDON" ]     && [ "$ADDON" != "-" ]     && PICKS+=("MCPEDL/Addons/$ADDON")
                [ -n "$SCRIPT" ]    && [ "$SCRIPT" != "-" ]    && PICKS+=("MCPEDL/Script/$SCRIPT")
                [ -n "$MINIGAME" ]  && [ "$MINIGAME" != "-" ]  && PICKS+=("MCPEDL/Minigame/$MINIGAME")
                [ -n "$MAP" ]       && [ "$MAP" != "-" ]       && PICKS+=("MCPEDL/Maps/$MAP")
                [ -n "$OTHER" ]                                && PICKS+=("$OTHER")
                if [ "${#PICKS[@]}" -ne 1 ]; then
                  echo "::error::scope is 'one project': pick exactly one project (found ${#PICKS[@]}). Leave the other lists on '-'."
                  exit 1
                fi
                ARGS=(--project "${PICKS[0]}")
              fi
              ;;
            *)
              if [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ]; then
                ARGS=(--base "$BEFORE")
              else
                ARGS=(--base "HEAD~1")
              fi
              ;;
          esac
          echo "Running: python3 scripts/auto_bump_and_build.py ${ARGS[*]}"
          python3 scripts/auto_bump_and_build.py "${ARGS[@]}"

      - name: Synchronize OneBlock map READMEs
        run: python3 scripts/sync_oneblock_map_readmes.py

      - name: Standardize DESCRIPTION files
        run: |
          set -uo pipefail
          set +e
          python3 scripts/remake_docs.py --remake standardize --all --docs description 2>&1 | tee "$RUNNER_TEMP/description-standardize.log"
          STATUS=${PIPESTATUS[0]}
          {
            echo "### DESCRIPTION standardization"
            echo '```'
            cat "$RUNNER_TEMP/description-standardize.log"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$STATUS"

      - name: Validate manifest titles and creator attribution
        run: python3 scripts/validate_manifest_titles.py

      - name: Check every manifest in the repository (report only)
        continue-on-error: true
        run: |
          {
            echo "### Whole-repository manifest check"
            echo '```'
            python3 scripts/check_manifest_versions.py || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Audit README and DESCRIPTION status (report only)
        continue-on-error: true
        run: |
          {
            echo "### README audit"
            echo '```'
            python3 scripts/check_readme_status.py || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish changed packs with saved CurseForge IDs
        if: steps.process.outputs.has_rebuilt_projects == 'true'
        env:
          EVENT: ${{ github.event_name }}
          REBUILT_PROJECTS: ${{ steps.process.outputs.rebuilt_projects }}
          CURSEFORGE_API_TOKEN: ${{ secrets.CURSEFORGE_API_TOKEN }}
        run: |
          set -euo pipefail
          while IFS= read -r PROJECT_PATH; do
            [ -n "$PROJECT_PATH" ] || continue
            if [[ "$EVENT" == "push" && "$PROJECT_PATH" == MCPEDL/Maps/* && -f "$PROJECT_PATH/oneblock.json" ]]; then
              echo "OneBlock map worlds are published by the dedicated world-build workflow: $PROJECT_PATH"
              continue
            fi
            python3 scripts/auto_publish_curseforge.py --project "$PROJECT_PATH"
          done <<< "$REBUILT_PROJECTS"

      - name: Commit and push changes
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          for dir in MCPEDL packs minigames maps builds; do
            if [ -d "$dir" ]; then git add "$dir"; fi
          done
          if [ -f README.md ]; then git add README.md; fi
          if [ -f Mcpeworlds/README.md ]; then git add Mcpeworlds/README.md; fi

          if git diff --cached --quiet; then
            echo "Nothing to commit: packages, catalogs and READMEs are up to date."
          else
            git commit -m "chore(build): rebuild packages and sync catalogs [skip ci]"
            git pull --rebase origin main
            git push origin main
          fi
