name: Auto-Bump Pack Version & Rebuild Distribution

on:
  push:
    branches:
      - main
    paths:
      - 'MCPEDL/**'
      - 'packs/**'
      - 'minigames/**'
      - 'maps/**'
      - '!builds/**'
      - '!scripts/**'
      - '!.github/**'
  workflow_dispatch:
    inputs:
      project:
        description: 'Specific pack/script/map directory to bump (optional, leave empty for auto-detect)'
        required: false
        type: string

permissions:
  contents: write

jobs:
  bump-and-build:
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Detect Changes and Bump Version (+0.0.1) & Rebuild Packages
        id: bump
        run: |
          if [ "${{ github.event.inputs.project }}" != "" ]; then
            python3 scripts/auto_bump_and_build.py --project "${{ github.event.inputs.project }}"
          else
            python3 scripts/auto_bump_and_build.py --base "${{ github.event.before }}"
          fi

      - name: Commit and Push Updated Manifests, Builds, and Documentation
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Stage updated manifests, builds, maps, and documentation
          git add MCPEDL/ packs/ minigames/ maps/ builds/ README.md
          
          if git diff --staged --quiet; then
            echo "No version bump or package rebuild changes to commit."
          else
            git commit -m "chore(release): auto-bump pack version and rebuild distribution [skip ci]"
            git push origin main
          fi
