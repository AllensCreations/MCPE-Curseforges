name: Build OneBlock Dirtbound Kingdom Add-on

on:
  workflow_dispatch:
  push:
    paths:
      - 'MCPEDL/maps/OneBlock-Dirtbound-Kingdom-Beta/behavior_pack/**'
      - 'MCPEDL/maps/OneBlock-Dirtbound-Kingdom-Beta/resource_pack/**'
      - 'scripts/build_dirtbound_addon.py'
      - '.github/workflows/build-dirtbound-beta.yml'

permissions:
  contents: write

# Only the newest source revision should publish a package; older runs can
# otherwise race and attempt to rebase conflicting binary archives.
concurrency:
  group: dirtbound-kingdom-build
  cancel-in-progress: true

jobs:
  build-addon-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Check JavaScript syntax
        run: |
          cp MCPEDL/maps/OneBlock-Dirtbound-Kingdom-Beta/behavior_pack/scripts/main.js /tmp/main.mjs
          node --check /tmp/main.mjs
      - name: Verify startup recovery ordering
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("MCPEDL/maps/OneBlock-Dirtbound-Kingdom-Beta/behavior_pack/functions/oneblock_tick.mcfunction")
          source = path.read_text(encoding="utf-8")
          required = [
              "setworldspawn 0 65 0",
              "gamerule spawnradius 0",
              "execute if block 0 63 0 air run setblock 0 63 0 bedrock",
              "execute if score #stage dirtbound_core matches 9 if block 0 64 0 air run setblock 0 64 0 netherite_block",
              "execute if block 0 64 0 air run setblock 0 64 0 dirt",
          ]
          missing = [line for line in required if line not in source]
          if missing:
              raise SystemExit("Missing OneBlock recovery commands: " + repr(missing))
          if source.index(required[3]) > source.index(required[4]):
              raise SystemExit("The Dirt fallback must follow stage-specific restoration.")
          if "execute unless score #setup dirtbound_core matches 1 run setworldspawn" in source:
              raise SystemExit("World spawn must not depend on scoreboard initialization.")
          print("OneBlock spawn, footing, and restoration order validated.")
          PY
      - name: Build and validate current MCAddon
        run: python3 scripts/build_dirtbound_addon.py
      - name: Publish generated package
        run: |
          set -euo pipefail
          output_dir="builds/OneBlock-Dirtbound-Kingdom-Beta"
          version="$(python3 -c 'import json; print(".".join(map(str, json.load(open("MCPEDL/maps/OneBlock-Dirtbound-Kingdom-Beta/behavior_pack/manifest.json"))["header"]["version"])))')"
          current_file="OneBlock Dirtbound Kingdom Beta by AllensCreations (V${version}).mcaddon"
          test -s "$output_dir/$current_file"
          # Remove old combined packages so downloads cannot silently stay on a stale version.
          find "$output_dir" -maxdepth 1 -type f -name '*.mcaddon' ! -name "$current_file" -delete
          git add "$output_dir"
          if git diff --cached --quiet; then
            echo "The committed package already matches the generated package."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Build OneBlock Dirtbound Kingdom v${version} package"
          # Other repository automation may commit concurrently; rebase before publishing.
          git pull --rebase origin main
          git push
      - name: Upload current MCAddon
        uses: actions/upload-artifact@v4
        with:
          name: OneBlock-Dirtbound-Kingdom-MCAddon
          path: builds/OneBlock-Dirtbound-Kingdom-Beta/*.mcaddon
          retention-days: 90
