name: Validate OneBlock Dirtbound Kingdom

on:
  workflow_dispatch:
  push:
    paths:
      - 'MCPEDL/maps/OneBlock-Dirtbound-Kingdom-Beta/behavior_pack/**'
      - 'MCPEDL/maps/OneBlock-Dirtbound-Kingdom-Beta/resource_pack/**'
      - '.github/workflows/build-dirtbound-beta.yml'

permissions:
  contents: read

jobs:
  validate-source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Check JavaScript syntax
        run: |
          cp MCPEDL/maps/OneBlock-Dirtbound-Kingdom-Beta/behavior_pack/scripts/main.js /tmp/main.mjs
          node --check /tmp/main.mjs
      - name: Verify startup recovery ordering
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("MCPEDL/maps/OneBlock-Dirtbound-Kingdom-Beta/behavior_pack/functions/oneblock_tick.mcfunction")
          source = path.read_text(encoding="utf-8")
          required = [
              "setworldspawn 0 65 0",
              "gamerule spawnradius 0",
              "execute if block 0 63 0 air run setblock 0 63 0 bedrock",
              "execute if score #stage dirtbound_core matches 9 if block 0 64 0 air run setblock 0 64 0 netherite_block",
              "execute if block 0 64 0 air run setblock 0 64 0 dirt",
          ]
          missing = [line for line in required if line not in source]
          if missing:
              raise SystemExit("Missing OneBlock recovery commands: " + repr(missing))
          if source.index(required[3]) > source.index(required[4]):
              raise SystemExit("The Dirt fallback must follow stage-specific restoration.")
          if "execute unless score #setup dirtbound_core matches 1 run setworldspawn" in source:
              raise SystemExit("World spawn must not depend on scoreboard initialization.")
          print("OneBlock spawn, footing, and restoration order validated.")
          PY
