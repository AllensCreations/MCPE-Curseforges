name: Create Project from Base64

# ONE workflow for importing AI payloads and for (re)building OneBlock worlds.
#   task = import (default)        decode a base64 project ZIP, validate, write, build worlds, commit.
#   task = rebuild-worlds          rebuild the Creative/Survival/Hardcore .mcworld files for one map
#                                  (map_name) or all maps (blank). Also runs automatically on pushes
#                                  to main that touch maps, world foundations or the builders.
# (replaces the separate "Build OneBlock Creative, Survival, and Hardcore Worlds" workflow)

# Paste the base64 produced by an AI agent (see PACK_GENERATOR_INSTRUCTIONS.md).
# The ZIP's project.json decides the type:
#   addon  -> MCPEDL/Addons/<Name>/
#   map    -> MCPEDL/Maps/<Name>/      (+ Creative/Survival/Hardcore worlds)
#   script   -> MCPEDL/Script/<Name>/    (.mcpack + Creative test world)
#   minigame -> MCPEDL/Minigame/<Name>/  (.mcaddon + Controller + Creative test world)
# Nothing needs typing: commit one .b64 file to MCPEDL/incoming/, pick import_mode, run.
#   project_name blank    -> taken from the .b64 file name
#   payload_file blank    -> the only .b64 in MCPEDL/incoming/ (a bare file name also works)
# import_mode:
#   auto      -> update if the project already exists, otherwise create (default)
#   create    -> new project only; fails if the folder already exists
#   update    -> merge the payload into the existing project, wherever it lives
#                (Addons, Maps, Script, Minigame). Files not in the payload
#                (icons, images, LOCK, banners) are kept. Nothing is deleted.
#   overwrite -> replace the whole project folder with the payload
# Structural checks only: never an in-game test.
# commit_mode pull_request (default) opens a pull request for review; direct pushes to the branch.

on:
  push:
    branches: [main]
    paths:
      - "MCPEDL/Maps/**"
      - "Mcpeworlds/**"
      - "scripts/build_oneblock_variants_from_template.py"
      - "scripts/sync_oneblock_map_readmes.py"
      - ".github/workflows/create-project-from-base64.yml"
      - "INSTRUCTIONS.md"
  workflow_dispatch:
    inputs:
      task:
        description: "import = create/update a project from a payload (default); rebuild-worlds = rebuild OneBlock world archives"
        required: true
        default: import
        type: choice
        options:
          - import
          - rebuild-worlds
      map_name:
        description: "[rebuild-worlds] Map folder under MCPEDL/Maps/ (blank = build all maps)"
        required: false
        default: ""
        type: string
      import_mode:
        description: "[import] auto = update if it exists else create, create = new only, update = merge and keep other files, overwrite = replace everything"
        required: true
        default: auto
        type: choice
        options:
          - auto
          - create
          - update
          - overwrite
      project_name:
        description: "[import] Optional. Leave blank to use the .b64 file name (letters, numbers, . _ -)"
        required: false
        default: ""
        type: string
      payload_base64:
        description: "[import] Optional. Base64 of the project ZIP, single line. Leave blank to use a .b64 file."
        required: false
        default: ""
        type: string
      payload_file:
        description: "[import] Optional. Leave blank to use the only .b64 file in MCPEDL/incoming/ (or enter its file name)"
        required: false
        default: ""
        type: string
      commit_mode:
        description: "[import] pull_request opens a PR to review (default); direct pushes straight to the branch"
        required: false
        default: pull_request
        type: choice
        options:
          - pull_request
          - direct

permissions:
  contents: read

jobs:
  create:
    name: Import project and build worlds
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.task == 'import' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: create-project-from-base64-${{ github.ref }}
      cancel-in-progress: false
    env:
      PROJECT_NAME: ${{ inputs.project_name }}
      IMPORT_MODE: ${{ inputs.import_mode }}
      PROJECT_PAYLOAD: ${{ inputs.payload_base64 }}
      PAYLOAD_FILE: ${{ inputs.payload_file }}
      COMMIT_MODE: ${{ inputs.commit_mode }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Sync target branch before making changes (direct mode)
        if: ${{ inputs.commit_mode == 'direct' }}
        shell: bash
        run: |
          set -euo pipefail
          git pull --rebase origin "${GITHUB_REF_NAME}"

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"

      - name: Set up Node.js (script syntax check)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      - name: Check inputs
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$PROJECT_NAME" ]; then
            [[ "$PROJECT_NAME" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$ ]] \
              || { echo "::error::Name: letters, numbers, . _ - only (max 64)"; exit 1; }
          fi
          [[ "$IMPORT_MODE" == "auto" || "$IMPORT_MODE" == "create" || "$IMPORT_MODE" == "update" || "$IMPORT_MODE" == "overwrite" ]] \
            || { echo "::error::import_mode must be auto, create, update, or overwrite"; exit 1; }
          [[ "$COMMIT_MODE" == "pull_request" || "$COMMIT_MODE" == "direct" ]] \
            || { echo "::error::commit_mode must be pull_request or direct"; exit 1; }

      - name: Decode, validate, and write the project
        id: import
        shell: bash
        run: |
          set -euo pipefail
          ARGS=(--mode "$IMPORT_MODE" --github-output "$GITHUB_OUTPUT")
          if [ -n "$PROJECT_NAME" ]; then ARGS+=(--name "$PROJECT_NAME"); fi
          if [ -z "$PROJECT_PAYLOAD" ] && [ -n "$PAYLOAD_FILE" ]; then ARGS+=(--payload-file "$PAYLOAD_FILE"); fi
          python scripts/import_project_payload.py "${ARGS[@]}"

      # ---- maps: build the three OneBlock worlds ----
      - name: Check world foundations (maps)
        if: ${{ steps.import.outputs.type == 'map' }}
        shell: bash
        run: |
          set -euo pipefail
          for mode in Creative Survival Hardcore; do
            [ -f "Mcpeworlds/$mode/level.dat" ] \
              || { echo "::error::Missing foundation Mcpeworlds/$mode/level.dat"; exit 1; }
          done

      - name: Build worlds from Mcpeworlds foundations (maps)
        if: ${{ steps.import.outputs.type == 'map' }}
        run: python scripts/build_oneblock_variants_from_template.py

      - name: Synchronize map README with world archives (maps)
        if: ${{ steps.import.outputs.type == 'map' }}
        run: python scripts/sync_oneblock_map_readmes.py

      # ---- Addons, Scripts, and Minigames: build a Creative test world ----
      - name: Build test world (Add-on / Script / Minigame)
        if: ${{ steps.import.outputs.has_test_world == 'true' }}
        env:
          DEST: ${{ steps.import.outputs.dest }}
        run: python scripts/build_test_world.py --project "$DEST"

      - name: Verify generated worlds are database-free
        if: ${{ steps.import.outputs.type == 'map' || steps.import.outputs.has_test_world == 'true' }}
        shell: bash
        env:
          DEST: ${{ steps.import.outputs.dest }}
        run: |
          python3 - <<'PY'
          import glob, os, sys, zipfile
          folder = os.environ["DEST"]
          worlds = glob.glob(folder + "/*.mcworld")
          bad = []
          if not worlds:
              bad.append(f"No .mcworld produced in {folder}")
          for w in worlds:
              names = zipfile.ZipFile(w).namelist()
              if not any(n.endswith("level.dat") for n in names):
                  bad.append(f"{w}: missing level.dat")
              if any(n.startswith("db/") or "/db/" in n for n in names):
                  bad.append(f"{w}: contains db/ data")
          if bad:
              print("\n".join("::error::" + b for b in bad)); sys.exit(1)
          print(f"Structural checks passed for {len(worlds)} world(s). Not an in-game test.")
          PY

      - name: Upload worlds as artifact
        if: ${{ steps.import.outputs.type == 'map' || steps.import.outputs.has_test_world == 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.import.outputs.name }}-worlds
          path: ${{ steps.import.outputs.dest }}/*.mcworld
          if-no-files-found: error
          retention-days: 90

      - name: Commit project and worlds
        id: commit
        shell: bash
        env:
          DEST: ${{ steps.import.outputs.dest }}
          PTYPE: ${{ steps.import.outputs.type }}
          NAME: ${{ steps.import.outputs.name }}
          MODE: ${{ steps.import.outputs.mode }}
          PAYLOAD_PATH: ${{ steps.import.outputs.payload_path }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          BRANCH="import/${NAME}-${GITHUB_RUN_ID}"
          if [ "$COMMIT_MODE" = "pull_request" ]; then
            git checkout -b "$BRANCH"
          fi
          git add -A -- "$DEST"
          if [ -n "$PAYLOAD_PATH" ]; then
            git rm -q --ignore-unmatch -- "$PAYLOAD_PATH"
          fi
          if git diff --cached --quiet; then
            echo "No changes to commit."; exit 0
          fi
          case "$MODE" in
            create)    VERB="create" ;;
            update)    VERB="update" ;;
            overwrite) VERB="overwrite" ;;
          esac
          git commit -m "feat(${PTYPE}): ${VERB} ${NAME} from base64 payload [skip ci]"
          if [ "$COMMIT_MODE" = "direct" ]; then
            git push origin "HEAD:${GITHUB_REF_NAME}"
            echo "mode=direct" >> "$GITHUB_OUTPUT"
          else
            git push origin "$BRANCH"
            gh pr create --base "${GITHUB_REF_NAME}" --head "$BRANCH" \
              --title "${VERB^} ${PTYPE} ${NAME} from AI payload" \
              --body "AI-generated payload (mode: ${MODE}). Structural checks passed; nothing was tested in Minecraft. Review behavior_pack/scripts/, every .mcfunction, and the file list in this PR before merging."
            echo "mode=pull_request" >> "$GITHUB_OUTPUT"
          fi

      - name: Summary
        if: ${{ always() }}
        shell: bash
        env:
          OUT_TYPE: ${{ steps.import.outputs.type }}
          OUT_DEST: ${{ steps.import.outputs.dest }}
          OUT_NAME: ${{ steps.import.outputs.name }}
          OUT_MODE: ${{ steps.import.outputs.mode }}
        run: |
          {
            echo "### Create Project from Base64"
            echo "- Project: \`${OUT_NAME}\` (type: \`${OUT_TYPE}\`)"
            echo "- Import mode: \`${IMPORT_MODE}\` -> \`${OUT_MODE}\`"
            echo "- Folder: \`${OUT_DEST}\`"
            echo "- Commit mode: \`${COMMIT_MODE}\`"
            echo "- Verified: ZIP safety, manifests, UUIDs, dependencies, type-specific files (structural only)"
            echo "- **Not verified:** Minecraft loading the pack or gameplay. Test it in-game."
          } >> "$GITHUB_STEP_SUMMARY"

  # =====================================================================================
  # Rebuild OneBlock worlds (push to main, or task = rebuild-worlds)
  # =====================================================================================
  build-worlds:
    name: Build world modes
    if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.task == 'rebuild-worlds') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: build-oneblock-variants-${{ github.ref }}
      cancel-in-progress: false
    env:
      ONEBLOCK_MAP: ${{ inputs.map_name }}
    steps:
      - name: Checkout the branch that triggered this build
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'

      - name: Validate map name
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$ONEBLOCK_MAP" ]; then
            [[ "$ONEBLOCK_MAP" =~ ^[A-Za-z0-9._-]+$ ]] \
              || { echo "::error::Map name may only use letters, numbers, . _ -"; exit 1; }
            [ -f "MCPEDL/Maps/$ONEBLOCK_MAP/oneblock.json" ] \
              || { echo "::error::MCPEDL/Maps/$ONEBLOCK_MAP/oneblock.json not found"; exit 1; }
          fi

      - name: Align saved map releases to their changelogs
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          import sys
          from pathlib import Path

          sys.path.insert(0, "scripts")
          import prepare_curseforge_upload as release

          selected = os.environ.get("ONEBLOCK_MAP", "").strip()
          for config in sorted(Path("MCPEDL/Maps").glob("*/oneblock.json")):
              project = config.parent
              if selected and project.name != selected:
                  continue
              try:
                  release.read_info(f"MCPEDL/Maps/{project.name}")
              except ValueError:
                  continue  # not registered in builds/Curseforge_IDs.json
              version, _ = release.latest_changelog_entry(project / "CHANGELOG.md")
              release.align_manifests(project, version)
          PY

      - name: Build each mode from its matching Mcpeworlds foundation and the map's packs
        run: python scripts/build_oneblock_variants_from_template.py

      - name: Synchronize map README with generated world archives
        run: python scripts/sync_oneblock_map_readmes.py

      - name: Verify generated worlds are database-free
        shell: bash
        run: |
          python3 - <<'PY'
          import glob, os, sys, zipfile
          only = os.environ.get("ONEBLOCK_MAP", "").strip()
          bad = []
          for cfg in glob.glob("MCPEDL/Maps/*/oneblock.json"):
              folder = os.path.dirname(cfg)
              if only and os.path.basename(folder) != only:
                  continue
              for w in glob.glob(folder + "/*.mcworld"):
                  names = zipfile.ZipFile(w).namelist()
                  if not any(n.endswith("level.dat") for n in names):
                      bad.append(f"{w}: missing level.dat")
                  if any(n.startswith("db/") or "/db/" in n for n in names):
                      bad.append(f"{w}: contains db/ data")
          if bad:
              print("\n".join("::error::" + b for b in bad)); sys.exit(1)
          print("Structural checks passed (not an in-game test).")
          PY

      - name: Upload generated worlds as artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: oneblock-worlds
          path: ${{ inputs.map_name != '' && format('MCPEDL/Maps/{0}/*.mcworld', inputs.map_name) || 'MCPEDL/Maps/*/*.mcworld' }}
          if-no-files-found: error

      - name: Commit generated .mcworld files and README to the selected branch
        if: startsWith(github.ref, 'refs/heads/')
        shell: bash
        run: |
          set -euo pipefail
          git add -A -- MCPEDL/Maps
          if git diff --cached --quiet; then
            echo "No generated world changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "build(oneblock): regenerate database-free void worlds [skip ci]"
          python3 scripts/git_push_retry.py --branch "${GITHUB_REF#refs/heads/}"
