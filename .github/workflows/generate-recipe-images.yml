name: Generate Crafting Recipe Images

# Manual fallback. Build Changed Packs & Sync Catalogs now generates the recipe images in the same run as the
# Listing Kits, so this workflow no longer starts on pushes.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: generate-recipe-images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    steps:
      - name: Checkout add-on repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'

      - name: Install image libraries
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Export crafting recipe SVGs as PNGs
        run: python scripts/convert_crafting_recipe_svgs_to_png.py

      - name: Get MCicons (Minecraft item and block icons)
        run: python scripts/sync_mcicons.py || echo "::warning::MCicons could not be downloaded; vanilla icons cannot be drawn this run."


      - name: Generate recipe images for every pack
        run: python scripts/generate_recipe_images.py --all --all-items

      - name: Commit generated images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          find MCPEDL \( -path '*/assets/recipes/*.png' -o -path '*/assets/recipes/*.gif' -o -name all_recipes_sheet.png \) -print0 | xargs -0 -r git add
          if [ -f scripts/CRAFTING_TABLE.png ]; then git add scripts/CRAFTING_TABLE.png; fi
          # Stage optional recipe SVG exports only when the files exist.
          if compgen -G "assets/CRAFTING_RECIPE*.png" > /dev/null; then
            git add assets/CRAFTING_RECIPE*.png
          fi
          if git diff --cached --quiet; then
            echo "Recipe images are already up to date."
          else
            git commit -m "docs: regenerate source-based crafting recipe images [skip ci]"
            python3 scripts/git_push_retry.py --branch "${GITHUB_REF#refs/heads/}"
          fi
