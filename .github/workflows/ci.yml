name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pillow cairosvg

      - name: Syntax check Python
        run: python -m compileall -q scripts tests

      - name: Embedded generator in sync
        run: python scripts/check_generator_sync.py

      - name: Manifest titles
        run: python scripts/validate_manifest_titles.py

      - name: Crafting template test
        run: python tests/test_crafting_template.py

      - name: Lint workflows (actionlint)
        continue-on-error: true  # advisory until existing warnings are cleaned up
        run: |
          bash <(curl -sSL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
          ./actionlint -color
