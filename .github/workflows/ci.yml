name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Syntax check Python
        run: python -m compileall -q scripts tests

      - name: Migrate legacy Release.Alpha.Beta.Update versions to Release.Beta.Update
        run: python scripts/migrate_three_part_versions.py

      - name: Normalize manifest metadata and titles to X.Y.Z
        run: python scripts/manifest_tools.py --all --align

      - name: Manifest titles
        run: python scripts/validate_manifest_titles.py

      # Replaces the old standalone "Check Manifest Versions" workflow (it ran on pull requests).
      - name: Manifest versions, UUIDs and dependencies
        run: python scripts/check_manifest_versions.py

      - name: Validate every workflow YAML and the workflow names other workflows start
        run: |
          for workflow in .github/workflows/*.yml; do
            ruby -e 'require "yaml"; YAML.load_file(ARGV[0]); puts "#{ARGV[0]}: valid YAML"' "$workflow"
          done
          for ref in $(grep -rhoE '(--workflow|gh workflow run) [A-Za-z0-9_-]+\.yml' .github | awk '{print $NF}' | sort -u); do
            if [ ! -f ".github/workflows/$ref" ]; then
              echo "::error::A workflow starts or lists .github/workflows/$ref, but that file does not exist."
              exit 1
            fi
          done

      - name: Release dropdowns in sync
        continue-on-error: true  # advisory
        run: python scripts/sync_dispatch_choices.py --check

      - name: Instruction files (size, X.Y.Z, templates, references)
        run: python scripts/check_instruction_files.py

      - name: Context7 docs are up to date
        run: python scripts/build_context7_docs.py --check

      - name: Tests (every scripts/test_*.py)
        run: |
          status=0
          for t in scripts/test_*.py; do
            echo "== $t"
            python "$t" || { echo "::error::$t failed"; status=1; }
          done
          exit $status

      - name: Project pipeline self-test
        run: python scripts/selftest_project_types.py --fake-foundation

      - name: Repo tester (pack lint built from game log failures)
        continue-on-error: true  # advisory
        run: python scripts/run_repo_tests.py --only content
