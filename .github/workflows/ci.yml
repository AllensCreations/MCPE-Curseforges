name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Syntax check Python
        run: python -m compileall -q scripts tests

      - name: Migrate legacy Release.Alpha.Beta.Update versions to Release.Beta.Update
        run: python scripts/migrate_three_part_versions.py

      - name: Normalize manifest metadata and titles to X.Y.Z
        run: python scripts/manifest_tools.py --all --align

      - name: Manifest titles
        run: python scripts/validate_manifest_titles.py

      # Replaces the old standalone "Check Manifest Versions" workflow (it ran on pull requests).
      - name: Manifest versions, UUIDs and dependencies
        run: python scripts/check_manifest_versions.py

      - name: Validate build, publish and delete workflow YAML
        run: |
          for workflow in auto-version-bump publish-curseforge delete-project register-curseforge-id; do
            ruby -e 'require "yaml"; YAML.load_file(ARGV[0]); puts "#{ARGV[0]}: valid YAML"' ".github/workflows/${workflow}.yml"
          done

      - name: Release dropdowns in sync
        continue-on-error: true  # advisory
        run: python scripts/sync_dispatch_choices.py --check

      - name: Instruction files (size, X.Y.Z, templates, references)
        run: python scripts/check_instruction_files.py

      - name: Tests
        run: |
          python tests/test_crafting_template.py
          python scripts/test_manifest_tools.py
          python scripts/test_auto_bump_and_build.py
          python scripts/test_migrate_three_part_versions.py
          python scripts/test_auto_curseforge_publish.py
          python scripts/test_delete_project.py
          python scripts/test_changelog_names.py
          python scripts/test_make_pack_script.py
          python scripts/test_update_tools.py
          python scripts/test_description_views.py
          python scripts/test_generate_recipe_images.py
          python scripts/test_check_instruction_files.py
          python scripts/test_rename_packages.py
          python scripts/test_fetch_curseforge_logo.py

      - name: Project pipeline self-test
        run: python scripts/selftest_project_types.py --fake-foundation
