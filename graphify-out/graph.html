const width = window.innerWidth, height = window.innerHeight;
const svg = d3.select("svg").attr("viewBox", [0, 0, width, height]);
const g = svg.append("g");

svg.call(d3.zoom().scaleExtent([0.1, 8]).on("zoom", (e) => g.attr("transform", e.transform)));

const color = (t) => {
  if (t === "repository") return "#f43f5e";
  if (t === "category") return "#38bdf8";
  if (t === "project") return "#10b981";
  if (t === "pack") return "#f59e0b";
  if (t === "script") return "#818cf8";
  if (t === "javascript") return "#a855f7";
  return "#94a3b8";
};

const simulation = d3.forceSimulation(data.nodes)
  .force("link", d3.forceLink(data.links).id(d => d.id).distance(50))
  .force("charge", d3.forceManyBody().strength(-140))
  .force("center", d3.forceCenter(width / 2, height / 2));

const link = g.append("g").selectAll(".link")
  .data(data.links).join("line").attr("class", "link");

const node = g.append("g").selectAll(".node")
  .data(data.nodes).join("g").attr("class", "node")
  .call(d3.drag()
    .on("start", (e, d) => { if (!e.active) simulation.alphaTarget(0.3).restart(); d.fx = d.x; d.fy = d.y; })
    .on("drag", (e, d) => { d.fx = e.x; d.fy = e.y; })
    .on("end", (e, d) => { if (!e.active) simulation.alphaTarget(0); d.fx = null; d.fy = null; }));

node.append("circle").attr("r", d => d.type === "repository" ? 14 : (d.type === "category" ? 10 : 6)).attr("fill", d => color(d.type));
node.append("text").attr("dx", 8).attr("dy", ".35em").text(d => d.label);

simulation.on("tick", () => {
  link.attr("x1", d => d.source.x).attr("y1", d => d.source.y)
      .attr("x2", d => d.target.x).attr("y2", d => d.target.y);
  node.attr("transform", d => `translate(${d.x},${d.y})`);
});
</script>
